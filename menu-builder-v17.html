<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer v17</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Calibri,Arial,sans-serif}header{padding:12px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:22px}header p{margin:2px 0;color:var(--muted);font-size:12px}.wrap{max-width:1450px;margin:auto;padding:10px}.builder{width:100%;height:850px;border:1px solid var(--line);border-radius:12px;background:#fff}.planner{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.plannerHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:8px}.plannerTitle h2{margin:0;font-size:18px}.plannerTitle p{margin:3px 0 0;font-size:11px;color:var(--muted)}.dateBox{width:190px}.dateBox label{display:block;font-size:10px;font-weight:700;color:var(--muted)}input,select,button{font:inherit}input,select{width:100%;padding:7px;border:1px solid #d8d4cc;border-radius:7px;background:#fff;color:var(--ink)}.week{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.week summary{background:var(--sage);padding:10px;cursor:pointer;font-weight:700;list-style:none}.week summary::-webkit-details-marker{display:none}.weekTitle{display:flex;justify-content:space-between;align-items:center}.weekTitle .arrow{font-size:12px;margin-right:5px}.count{font-size:10px;color:var(--muted);font-weight:400}.daysHead{display:grid;grid-template-columns:105px 1fr 75px 75px 75px 28px;gap:7px;padding:6px 7px 4px;background:#fbf9f4;font-size:9px;color:var(--muted);font-weight:700}.day{display:grid;grid-template-columns:105px 1fr 75px 75px 75px 28px;gap:7px;align-items:center;padding:7px;border-top:1px solid var(--line)}.day:last-child{border-bottom:0}.dayName{font-weight:700}.dayDate{display:block;font-size:10px;color:var(--muted);font-weight:400}.day input,.day select{padding:6px}.lab{font-size:9px;text-align:center;color:var(--muted);margin-bottom:2px}.clearDay{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px}.empty{padding:12px;color:var(--muted);font-size:12px}.warning{margin-top:8px;padding:7px 9px;border-radius:8px;background:#fff4d6;font-size:11px;color:#715c35}.noMenu{padding:10px;background:#fff4d6;border-radius:8px;font-size:11px}@media(max-width:900px){.plannerHead{display:block}.dateBox{width:100%;margin-top:7px}.daysHead{display:none}.day{grid-template-columns:1fr 1fr 1fr 1fr 1fr 28px}.dayName{grid-column:1/-1}.day select{grid-column:1/4}.day>div:nth-child(3),.day>div:nth-child(4),.day>div:nth-child(5){grid-row:3}.clearDay{grid-row:3}}
</style></head><body><header><h1>🍽️ Gastenhuis Menubouwer v17</h1><p>Menu maken → opslaan → opnieuw gebruiken → plannen.</p></header><main class="wrap"><iframe id="builder" class="builder" src="menu-builder-v13.html" title="Menubouwer"></iframe><section class="planner"><div class="plannerHead"><div class="plannerTitle"><h2>📅 4-wekenplanning</h2><p>Kies per dag een opgeslagen menu. De aantallen horen bij die dag en veranderen het opgeslagen menu niet.</p></div><div class="dateBox"><label>Maandag van week 1</label><input id="startDate" type="date"></div></div><div id="weeks"></div></section></main><script>'use strict';const MENU_KEY='gastenhuis_menus_v1',PLAN_KEY='gastenhuis_4wekenplanning_v7',D=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];let plan={};try{plan=JSON.parse(localStorage.getItem(PLAN_KEY)||'{}')}catch(e){plan={}}const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function menus(){try{const a=JSON.parse(localStorage.getItem(MENU_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&x.name).map(x=>({id:String(x.id||x.name),name:String(x.name),normal:Number(x.normal??x.normalCount??35),veg:Number(x.veg??x.vegCount??0),lf:Number(x.lf??x.lfCount??0)})):[]}catch(e){return[]}}function save(){localStorage.setItem(PLAN_KEY,JSON.stringify(plan))}function dateFor(w,i){if(!$('startDate').value)return'';const s=new Date($('startDate').value+'T12:00:00');s.setDate(s.getDate()+w*7+i);return s.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'})}function weekRange(w){if(!$('startDate').value)return'';const a=new Date($('startDate').value+'T12:00:00');a.setDate(a.getDate()+w*7);const b=new Date(a);b.setDate(b.getDate()+6);return a.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit'})+' – '+b.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'})}function render(){const ms=menus();let h='';if(!ms.length)h+='<div class="noMenu">Nog geen opgeslagen menu’s. Sla eerst een menu op in de menubouwer hierboven.</div>';for(let w=0;w<4;w++){const assigned=D.reduce((n,_,i)=>n+(plan['w'+w+'d'+i]?.menuId?1:0),0);h+='<details class="week" '+(w===0?'open':'')+'><summary><div class="weekTitle"><span><span class="arrow">▶</span> Week '+(w+1)+' <span class="count">'+weekRange(w)+'</span></span><span class="count">'+assigned+'/7 dagen gepland</span></div></summary><div class="daysHead"><span>Dag</span><span>Opgeslagen menu</span><span>Normaal</span><span>Veggie</span><span>LF Veggie</span><span></span></div>';for(let i=0;i<7;i++){const id='w'+w+'d'+i,q=plan[id]||{};let opts='<option value="">— Kies opgeslagen menu —</option>'+ms.map(m=>'<option value="'+esc(m.id)+'" '+(q.menuId===m.id?'selected':'')+'>'+esc(m.name)+'</option>').join('');h+='<div class="day"><div class="dayName">'+D[i]+'<span class="dayDate">'+dateFor(w,i)+'</span></div><select data-menu="'+id+'">'+opts+'</select><div><div class="lab">Normaal</div><input type="number" min="0" value="'+(q.normal??35)+'" data-count="normal" data-id="'+id+'"></div><div><div class="lab">Veggie</div><input type="number" min="0" value="'+(q.veg??0)+'" data-count="veg" data-id="'+id+'"></div><div><div class="lab">LF Veggie</div><input type="number" min="0" value="'+(q.lf??0)+'" data-count="lf" data-id="'+id+'"></div><button class="clearDay" title="Dag wissen" data-clear="'+id+'">×</button></div>}h+='</details>'}$('weeks').innerHTML=h;document.querySelectorAll('[data-menu]').forEach(x=>x.onchange=()=>{let q=plan[x.dataset.menu]||{};q.menuId=x.value;if(x.value){const m=ms.find(m=>m.id===x.value);if(m){q.normal=q.normal??m.normal;q.veg=q.veg??m.veg;q.lf=q.lf??m.lf}}else{delete q.menuId}plan[x.dataset.menu]=q;save();render()});document.querySelectorAll('[data-count]').forEach(x=>x.onchange=()=>{let q=plan[x.dataset.id]||{};q[x.dataset.count]=Math.max(0,Number(x.value)||0);plan[x.dataset.id]=q;save()});document.querySelectorAll('[data-clear]').forEach(x=>x.onclick=()=>{delete plan[x.dataset.clear];save();render()})}function init(){if(!plan.startDate){const n=new Date(),d=(n.getDay()+6)%7;n.setDate(n.getDate()-d);plan.startDate=n.toISOString().slice(0,10);save()}$('startDate').value=plan.startDate;render()}$('startDate').onchange=()=>{plan.startDate=$('startDate').value;save();render()};window.addEventListener('storage',render);window.addEventListener('focus',render);init();</script></body></html>
