<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feestdagen & specials · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--line:#e9e2d8;--peach:#fff0e2}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1000px;margin:auto;padding:20px 16px 50px}.back{color:var(--green);text-decoration:none;font-weight:800;font-size:13px}h1{margin:16px 0 3px}.sub{color:var(--muted);margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}.filter.active{background:#e9f1e5;border-color:#cbdac6}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;margin-bottom:15px;font-size:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;min-height:145px;box-shadow:0 5px 18px rgba(70,75,65,.05)}.badge{display:inline-block;background:var(--peach);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800;color:var(--muted)}.card h2{font-size:19px;margin:10px 0 5px}.card p{font-size:13px;color:var(--muted);line-height:1.4;margin:0}.empty{padding:25px;background:#fff;border-radius:17px;color:var(--muted)}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.cards{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="start.html">← Keukenhulp</a><h1>🎉 Feestdagen & specials</h1><div class="sub">Een eigen kaartenbak voor bijzondere dagen, thema's en momenten.</div><div class="filters"><button class="filter active" onclick="setFilter('Alles',this)">Alles</button><button class="filter" onclick="setFilter('Feestdag',this)">🎄 Feestdagen</button><button class="filter" onclick="setFilter('Special',this)">✨ Specials</button></div><input id="search" class="search" placeholder="Zoeken in feestdagen & specials…" oninput="draw()"><div id="cards" class="cards"></div></main><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let data=[],filter='Alles';async function req(p){let r=await fetch(c.url+'/rest/v1/'+p,{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){data=await req('special_cards?gearchiveerd=eq.false&select=*&order=name');draw()}function setFilter(f,b){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()}function draw(){let q=search.value.trim().toLowerCase(),a=data.filter(x=>(filter==='Alles'||x.category===filter)&&[x.name,x.description,x.category].filter(Boolean).join(' ').toLowerCase().includes(q));cards.innerHTML=a.length?a.map(x=>`<article class="card"><span class="badge">${x.category==='Feestdag'?'🎉 Feestdag':'✨ Special'}</span><h2>${x.name}</h2><p>${x.description||'Nog verder in te vullen.'}</p></article>`).join(''):'<div class="empty">Geen kaarten gevonden.</div>'}load().catch(e=>{console.error(e);cards.innerHTML='<div class="empty">Kaarten konden niet worden geladen.</div>'});</script></body></html>
