<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feestdagen & specials · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--line:#e9e2d8;--peach:#fff0e2;--sage:#e9f1e5}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1000px;margin:auto;padding:20px 16px 50px}.back{color:var(--green);text-decoration:none;font-weight:800;font-size:13px}h1{margin:16px 0 3px}.sub{color:var(--muted);margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.new{border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 12px}.filter{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}.filter.active{background:var(--sage);border-color:#cbdac6}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;margin-bottom:15px;font-size:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;min-height:170px;box-shadow:0 5px 18px rgba(70,75,65,.05);display:flex;flex-direction:column}.badge{align-self:flex-start;background:var(--peach);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800;color:var(--muted)}.card h2{font-size:19px;margin:10px 0 5px}.card p{font-size:13px;color:var(--muted);line-height:1.4;margin:0 0 12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-weight:800;color:var(--green);cursor:pointer}.empty{padding:25px;background:#fff;border-radius:17px;color:var(--muted)}.modal{position:fixed;inset:0;background:#34433b66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.sheet{background:var(--bg);width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:20px;box-shadow:0 20px 60px #26342d33}.sheet h2{margin:0 0 15px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font:inherit}.field textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.cancel,.save{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.cancel{background:#eee8df;color:var(--ink)}.save{background:var(--green);color:#fff}.datebox{background:var(--sage);border-radius:14px;padding:12px;margin-top:8px}.hint{font-size:12px;color:var(--muted)}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="start.html">← Keukenhulp</a><div class="top"><div><h1>🎉 Feestdagen & specials</h1><div class="sub">Een eigen kaartenbak voor bijzondere dagen, thema's en momenten.</div></div><button class="new" onclick="editCard()">＋ Nieuwe kaart</button></div><div class="filters"><button class="filter active" onclick="setFilter('Alles',this)">Alles</button><button class="filter" onclick="setFilter('Feestdag',this)">🎄 Feestdagen</button><button class="filter" onclick="setFilter('Special',this)">✨ Specials</button></div><input id="search" class="search" placeholder="Zoeken in feestdagen & specials…" oninput="draw()"><div id="cards" class="cards"></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let data=[],filter='Alles';const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function req(p,opt={}){let r=await fetch(c.url+'/rest/v1/'+p,{...opt,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}async function load(){data=await req('special_cards?gearchiveerd=eq.false&select=*&order=name');draw()}function setFilter(f,b){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()}function draw(){let q=search.value.trim().toLowerCase(),a=data.filter(x=>(filter==='Alles'||x.category===filter)&&[x.name,x.description,x.category,x.menu_note,x.dessert_note,x.extras_note].filter(Boolean).join(' ').toLowerCase().includes(q));cards.innerHTML=a.length?a.map(x=>`<article class="card"><span class="badge">${x.category==='Feestdag'?'🎉 Feestdag':'✨ Special'}</span><h2>${esc(x.name)}</h2><p>${esc(x.description||'Nog verder in te vullen.')}</p><div class="actions"><button class="action" onclick="editCard(${x.id})">✏️ Bewerken</button><button class="action" onclick="planCard(${x.id})">📅 Op datum</button></div></article>`).join(''):'<div class="empty">Geen kaarten gevonden.</div>'}function closeModal(){modal.classList.remove('open')}function editCard(id){let x=data.find(y=>y.id===id)||{category:'Special'};sheet.innerHTML=`<h2>${id?'Kaart bewerken':'Nieuwe kaart'}</h2><div class="row"><div class="field"><label>Naam</label><input id="f-name" value="${esc(x.name||'')}"></div><div class="field"><label>Soort</label><select id="f-cat"><option ${x.category==='Feestdag'?'selected':''}>Feestdag</option><option ${x.category==='Special'?'selected':''}>Special</option></select></div></div><div class="field"><label>Korte omschrijving</label><textarea id="f-desc">${esc(x.description||'')}</textarea></div><div class="field"><label>🍽️ Menu-ideeën</label><textarea id="f-menu">${esc(x.menu_note||'')}</textarea></div><div class="field"><label>🍨 Dessert</label><textarea id="f-dessert">${esc(x.dessert_note||'')}</textarea></div><div class="field"><label>✨ Extra's / aankleding</label><textarea id="f-extra">${esc(x.extras_note||'')}</textarea></div><div class="field"><label>Notities</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="buttons"><button class="cancel" onclick="closeModal()">Annuleren</button><button class="save" onclick="saveCard(${id||'null'})">Opslaan</button></div>`;modal.classList.add('open')}async function saveCard(id){let body={name:document.getElementById('f-name').value.trim(),category:document.getElementById('f-cat').value,description:document.getElementById('f-desc').value.trim(),menu_note:document.getElementById('f-menu').value.trim(),dessert_note:document.getElementById('f-dessert').value.trim(),extras_note:document.getElementById('f-extra').value.trim(),notes:document.getElementById('f-notes').value.trim(),updated_at:new Date().toISOString()};if(!body.name){alert('Geef de kaart een naam.');return}try{if(id)await req(`special_cards?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(body)});else await req('special_cards',{method:'POST',body:JSON.stringify(body)});closeModal();await load()}catch(e){console.error(e);alert('Kaart kon niet worden opgeslagen.')}}function planCard(id){let x=data.find(y=>y.id===id);sheet.innerHTML=`<h2>📅 ${esc(x.name)}</h2><div class="datebox"><div class="field"><label>Op welke datum?</label><input id="plan-date" type="date"></div><div class="hint">De special komt bij die dag in je planning te staan. Menu en dessert blijven gewoon apart planbaar.</div></div><div class="buttons"><button class="cancel" onclick="closeModal()">Annuleren</button><button class="save" onclick="savePlan(${id})">Aan datum koppelen</button></div>`;modal.classList.add('open')}async function savePlan(id){let date=document.getElementById('plan-date').value;if(!date){alert('Kies eerst een datum.');return}try{await req('daily_special_plans',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates'},body:JSON.stringify({house:0,plan_date:date,special_id:id})});closeModal();alert('Special staat op '+new Date(date+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})+'.')}catch(e){console.error(e);alert('Special kon niet aan de datum worden gekoppeld.')}}load().catch(e=>{console.error(e);cards.innerHTML='<div class="empty">Kaarten konden niet worden geladen.</div>'});</script></body></html>
