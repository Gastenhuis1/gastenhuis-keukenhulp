<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--yellow:#f6e8a8;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Calibri,Arial,sans-serif}header{padding:12px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:22px}header p{margin:2px 0;color:var(--muted);font-size:12px}main{max-width:1350px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1fr 80px auto auto;gap:7px;align-items:end}.layout{display:grid;grid-template-columns:420px 1fr;gap:10px;margin-top:8px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}label{display:block;font-size:10px;font-weight:700;color:var(--muted)}input,button,select{font:inherit}input,select{width:100%;padding:7px;border:1px solid #d8d4cc;border-radius:7px;background:#fff;color:var(--ink)}button{border:0;border-radius:7px;padding:7px 10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.target,.mealTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.target button{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:11px}.target button.active,.mealTabs button.active{background:var(--green);color:#fff}.mealTabs button{background:var(--sage);color:var(--ink);font-size:12px}.catTabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}.catTabs button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 8px;font-size:11px}.catTabs button.active{background:#e7eee4;border-color:var(--green)}.searchbox{padding:8px;background:#f7f3eb;border-radius:9px}.search{display:flex;gap:4px}.search input{padding:8px;font-size:13px}.clear{background:#fff;color:var(--muted);border:1px solid var(--line)}.choices{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.choices button{background:#fff;color:var(--ink);border:1px solid #d8d4cc;padding:5px 7px;font-size:11px}.choices button.selected{background:var(--green);color:#fff}.chosen{margin-top:7px}.chosenTitle{font-size:10px;color:var(--muted);font-weight:700}.pill{display:inline-flex;align-items:center;gap:3px;background:var(--yellow);border-radius:99px;padding:4px 7px;margin:2px;font-size:11px}.pill button{background:none;color:#8a6550;padding:0;font-size:13px}.hint,.small{font-size:10px;color:var(--muted)}.menu{border:2px solid var(--green);border-radius:11px;padding:10px}.menuTitle{display:flex;justify-content:space-between;align-items:center}.menu h2{margin:0;font-size:18px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.counts input{padding:6px;font-size:12px}.previewGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.col{background:#f7f3eb;border-radius:8px;padding:8px;min-height:240px}.col h3{margin:0 0 2px;font-size:13px;text-align:center}.countBadge{text-align:center;font-size:10px;color:var(--muted);margin-bottom:5px}.section{border-top:1px solid var(--line);margin-top:7px;padding-top:6px}.sectionTitle{font-size:11px;font-weight:700;margin-bottom:3px}.line{font-size:11px;margin:2px 0}.saved{margin-top:8px}.savedRow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:11px}.savedRow button{padding:4px 7px;font-size:10px}.actions{display:flex;gap:4px}.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{background:var(--bg);width:min(760px,100%);max-height:85vh;overflow:auto;border-radius:14px;padding:12px}.modalHead{display:flex;justify-content:space-between;align-items:center}.dbadd{display:grid;grid-template-columns:1fr auto;gap:5px;margin:8px 0}.dbitem{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:5px 0;font-size:11px}@media(max-width:900px){.top,.layout{grid-template-columns:1fr}.previewGrid{grid-template-columns:1fr}}</style></head><body><header><h1>🍽️ Menubouwer</h1><p>Maak menu's, sla ze op en open ze later opnieuw.</p></header><main><div class="top"><div><label>Naam van het menu</label><input id="menuName" placeholder="Bijv. Kip kerrie – rijst – sperziebonen"></div><div><label>Totaal</label><input id="total" type="number" readonly value="35"></div><button id="saveBtn">💾 Opslaan</button><button class="secondary" id="newBtn">Nieuw</button></div><div class="layout"><section class="card"><div class="target"><button data-target="normal" class="active">Normaal</button><button data-target="veg">Veggie</button><button data-target="lf">LF Veggie</button></div><div class="mealTabs"><button data-meal="Lunch" class="active">🥪 Lunch</button><button data-meal="Diner">🍽️ Diner</button><button data-meal="Dessert">🍨 Dessert</button></div><div id="catTabs" class="catTabs"></div><div class="searchbox"><div class="search"><input id="searchInput" placeholder="Typ om te zoeken…"><button id="clearBtn" class="clear">×</button></div><div id="choices" class="choices"></div><div id="chosen" class="chosen"></div></div></section><section class="card"><div class="menu"><div class="menuTitle"><h2 id="previewName">Nieuw menu</h2><span>👥 <b id="previewTotal">35</b></span></div><div class="counts"><div><label>Normaal</label><input id="normalCount" type="number" min="0" value="35"></div><div><label>Veggie</label><input id="vegCount" type="number" min="0" value="0"></div><div><label>LF Veggie</label><input id="lfCount" type="number" min="0" value="0"></div></div><div class="previewGrid" id="previewGrid"></div></div></section></div><section class="card saved"><h2 style="margin:0 0 5px;font-size:15px">💾 Opgeslagen menu's</h2><div id="saved"></div></section></main><div id="dbModal" class="modal"><div class="modalBox"><div class="modalHead"><h2 style="margin:0">🗂️ Database</h2><button class="secondary" id="closeDb">Sluiten</button></div><div class="hint">De database volgt automatisch de gekozen categorie.</div><select id="dbCategory"></select><div class="dbadd"><input id="dbNew" placeholder="Nieuw onderdeel"><button id="dbAddBtn">+ Toevoegen</button></div><div id="dbList"></div></div></div><script>'use strict';
const MENU_KEY='gastenhuis_menus_v1';const DB_KEY='gastenhuis_menu_db';
const base={Lunch:['Krentenbol','Sauzijzenbroodje','Kroket','Kaassoufflé'],Dessert:['Advocaatmousse','Appelcompote','Appelmoes','Appeltaart','Bavarois','Brownie','Cake','Chocolade-ijs','Chocolademousse','Chocoladepudding','Chocoladevla','Dubbelvla','Fruitcocktail','Fruitsalade','Gebakken appel','Griekse yoghurt','Griesmeelpudding','Hangop','Hopjesvla','Karamelpudding','Kwark','Panna cotta','Pudding','Rijstepap','Roomijs','Sorbetijs','Stoofpeer','Tiramisu','Vanille-ijs','Vanillepudding','Vanillevla','Vers fruit','Vruchtencompote','Vruchtenkwark','Vruchtenmousse','Vruchtenyoghurt','Yoghurt'],Groente:['Andijvie','Asperges','Aubergine','Bietjes','Bloemkool','Boerenkool','Broccoli','Champignons','Courgette','Doperwten','Knolselderij','Komkommer','Koolrabi','Paprika','Pastinaak','Pompoen','Prei','Rode kool','Savooiekool','Sperziebonen','Spinazie','Spitskool','Spruitjes','Tomaat','Ui','Venkel','Waspeen','Winterpeen','Witlof','Witte kool','Wortel','Zuurkool'],Vegetarisch:['Ei','Falafel','Portobello','Seitan','Tempeh','Tofu','Vegetarisch gehakt','Vegetarische balletjes','Vegetarische burger','Vegetarische gehaktbal','Vegetarische kipstukjes','Vegetarische schnitzel','Vegetarische shoarma','Vegetarische worst'],Vis:['Garnalen','Gerookte zalm','Haring','Kabeljauw','Kibbeling','Koolvis','Lekkerbek','Makreel','Pangasius','Schol','Tilapia','Tonijn','Tonijn in blik','Zalm'],Vlees:['Beenham','Biefstuk','Gehaktbal','Half-om-half gehakt','Ham','Hamburger','Hamlap','Kalkoenfilet','Kipdrumstick','Kipfilet','Kipgehakt','Kippendij','Knakworst','Karbonade','Procureur','Riblap','Rookworst','Rosbief','Rundergehakt','Runderlap','Runderstoofvlees','Saucijs','Schnitzel','Slavink','Spek','Speklap','Sukadelap','Varkensfilet','Varkenshaas','Varkenslap','Verse worst'],Zetmeel:['Aardappelen','Aardappelkroketjes','Aardappelpuree','Aardappelpartjes','Bami','Friet','Macaroni','Pasta','Rijst','Rösti','Spätzle','Tagliatelle','Noedels'],Saus:['Boursinsaus','Champignonsaus','Kerriesaus','Kaassaus','Pepersaus','Roomsaus','Tomatensaus','Uiensaus','Zigeunersaus'],Lactosevrij:['Lactosevrije boter','Lactosevrije kookroom','Lactosevrije kwark','Lactosevrije melk','Lactosevrije roomkaas','Lactosevrije slagroom','Lactosevrije yoghurt']};
let stored=JSON.parse(localStorage.getItem(DB_KEY)||'{}');const DB={...base,...stored};Object.keys(base).forEach(k=>DB[k]=[...new Set([...(base[k]||[]),...(stored[k]||[])])]);localStorage.setItem(DB_KEY,JSON.stringify(DB));
function getMenus(){let raw=localStorage.getItem(MENU_KEY);if(raw){try{let a=JSON.parse(raw);if(Array.isArray(a))return a}catch(e){}}let found=[];for(let i=0;i<localStorage.length;i++){try{let v=JSON.parse(localStorage.getItem(localStorage.key(i)));if(Array.isArray(v))v.forEach(x=>{if(x&&typeof x==='object'&&(x.name||x.naam||x.menuName||x.title))found.push(normalizeMenu(x))})}catch(e){}}found=dedupeMenus(found);localStorage.setItem(MENU_KEY,JSON.stringify(found));return found}
function normalizeMenu(x){return {id:x.id||crypto.randomUUID(),name:x.name||x.naam||x.menuName||x.title,normal:Number(x.normal??x.normalCount??35),veg:Number(x.veg??x.vegCount??0),lf:Number(x.lf??x.lfCount??0),state:x.state||x.data||{}}}
function dedupeMenus(a){const m=new Map;a.forEach(x=>{if(x.name)m.set(x.name,x)});return [...m.values()]}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state={normal:{},veg:{},lf:{}};let target='normal',meal='Lunch',category='Lunch',editingId=null;
const cats={Lunch:['Lunch'],Diner:['Vlees/vis/kip','Groente','Zetmeel','Saus'],Dessert:['Dessert']},src={'Vlees/vis/kip':['Vlees','Vis']};
function items(c){return(c==='Vlees/vis/kip'?src[c]:[c]).flatMap(x=>DB[x]||[]).sort((a,b)=>a.localeCompare(b,'nl'))}
function render(){document.querySelectorAll('[data-target]').forEach(b=>b.classList.toggle('active',b.dataset.target===target));document.querySelectorAll('[data-meal]').forEach(b=>b.classList.toggle('active',b.dataset.meal===meal));const ct=$('catTabs');ct.innerHTML='';cats[meal].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;$('searchInput').value='';render()};ct.appendChild(b)});const q=$('searchInput').value.trim().toLowerCase(),chosen=state[target][category]||[],found=q?items(category).filter(x=>x.toLowerCase().includes(q)):[];$('choices').innerHTML=q?(found.length?found.map(x=>`<button class="${chosen.includes(x)?'selected':''}" data-p="${esc(x)}">${chosen.includes(x)?'✓ ':''}${esc(x)}</button>`).join(''):`<span class="small">Geen resultaat. <button class="secondary" id="add">＋ Toevoegen aan database</button></span>`):'<span class="small">Typ om te zoeken.</span>';$('choices').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pick(b.dataset.p));$('chosen').innerHTML=chosen.length?'<div class="chosenTitle">GEKOZEN</div>'+chosen.map(x=>`<span class="pill">${esc(x)} <button data-r="${esc(x)}">×</button></span>`).join(''):'<span class="small">Nog niets gekozen.</span>';$('chosen').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>pick(b.dataset.r));const add=$('add');if(add)add.onclick=addNew;renderPreview();renderSaved()}
function pick(x){state[target][category]=state[target][category]||[];const a=state[target][category];state[target][category]=a.includes(x)?a.filter(y=>y!==x):[...a,x];render()}
function addNew(){const x=$('searchInput').value.trim();if(!x)return;const dest=category==='Vlees/vis/kip'?'Vlees':category;DB[dest]=DB[dest]||[];if(!DB[dest].includes(x))DB[dest].push(x);localStorage.setItem(DB_KEY,JSON.stringify(DB));pick(x)}
function renderPreview(){const cols=[['normal','Normaal'],['veg','Veggie'],['lf','LF Veggie']];const total=cols.reduce((s,[k])=>s+(Number($(k+'Count').value)||0),0);$('total').value=total;$('previewTotal').textContent=total;$('previewName').textContent=$('menuName').value.trim()||'Nieuw menu';$('previewGrid').innerHTML=cols.map(([k,n])=>`<div class="col"><h3>${n}</h3><div class="countBadge">${Number($(k+'Count').value)||0} personen</div>${['Lunch','Diner','Dessert'].map(m=>{const entries=Object.entries(state[k]).filter(([c,a])=>a.length&&((m==='Lunch'&&c==='Lunch')||(m==='Dessert'&&c==='Dessert')||(m==='Diner'&&['Vlees/vis/kip','Groente','Zetmeel','Saus'].includes(c))));return `<div class="section"><div class="sectionTitle">${m}</div>${entries.length?entries.flatMap(([c,a])=>a.map(x=>`<div class="line">${esc(x)}</div>`)).join(''):'<div class="small">Nog niets gekozen.</div>'}</div>`}).join('')}</div>`).join('')}
function currentMenu(){return {id:editingId||crypto.randomUUID(),name:$('menuName').value.trim()||'Naamloos menu',normal:Number($('normalCount').value)||0,veg:Number($('vegCount').value)||0,lf:Number($('lfCount').value)||0,state:JSON.parse(JSON.stringify(state))}}
function saveMenu(){const menu=currentMenu(),a=getMenus(),i=a.findIndex(x=>x.id===menu.id||x.name===menu.name);if(i>=0)a[i]=menu;else a.push(menu);localStorage.setItem(MENU_KEY,JSON.stringify(a));editingId=menu.id;renderSaved();alert('Menu opgeslagen. Het is nu beschikbaar in de 4-wekenplanning.')}
function openMenu(id){const m=getMenus().find(x=>x.id===id);if(!m)return;editingId=m.id;$('menuName').value=m.name||'';$('normalCount').value=m.normal??35;$('vegCount').value=m.veg??0;$('lfCount').value=m.lf??0;state.normal=JSON.parse(JSON.stringify(m.state?.normal||{}));state.veg=JSON.parse(JSON.stringify(m.state?.veg||{}));state.lf=JSON.parse(JSON.stringify(m.state?.lf||{}));target='normal';meal='Lunch';category='Lunch';$('searchInput').value='';render();window.scrollTo({top:0,behavior:'smooth'})}
function newMenu(){editingId=null;$('menuName').value='';$('normalCount').value=35;$('vegCount').value=0;$('lfCount').value=0;state.normal={};state.veg={};state.lf={};target='normal';meal='Lunch';category='Lunch';$('searchInput').value='';render()}
function deleteMenu(id){const a=getMenus().filter(x=>x.id!==id);localStorage.setItem(MENU_KEY,JSON.stringify(a));if(editingId===id)newMenu();else renderSaved()}
function renderSaved(){const a=getMenus();$('saved').innerHTML=a.length?a.map(m=>`<div class="savedRow"><span><b>${esc(m.name)}</b> — ${m.normal||0} normaal / ${m.veg||0} veggie / ${m.lf||0} LF</span><span class="actions"><button data-open="${m.id}">Open</button><button class="secondary" data-del="${m.id}">Verwijder</button></span></div>`).join(''):'<span class="small">Nog geen opgeslagen menu’s.</span>';$('saved').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMenu(b.dataset.open));$('saved').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteMenu(b.dataset.del))}
function syncDb(){const keys=Object.keys(DB).sort((a,b)=>a.localeCompare(b,'nl'));$('dbCategory').innerHTML=keys.map(k=>`<option>${esc(k)}</option>`).join('');renderDbList()}
function renderDbList(){const k=$('dbCategory').value;const arr=(DB[k]||[]).slice().sort((a,b)=>a.localeCompare(b,'nl'));$('dbList').innerHTML=arr.map(x=>`<div class="dbitem"><span>${esc(x)}</span></div>`).join('')}
$('saveBtn').onclick=saveMenu;$('newBtn').onclick=newMenu;$('clearBtn').onclick=()=>{$('searchInput').value='';render()};$('searchInput').oninput=render;$('dbCategory').onchange=renderDbList;$('dbBtn').onclick=()=>{$('dbModal').classList.add('open');syncDb()};$('closeDb').onclick=()=>{$('dbModal').classList.remove('open')};$('dbAddBtn').onclick=()=>{const k=$('dbCategory').value,x=$('dbNew').value.trim();if(!x)return;DB[k]=DB[k]||[];if(!DB[k].includes(x))DB[k].push(x);localStorage.setItem(DB_KEY,JSON.stringify(DB));$('dbNew').value='';renderDbList()};document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{target=b.dataset.target;render()});document.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{meal=b.dataset.meal;category=cats[meal][0];$('searchInput').value='';render()});['normalCount','vegCount','lfCount','menuName'].forEach(id=>$(id).oninput=renderPreview);render();
</script></body></html>
