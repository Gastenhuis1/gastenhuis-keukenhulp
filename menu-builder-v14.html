<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer v14</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Calibri,Arial,sans-serif}header{padding:12px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:22px}header p{margin:2px 0;color:var(--muted);font-size:12px}main{max-width:1450px;margin:auto;padding:10px}.builder{width:100%;height:850px;border:1px solid var(--line);border-radius:12px;background:#fff}.planner{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.plannerHead{display:flex;justify-content:space-between;align-items:end;gap:12px}.dateBox{width:190px}.dateBox label{display:block;font-size:10px;font-weight:700;color:var(--muted)}input,select,button{font:inherit}input,select{width:100%;padding:7px;border:1px solid #d8d4cc;border-radius:7px;background:#fff;color:var(--ink)}.week{margin-top:9px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.week summary{background:var(--sage);padding:10px;cursor:pointer;font-weight:700}.day{display:grid;grid-template-columns:115px 1fr 82px 82px 82px 30px;gap:7px;align-items:center;padding:7px;border-bottom:1px solid var(--line)}.day:last-child{border-bottom:0}.dayName{font-weight:700}.dayDate{display:block;font-size:10px;color:var(--muted);font-weight:400}.lab{font-size:9px;text-align:center;color:var(--muted);margin-bottom:2px}.clearDay{border:0;background:none;color:var(--muted);font-size:19px;cursor:pointer}.empty{padding:12px;color:var(--muted);font-size:12px}.warning{margin-top:8px;padding:7px 9px;border-radius:8px;background:#fff4d6;font-size:11px;color:#715c35}.weekTitle{display:flex;justify-content:space-between;align-items:center}.count{font-size:10px;color:var(--muted);font-weight:400}@media(max-width:900px){.day{grid-template-columns:1fr 1fr 1fr 1fr 1fr 28px}.plannerHead{display:block}.dateBox{width:100%;margin-top:7px}}</style></head><body><header><h1>🍽️ Gastenhuis Menubouwer v14</h1><p>Menu maken → opslaan → opnieuw gebruiken → plannen.</p></header><main><iframe class="builder" src="menu-builder-v13.html" title="Menubouwer"></iframe><section class="planner"><div class="plannerHead"><div><h2 style="margin:0">📅 4-wekenplanning</h2><div style="font-size:11px;color:var(--muted)">Kies een opgeslagen menu per dag en vul daarna de aantallen in.</div></div><div class="dateBox"><label>Maandag van week 1</label><input id="startDate" type="date"></div></div><div id="weeks"></div></section></main><script>'use strict';const MENU_KEY='gastenhuis_menus_v1',PLAN_KEY='gastenhuis_4wekenplanning_v5',D=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];let plan={};try{plan=JSON.parse(localStorage.getItem(PLAN_KEY)||'{}')}catch(e){plan={}}const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function menus(){try{const a=JSON.parse(localStorage.getItem(MENU_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&x.name):[]}catch(e){return[]}}function save(){localStorage.setItem(PLAN_KEY,JSON.stringify(plan))}function dateFor(w,i){const s=new Date($('startDate').value+'T12:00:00');s.setDate(s.getDate()+w*7+i);return s.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit'})}function render(){const ms=menus();let h='';for(let w=0;w<4;w++){let assigned=D.reduce((n,_,i)=>n+(plan['w'+w+'d'+i]?.menuId?1:0),0);h+='<details class="week" '+(w===0?'open':'')+'><summary><div class="weekTitle"><span>Week '+(w+1)+'</span><span class="count">'+assigned+'/7 dagen gepland</span></div></summary>';for(let i=0;i<7;i++){const id='w'+w+'d'+i,q=plan[id]||{};let opts='<option value="">— Kies opgeslagen menu —</option>'+ms.map(m=>'<option value="'+esc(m.id)+'" '+(q.menuId===m.id?'selected':'')+'>'+esc(m.name)+'</option>').join('');h+='<div class="day"><div class="dayName">'+D[i]+'<span class="dayDate">'+dateFor(w,i)+'</span></div><select data-menu="'+id+'">'+opts+'</select><div><div class="lab">Normaal</div><input type="number" min="0" value="'+(q.normal??35)+'" data-count="normal" data-id="'+id+'"></div><div><div class="lab">Veggie</div><input type="number" min="0" value="'+(q.veg??0)+'" data-count="veg" data-id="'+id+'"></div><div><div class="lab">LF Veggie</div><input type="number" min="0" value="'+(q.lf??0)+'" data-count="lf" data-id="'+id+'"></div><button class="clearDay" title="Dag wissen" data-clear="'+id+'">×</button></div>'}h+='</details>'}if(!ms.length)h+='<div class="empty">Nog geen opgeslagen menu’s. Sla eerst een menu op in de menubouwer hierboven.</div>';else h+='<div class="warning">💡 De aantallen zijn per dag. Het opgeslagen menu zelf verandert daardoor niet.</div>';$('weeks').innerHTML=h;document.querySelectorAll('[data-menu]').forEach(x=>x.onchange=()=>{let q=plan[x.dataset.menu]||{};q.menuId=x.value;if(x.value){const m=ms.find(m=>m.id===x.value);if(m){q.normal=q.normal??Number(m.normal??35);q.veg=q.veg??Number(m.veg??0);q.lf=q.lf??Number(m.lf??0)}}plan[x.dataset.menu]=q;save();render()});document.querySelectorAll('[data-count]').forEach(x=>x.onchange=()=>{let q=plan[x.dataset.id]||{};q[x.dataset.count]=Math.max(0,Number(x.value)||0);plan[x.dataset.id]=q;save()});document.querySelectorAll('[data-clear]').forEach(x=>x.onclick=()=>{delete plan[x.dataset.clear];save();render()})}function initDate(){if(plan.startDate){$('startDate').value=plan.startDate}else{const n=new Date(),day=n.getDay(),diff=(day+6)%7;n.setDate(n.getDate()-diff);$('startDate').value=n.toISOString().slice(0,10);plan.startDate=$('startDate').value;save()}}$('startDate').onchange=()=>{plan.startDate=$('startDate').value;save();render()};initDate();render();window.addEventListener('storage',render);</script></body></html>
