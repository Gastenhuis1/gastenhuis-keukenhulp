<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer v8</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--yellow:#f6e8a8;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Calibri,Arial,sans-serif}header{padding:12px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:22px}header p{margin:2px 0;color:var(--muted);font-size:12px}.wrap{max-width:1350px;margin:auto;padding:10px}.builder{width:100%;height:760px;border:1px solid var(--line);border-radius:12px;background:#fff}.planner{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.planner h2{margin:0 0 4px;font-size:17px}.hint{font-size:11px;color:var(--muted);margin-bottom:9px}.week{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.weekHead{background:var(--sage);padding:7px 10px;font-weight:700}.days{display:grid;grid-template-columns:repeat(7,1fr)}.day{padding:7px;border-right:1px solid var(--line);min-width:0}.day:last-child{border-right:0}.dayName{font-weight:700;font-size:11px;margin-bottom:5px}.day select{width:100%;padding:6px;border:1px solid #d8d4cc;border-radius:7px;background:#fff;color:var(--ink);font:inherit;font-size:11px}.clear{margin-top:4px;border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.status{font-size:10px;color:var(--muted);margin-top:8px}@media(max-width:900px){.builder{height:900px}.days{grid-template-columns:1fr 1fr}.day{border-bottom:1px solid var(--line)}} </style></head><body><header><h1>🍽️ Gastenhuis Menubouwer</h1><p>Menu samenstellen bovenaan · 4-wekenplanning onderaan</p></header><div class="wrap"><iframe class="builder" src="menu-builder-v7.html" title="Menubouwer"></iframe><section class="planner"><h2>📅 Menuplanning – 4 weken</h2><div class="hint">Kies per dag een opgeslagen menu. Een keuze kan later gewoon vervangen worden door een ander menu.</div><div id="weeks"></div><div class="status" id="status"></div></section></div><script>(function(){'use strict';const days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];const key='gastenhuis_4wekenplanning';let plan=JSON.parse(localStorage.getItem(key)||'{}');function getMenus(){const out=[];const seen=new Set();for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);try{const v=JSON.parse(localStorage.getItem(k));if(Array.isArray(v)){v.forEach(x=>{if(x&&typeof x==='object'){const n=x.name||x.naam||x.menuName||x.title;if(n&&typeof n==='string'&&!seen.has(n)){seen.add(n);out.push({name:n,data:x})}}})}}catch(e){}}return out.sort((a,b)=>a.name.localeCompare(b.name,'nl'))}function render(){const menus=getMenus();const box=document.getElementById('weeks');let html='';for(let w=1;w<=4;w++){html+='<div class="week"><div class="weekHead">Week '+w+'</div><div class="days">';days.forEach((d,i)=>{const id='w'+w+'d'+i;const val=plan[id]||'';html+='<div class="day"><div class="dayName">'+d+'</div><select data-id="'+id+'"><option value="">— Kies menu —</option>'+menus.map(m=>'<option value="'+esc(m.name)+'" '+(m.name===val?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select><button class="clear" data-clear="'+id+'">wis</button></div>'});html+='</div></div>'}box.innerHTML=html||'<div class="hint">Nog geen opgeslagen menu’s gevonden. Sla eerst een menu op in de menubouwer hierboven.</div>';box.querySelectorAll('select').forEach(s=>s.onchange=function(){plan[this.dataset.id]=this.value;save()});box.querySelectorAll('[data-clear]').forEach(b=>b.onclick=function(){delete plan[this.dataset.clear];save();render()});document.getElementById('status').textContent=menus.length?menus.length+' opgeslagen menu'+(menus.length===1?'':'\'s')+' beschikbaar.':'Nog geen opgeslagen menu’s gevonden.'}function save(){localStorage.setItem(key,JSON.stringify(plan));document.getElementById('status').textContent='Planning opgeslagen.';setTimeout(render,400)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();window.addEventListener('storage',render)})();</script></body></html>
