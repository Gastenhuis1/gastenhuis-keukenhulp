<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastenhuis – Menubouwer</title>
<style>
:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--peach:#f6d7bd;--yellow:#f6e8a8;--line:#e9e2d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Calibri,Arial,sans-serif}
header{padding:14px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:25px}header p{margin:3px 0;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:12px}.top{display:grid;grid-template-columns:1fr 120px auto auto auto;gap:7px;align-items:end}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
input,button,select{font:inherit}input,select{width:100%;padding:8px;border:1px solid #d8d4cc;border-radius:8px;background:#fff;color:var(--ink)}button{border:0;border-radius:8px;padding:8px 11px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff;color:#a34b4b;border:1px solid #e3caca}
.status{height:20px;color:var(--green);font-size:12px;font-weight:700;padding-top:4px}.layout{display:grid;grid-template-columns:380px 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:7px 0}.card h2{margin:0 0 6px;font-size:17px}.hint,.small{font-size:11px;color:var(--muted)}
.block{border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}.blockHead{padding:8px 10px;background:var(--sage);font-weight:700;cursor:pointer}.block.closed .blockBody{display:none}.cat{border-top:1px solid var(--line);padding-bottom:4px}.cat h3{margin:0;padding:6px 9px;font-size:12px}.search{display:flex;gap:4px;padding:0 6px}.search input{padding:6px 7px;font-size:13px}.clear{padding:4px 8px;background:#fff;color:var(--muted);border:1px solid var(--line)}.choices{display:flex;flex-wrap:wrap;gap:4px;padding:5px 6px}.choices button{background:#fff;color:var(--ink);border:1px solid #d8d4cc;padding:5px 7px;font-size:12px}.choices button.selected{background:var(--green);color:#fff}.chosen{padding:0 6px 5px}.pill{display:inline-block;background:var(--yellow);border-radius:999px;padding:3px 6px;margin:1px;font-size:11px}
.preview{position:sticky;top:5px}.menu{border:2px solid var(--green);border-radius:12px;padding:12px}.menu h2{font-size:20px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}.counts label{font-size:10px;color:var(--muted)}.counts input{padding:6px;font-size:12px}.previewBlock{border-top:1px solid var(--line);margin-top:8px;padding-top:7px}.previewBlock h3{margin:0 0 5px;font-size:14px}.variants{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.variant{background:#f7f3eb;border-radius:8px;padding:6px}.variant b{font-size:11px}.line{font-size:12px;margin-top:2px}.saved{margin-top:8px}.savedRow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:7px 0;font-size:12px}.savedRow button{padding:5px 7px;font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{background:var(--bg);width:min(700px,100%);max-height:85vh;overflow:auto;border-radius:16px;padding:14px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalHead h2{margin:0}.dbadd{display:grid;grid-template-columns:1fr auto;gap:5px;margin:8px 0}.dbitem{display:flex;justify-content:space-between;gap:7px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}.noresult{padding:5px 6px;font-size:11px;color:var(--muted)}.addfound{background:var(--peach);color:var(--ink);border:0;margin-left:6px}
@media(max-width:850px){.top,.layout{grid-template-columns:1fr}.preview{position:static}.variants{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🍽️ Menubouwer</h1><p>Bouw een compleet menu uit losse onderdelen.</p></header>
<main>
<div class="top">
<div class="field"><label>Naam van het menu</label><input id="menuName" placeholder="Bijv. Kip kerrie – rijst – sperziebonen"></div>
<div class="field"><label>Totaal</label><input id="total" type="number" min="0" value="35"></div>
<button id="saveBtn">💾 Opslaan</button><button class="secondary" id="newBtn">Nieuw</button><button class="secondary" id="dbBtn">🗂️ Database</button>
</div>
<div id="status" class="status"></div>
<div class="layout">
<section class="card"><h2>Menu samenstellen</h2><div class="hint">Typ in een categorie. Als er niets bestaat, kun je het direct toevoegen.</div><div id="builder"></div></section>
<section class="card preview"><div class="menu"><h2 id="previewName">Nieuw menu</h2><div>👥 <b><span id="previewTotal">35</span> personen</b></div><div class="counts"><label>Normaal<input id="normalCount" type="number" min="0" value="35"></label><label>Veggie<input id="vegCount" type="number" min="0" value="0"></label><label>LF veggie<input id="lfCount" type="number" min="0" value="0"></label></div><div id="preview"></div></div></section>
</div>
<section class="card"><h2>💾 Opgeslagen menu's</h2><div id="saved" class="saved"></div></section>
</main>

<div id="dbModal" class="modal"><div class="modalBox"><div class="modalHead"><h2>🗂️ Database</h2><button class="secondary" id="closeDb">Sluiten</button></div><div class="hint">Kies een database. Voeg hier nieuwe onderdelen toe of verwijder ze.</div><select id="dbCategory"></select><div class="dbadd"><input id="dbNew" placeholder="Nieuw onderdeel"><button id="dbAddBtn">+ Toevoegen</button></div><div id="dbList"></div></div></div>

<script>
'use strict';
const DEFAULT_DB={
'Lunch':['Krentenbol','Sauzijzenbroodje','Kroket','Kaassoufflé','Eiersalade','Soep','Pasteitje','Broodmaaltijd'],
'Lunch veggie':['Vegetarische sandwich','Groentepasteitje','Kaassoufflé','Vegetarische soep'],
'Lunch lactosevrij veggie':['Lactosevrije vegetarische sandwich','Lactosevrij groentepasteitje','Lactosevrije soep'],
'Vlees/vis/kip':['Kip kerrie','Kip ketjap','Schnitzel','Hachee','Gehaktbal','Hamburger','Kip in tomatensaus','Stoofvlees','Zalm','Witvis','Vissticks','Kabeljauw','Tonijn'],
'Diner veggie':['Vegetarische balletjes','Vegetarische schnitzel','Groenteburger','Vegetarische curry','Courgette-tomaat','Portobello'],
'Diner lactosevrij veggie':['Lactosevrije vegetarische balletjes','Lactosevrije groenteburger','Lactosevrije vegetarische curry','Courgette-tomaat','Portobello'],
'Groenten':['Sperziebonen','Broccoli','Worteltjes','Rode kool','Bloemkool','Ratatouille','Bietjes','Witlof','Doperwten','Andijvie','Prei','Spinazie','Witte kool','Savooiekool'],
'Aardappel / rijst / pasta':['Aardappelen','Aardappelkroketjes','Aardappelpuree','Krieltjes','Rijst','Volkoren rijst','Pasta','Macaroni','Noodles'],
'Saus':['Jus','Kerriesaus','Boursinsaus','Roomsaus','Tomatensaus','Champignonsaus','Satésaus'],
'Salade':['Gemengde salade','Komkommersalade','Tomatensalade','Rauwkost'],
'Dessert':['Vanillevla','Chocoladevla','Yoghurt','Kwark','Fruitsalade','IJs','Advocaatmousse','Bavarois'],
'Dessert veggie':['Vegetarische yoghurt','Fruitsalade','Sorbetijs'],
'Dessert lactosevrij veggie':['Lactosevrije yoghurt','Fruitsalade','Lactosevrij sorbetijs']};
const groups={'🥪 Lunch':['Lunch','Lunch veggie','Lunch lactosevrij veggie'],'🍽️ Diner':['Vlees/vis/kip','Diner veggie','Diner lactosevrij veggie','Groenten','Aardappel / rijst / pasta','Saus','Salade'],'🍨 Dessert':['Dessert','Dessert veggie','Dessert lactosevrij veggie']};
const multi=new Set(['Groenten','Aardappel / rijst / pasta','Saus','Salade']);
let DB=loadJSON('gastenhuis_db_v2',DEFAULT_DB), selected={}, filters={}, open='🥪 Lunch';
function loadJSON(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x&&typeof x==='object'?x:JSON.parse(JSON.stringify(fallback))}catch(e){return JSON.parse(JSON.stringify(fallback))}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initState(){Object.keys(DB).forEach(k=>{selected[k]=[];filters[k]=''})}
function groupOf(cat){for(const [g,cats] of Object.entries(groups))if(cats.includes(cat))return g;return open}
function render(){
const b=document.getElementById('builder');b.innerHTML='';
for(const [g,cats] of Object.entries(groups)){
const wrap=document.createElement('div');wrap.className='block '+(g===open?'':'closed');
const head=document.createElement('div');head.className='blockHead';head.textContent=(g===open?'▾ ':'▸ ')+g;head.onclick=()=>{open=g;render()};wrap.appendChild(head);
const body=document.createElement('div');body.className='blockBody';
for(const cat of cats){const q=(filters[cat]||'').trim().toLowerCase();const found=q?DB[cat].filter(x=>x.toLowerCase().includes(q)):[];const chosen=selected[cat]||[];const d=document.createElement('div');d.className='cat';
d.innerHTML='<h3>'+esc(cat)+'</h3><div class="search"><input data-search="'+esc(cat)+'" value="'+esc(filters[cat]||'')+'" placeholder="Typ om te zoeken…"><button class="clear" data-clear="'+esc(cat)+'">×</button></div><div class="choices">'+(q?(found.length?found.map(x=>'<button class="'+(chosen.includes(x)?'selected':'')+'" data-cat="'+esc(cat)+'" data-item="'+esc(x)+'">'+(chosen.includes(x)?'✓ ':'')+esc(x)+'</button>').join(''):'<span class="noresult">Geen resultaat. <button class="addfound" data-addcat="'+esc(cat)+'" data-addtext="'+esc(filters[cat])+'">＋ Toevoegen aan database</button>'):'')+'</div><div class="chosen">'+(chosen.length?chosen.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<span class="small">Nog niets gekozen</span>')+'</div>';
body.appendChild(d)}wrap.appendChild(body);b.appendChild(wrap)}
b.querySelectorAll('[data-search]').forEach(inp=>inp.addEventListener('input',e=>{filters[e.target.dataset.search]=e.target.value;open=groupOf(e.target.dataset.search);render();const n=document.querySelector('[data-search="'+CSS.escape(e.target.dataset.search)+'"]');if(n){n.focus();n.setSelectionRange(e.target.selectionStart,e.target.selectionStart)}}));
b.querySelectorAll('[data-clear]').forEach(btn=>btn.onclick=()=>{filters[btn.dataset.clear]='';open=groupOf(btn.dataset.clear);render()});
b.querySelectorAll('[data-cat]').forEach(btn=>btn.onclick=()=>pick(btn.dataset.cat,btn.dataset.item));
b.querySelectorAll('[data-addcat]').forEach(btn=>btn.onclick=()=>addFromSearch(btn.dataset.addcat,btn.dataset.addtext));
renderPreview()}
function pick(cat,item){selected[cat]=multi.has(cat)?(selected[cat].includes(item)?selected[cat].filter(x=>x!==item):[...selected[cat],item]):[item];open=groupOf(cat);render()}
function addFromSearch(cat,text){const x=String(text||'').trim();if(!x)return;if(!DB[cat].includes(x))DB[cat].push(x);localStorage.setItem('gastenhuis_db_v2',JSON.stringify(DB));selected[cat]=multi.has(cat)?[...(selected[cat]||[]),x]:[x];filters[cat]='';open=groupOf(cat);render();showStatus('✓ Toegevoegd aan database')}
function renderPreview(){const name=document.getElementById('menuName').value.trim()||'Nieuw menu';document.getElementById('previewName').textContent=name;const total=Number(document.getElementById('normalCount').value||0)+Number(document.getElementById('vegCount').value||0)+Number(document.getElementById('lfCount').value||0);document.getElementById('total').value=total;document.getElementById('previewTotal').textContent=total;let html='';for(const [g,cats] of Object.entries(groups)){const common=['Groenten','Aardappel / rijst / pasta','Saus','Salade'].filter(c=>cats.includes(c));const normal=cats.filter(c=>c==='Lunch'||c==='Vlees/vis/kip'||c==='Dessert');const veg=cats.filter(c=>c.toLowerCase().includes('veggie')&&!c.toLowerCase().includes('lactose'));const lf=cats.filter(c=>c.toLowerCase().includes('lactose'));const vals=cs=>[...cs,...common].flatMap(c=>selected[c]||[]);const box=(title,cs)=>'<div class="variant"><b>'+title+'</b>'+((vals(cs).length)?vals(cs).map(x=>'<div class="line">'+esc(x)+'</div>').join(''):'<div class="small">Nog niets</div>')+'</div>';html+='<div class="previewBlock"><h3>'+g+'</h3><div class="variants">'+box('Normaal',normal)+box('Veggie',veg)+box('LF veggie',lf)+'</div></div>'}document.getElementById('preview').innerHTML=html}
function showStatus(t){const s=document.getElementById('status');s.textContent=t;setTimeout(()=>s.textContent='',1800)}
function saveMenu(){const name=document.getElementById('menuName').value.trim();if(!name){alert('Geef het menu een naam.');return}const menus=loadJSON('gastenhuis_menus_v2',[]);menus.unshift({id:Date.now(),name,total:Number(document.getElementById('total').value||0),counts:{normal:Number(document.getElementById('normalCount').value||0),veg:Number(document.getElementById('vegCount').value||0),lf:Number(document.getElementById('lfCount').value||0)},selected:JSON.parse(JSON.stringify(selected))});localStorage.setItem('gastenhuis_menus_v2',JSON.stringify(menus));showStatus('✓ Menu opgeslagen');renderSaved()}
function renderSaved(){const el=document.getElementById('saved'),menus=loadJSON('gastenhuis_menus_v2',[]);el.innerHTML=menus.length?menus.map(m=>'<div class="savedRow"><div><b>'+esc(m.name)+'</b> · '+m.total+' personen</div><div><button data-openmenu="'+m.id+'">Openen</button> <button class="danger" data-delmenu="'+m.id+'">Verwijderen</button></div></div>').join(''):'<span class="small">Nog geen opgeslagen menu’s.</span>';el.querySelectorAll('[data-openmenu]').forEach(b=>b.onclick=()=>loadMenu(Number(b.dataset.openmenu)));el.querySelectorAll('[data-delmenu]').forEach(b=>b.onclick=()=>deleteMenu(Number(b.dataset.delmenu)))}
function loadMenu(id){const m=loadJSON('gastenhuis_menus_v2',[]).find(x=>x.id===id);if(!m)return;selected={};Object.keys(DB).forEach(k=>selected[k]=m.selected&&m.selected[k]?[...m.selected[k]]:[]);filters={};Object.keys(DB).forEach(k=>filters[k]='');document.getElementById('menuName').value=m.name;const c=m.counts||{normal:m.total,veg:0,lf:0};document.getElementById('normalCount').value=c.normal;document.getElementById('vegCount').value=c.veg;document.getElementById('lfCount').value=c.lf;open='🥪 Lunch';render();showStatus('✓ Menu geopend')}
function deleteMenu(id){localStorage.setItem('gastenhuis_menus_v2',JSON.stringify(loadJSON('gastenhuis_menus_v2',[]).filter(x=>x.id!==id)));renderSaved()}
function newMenu(){document.getElementById('menuName').value='';document.getElementById('normalCount').value=35;document.getElementById('vegCount').value=0;document.getElementById('lfCount').value=0;initState();open='🥪 Lunch';render();showStatus('Nieuw menu')}
function openDB(){const modal=document.getElementById('dbModal');modal.classList.add('open');renderDB()}
function closeDB(){document.getElementById('dbModal').classList.remove('open')}
function renderDB(){const sel=document.getElementById('dbCategory');sel.innerHTML=Object.keys(DB).map(k=>'<option>'+esc(k)+'</option>').join('');const cat=sel.value;document.getElementById('dbList').innerHTML=(DB[cat]||[]).map((x,i)=>'<div class="dbitem"><span>'+esc(x)+'</span><button class="danger" data-rm="'+i+'">Verwijderen</button></div>').join('')||'<span class="small">Geen onderdelen.</span>';document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{DB[cat].splice(Number(b.dataset.rm),1);localStorage.setItem('gastenhuis_db_v2',JSON.stringify(DB));renderDB();render()})}
function addDB(){const cat=document.getElementById('dbCategory').value,x=document.getElementById('dbNew').value.trim();if(!x)return;if(!DB[cat].includes(x))DB[cat].push(x);localStorage.setItem('gastenhuis_db_v2',JSON.stringify(DB));document.getElementById('dbNew').value='';renderDB();render();showStatus('✓ Toegevoegd aan database')}

document.getElementById('saveBtn').onclick=saveMenu;document.getElementById('newBtn').onclick=newMenu;document.getElementById('dbBtn').onclick=openDB;document.getElementById('closeDb').onclick=closeDB;document.getElementById('dbCategory').onchange=renderDB;document.getElementById('dbAddBtn').onclick=addDB;document.getElementById('menuName').oninput=renderPreview;document.getElementById('total').oninput=()=>{const n=Number(document.getElementById('total').value||0);document.getElementById('normalCount').value=n;document.getElementById('vegCount').value=0;document.getElementById('lfCount').value=0;renderPreview()};['normalCount','vegCount','lfCount'].forEach(id=>document.getElementById(id).oninput=renderPreview);
initState();render();renderSaved();
</script>
</body></html>
