<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--yellow:#f6e8a8;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,Arial,sans-serif;font-size:16px}header{background:linear-gradient(135deg,var(--sage),#f8e8d6);padding:20px}header h1{margin:0;font-size:28px}header p{margin:4px 0;color:var(--muted)}main{max-width:1120px;margin:auto;padding:18px 16px 80px}.top{display:grid;grid-template-columns:1fr 150px auto auto;gap:10px;align-items:end}.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}input,button{font:inherit}input{width:100%;padding:10px;border:1px solid #d8d4cc;border-radius:10px;background:#fff;color:var(--ink)}button{border:0;border-radius:10px;padding:9px 12px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 390px;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.meal{border:2px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}.meal>h2{margin:0 0 8px}.cat{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}.cat h3{margin:0;padding:9px 12px;background:var(--sage);font-size:16px}.search{padding:9px 10px 0}.search input{padding:8px}.choices{display:flex;flex-wrap:wrap;gap:7px;padding:10px}.choices button{background:#fff;color:var(--ink);border:1px solid #d8d4cc;padding:7px 10px}.choices button.on{background:var(--green);color:#fff;border-color:var(--green)}.chosen{padding:0 10px 9px}.pill{display:inline-block;background:var(--yellow);border-radius:999px;padding:4px 8px;margin:2px;font-size:13px}.preview{position:sticky;top:10px;align-self:start}.menu-preview{border:2px solid var(--green);border-radius:16px;padding:15px;background:#fff}.menu-preview h2{margin:0 0 5px}.meal-preview{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}.meal-preview h3{margin:0 0 6px}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.variant{padding:7px 8px;border-radius:10px;background:#f7f3eb;min-width:0}.variant b{display:block;font-size:13px;margin-bottom:4px}.line{padding:2px 0}.people{font-weight:700}.small{font-size:13px;color:var(--muted)}.status{min-height:22px;color:var(--green);font-weight:700;margin-top:8px}.saveditem{border:1px solid var(--line);border-radius:14px;padding:11px;margin:8px 0;background:#fff;display:flex;justify-content:space-between;gap:10px}@media(max-width:800px){.top,.grid{grid-template-columns:1fr}.preview{position:static}.variant-grid{grid-template-columns:1fr}}</style></head><body><header><h1>🍽️ Menubouwer</h1><p>Bouw een compleet menu uit losse onderdelen.</p></header><main><div class="top"><div class="field"><label>Naam van het menu</label><input id="name" placeholder="Naam menu"></div><div class="field"><label>Aantal personen</label><input id="people" type="number" min="1" value="35" oninput="renderPreview()"></div><button onclick="save()">💾 Opslaan</button><button class="secondary" onclick="nieuw()">Nieuw</button></div><div id="status" class="status"></div><div class="grid"><section class="card"><h2>Menu samenstellen</h2><div class="small">Typ in een categorie om te zoeken. Bij groenten, aardappel/rijst/pasta, saus en salade kun je meerdere onderdelen kiezen.</div><div id="builder"></div></section><section class="card preview"><div class="menu-preview"><h2 id="previewName">Nieuw menu</h2><div class="people">👥 <span id="previewPeople">35</span> personen</div><div id="previewMeals"></div></div></section></div><section class="card"><h2>💾 Opgeslagen menu's</h2><div id="saved"></div></section></main><script>const DB={'Lunch':['Krentenbol','Sauzijzenbroodje','Kroket','Kaassoufflé','Eiersalade','Soep','Pasteitje','Broodmaaltijd'],'Lunch veggie':['Vegetarische sandwich','Groentepasteitje','Kaassoufflé','Vegetarische soep'],'Lunch lactosevrij veggie':['Lactosevrije vegetarische sandwich','Lactosevrij groentepasteitje','Lactosevrije soep'],'Vlees/vis/kip':['Kip kerrie','Kip ketjap','Schnitzel','Hachee','Gehaktbal','Hamburger','Kip in tomatensaus','Stoofvlees','Zalm','Witvis','Vissticks','Kabeljauw','Tonijn'],'Diner veggie':['Vegetarische balletjes','Vegetarische schnitzel','Groenteburger','Vegetarische curry','Courgette-tomaat','Portobello'],'Diner lactosevrij veggie':['Lactosevrije vegetarische balletjes','Lactosevrije groenteburger','Lactosevrije vegetarische curry','Courgette-tomaat','Portobello'],'Groenten':['Sperziebonen','Broccoli','Worteltjes','Rode kool','Bloemkool','Ratatouille','Bietjes','Witlof','Doperwten','Andijvie','Prei','Spinazie','Witte kool','Savooiekool'],'Aardappel / rijst / pasta':['Aardappelen','Aardappelkroketjes','Aardappelpuree','Krieltjes','Rijst','Volkoren rijst','Pasta','Macaroni','Noodles'],'Saus':['Jus','Kerriesaus','Boursinsaus','Roomsaus','Tomatensaus','Champignonsaus','Satésaus'],'Salade':['Gemengde salade','Komkommersalade','Tomatensalade','Rauwkost'],'Dessert':['Vanillevla','Chocoladevla','Yoghurt','Kwark','Fruitsalade','IJs','Advocaatmousse','Bavarois'],'Dessert veggie':['Vegetarische yoghurt','Fruitsalade','Sorbetijs'],'Dessert lactosevrij veggie':['Lactosevrije yoghurt','Fruitsalade','Lactosevrij sorbetijs']};const groups={'🥪 Lunch':['Lunch','Lunch veggie','Lunch lactosevrij veggie'],'🍽️ Diner':['Vlees/vis/kip','Diner veggie','Diner lactosevrij veggie','Groenten','Aardappel / rijst / pasta','Saus','Salade'],'🍨 Dessert':['Dessert','Dessert veggie','Dessert lactosevrij veggie']};const multi=new Set(['Groenten','Aardappel / rijst / pasta','Saus','Salade']);let sel={};let filters={};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function resetSel(){Object.keys(DB).forEach(k=>sel[k]=[]);Object.keys(DB).forEach(k=>filters[k]='')}function init(){resetSel();render()}function render(){const b=document.getElementById('builder');b.innerHTML='';for(const [group,cats] of Object.entries(groups)){const wrap=document.createElement('div');wrap.className='meal';wrap.innerHTML=`<h2>${group}</h2>`;cats.forEach(cat=>{const chosen=sel[cat]||[];const q=(filters[cat]||'').toLowerCase().trim();const list=q?DB[cat].filter(x=>x.toLowerCase().includes(q)):[];const d=document.createElement('div');d.className='cat';d.innerHTML=`<h3>${cat}</h3><div class="search"><input data-search="${esc(cat)}" placeholder="Typ om te zoeken…" value="${esc(filters[cat]||'')}"></div><div class="choices">${q?(list.length?list.map(x=>`<button class="${chosen.includes(x)?'on':''}" data-cat="${esc(cat)}" data-item="${esc(x)}">${chosen.includes(x)?'✓ ':''}${esc(x)}</button>`).join(''):'<span class="small">Geen resultaten</span>'):''}</div><div class="chosen">${chosen.length?chosen.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="small">Nog niets gekozen</span>'}</div>`;wrap.appendChild(d)});b.appendChild(wrap)}b.querySelectorAll('.choices button').forEach(btn=>btn.onclick=()=>pick(btn.dataset.cat,btn.dataset.item));b.querySelectorAll('[data-search]').forEach(inp=>inp.oninput=()=>{filters[inp.dataset.search]=inp.value;renderKeepFocus(inp.dataset.search,inp.selectionStart)});renderPreview()}function renderKeepFocus(cat,pos){render();const inp=document.querySelector(`[data-search="${CSS.escape(cat)}"]`);if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}function pick(cat,item){if(multi.has(cat))sel[cat]=sel[cat].includes(item)?sel[cat].filter(x=>x!==item):[...sel[cat],item];else sel[cat]=[item];render()}function renderPreview(){const name=document.getElementById('name').value.trim()||'Nieuw menu',people=document.getElementById('people').value||35;document.getElementById('previewName').textContent=name;document.getElementById('previewPeople').textContent=people;const common=['Groenten','Aardappel / rijst / pasta','Saus','Salade'];document.getElementById('previewMeals').innerHTML=Object.entries(groups).map(([group,cats])=>{const normal=cats.filter(c=>!c.toLowerCase().includes('veggie'));const veg=cats.filter(c=>c.toLowerCase().includes('veggie')&&!c.toLowerCase().includes('lactose'));const lf=cats.filter(c=>c.toLowerCase().includes('lactose'));const vals=cs=>cs.flatMap(c=>sel[c]||[]);const block=(title,cs,commonOn)=>{let all=vals(cs);if(commonOn)all=[...all,...vals(common.filter(c=>cats.includes(c)))];return `<div class="variant"><b>${title}</b>${all.length?all.map(x=>`<div class="line">${esc(x)}</div>`).join(''):'<div class="small">Nog niets</div>'}</div>`};return `<div class="meal-preview"><h3>${group}</h3><div class="variant-grid">${block('Normaal menu',normal,true)}${block('Vegetarisch menu',veg,true)}${block('Lactosevrij vegetarisch menu',lf,true)}</div></div>`}).join('')}document.getElementById('name').oninput=renderPreview;function save(){const name=document.getElementById('name').value.trim();if(!name){alert('Geef het menu een naam.');return}if(!Object.values(sel).some(v=>v.length)){alert('Kies eerst onderdelen.');return}const menus=JSON.parse(localStorage.getItem('gastenhuis_menus_v2')||'[]');menus.unshift({id:Date.now(),name,people:Number(document.getElementById('people').value)||35,sel:JSON.parse(JSON.stringify(sel))});localStorage.setItem('gastenhuis_menus_v2',JSON.stringify(menus));document.getElementById('status').textContent='✓ Menu opgeslagen';renderSaved()}function renderSaved(){const menus=JSON.parse(localStorage.getItem('gastenhuis_menus_v2')||'[]');document.getElementById('saved').innerHTML=menus.length?menus.map(m=>`<div class="saveditem"><div><b>${esc(m.name)}</b> <span class="small">(${m.people} personen)</span><br>${Object.values(m.sel).flat().map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div><button onclick="load(${m.id})">Openen</button> <button class="secondary" onclick="del(${m.id})">Verwijderen</button></div></div>`).join(''):'<div class="small">Nog geen opgeslagen menu’s.</div>'}function load(id){const m=JSON.parse(localStorage.getItem('gastenhuis_menus_v2')||'[]').find(x=>x.id===id);if(!m)return;sel={};Object.keys(DB).forEach(k=>sel[k]=m.sel[k]?[...m.sel[k]]:[]);Object.keys(DB).forEach(k=>filters[k]='');document.getElementById('name').value=m.name;document.getElementById('people').value=m.people;document.getElementById('status').textContent='✓ Menu geopend — je kunt het wijzigen';render()}function del(id){localStorage.setItem('gastenhuis_menus_v2',JSON.stringify(JSON.parse(localStorage.getItem('gastenhuis_menus_v2')||'[]').filter(x=>x.id!==id)));renderSaved()}function nieuw(){document.getElementById('name').value='';document.getElementById('people').value=35;document.getElementById('status').textContent='';init()}init();renderSaved();</script></body></html>
