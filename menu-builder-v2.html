<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer</title>
<style>
:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--yellow:#f6e8a8;--line:#e9e2d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Calibri,Arial,sans-serif}header{padding:12px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:23px}header p{margin:2px 0;color:var(--muted);font-size:12px}main{max-width:1250px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1fr 90px auto auto auto;gap:7px;align-items:end}label{display:block;font-size:10px;font-weight:700;color:var(--muted)}input,button,select{font:inherit}input,select{width:100%;padding:7px;border:1px solid #d8d4cc;border-radius:7px;background:#fff;color:var(--ink)}button{border:0;border-radius:7px;padding:7px 10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.layout{display:grid;grid-template-columns:400px 1fr;gap:10px;margin-top:8px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.builderHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.builderHead h2{margin:0;font-size:16px}.target{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.target button{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:11px}.target button.active{background:var(--green);color:#fff}.mealTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.mealTabs button{background:var(--sage);color:var(--ink);font-size:12px}.mealTabs button.active{background:var(--green);color:#fff}.catTabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}.catTabs button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:5px 7px;font-size:11px}.catTabs button.active{background:#e7eee4;border-color:var(--green)}.searchbox{padding:7px;background:#f7f3eb;border-radius:9px}.search{display:flex;gap:4px}.search input{padding:8px;font-size:13px}.clear{background:#fff;color:var(--muted);border:1px solid var(--line);padding:4px 9px}.choices{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.choices button{background:#fff;color:var(--ink);border:1px solid #d8d4cc;padding:5px 7px;font-size:11px}.choices button.selected{background:var(--green);color:#fff}.chosen{margin-top:7px}.chosenTitle{font-size:10px;color:var(--muted);font-weight:700}.pill{display:inline-flex;align-items:center;gap:3px;background:var(--yellow);border-radius:99px;padding:4px 7px;margin:2px;font-size:11px}.pill button{background:none;color:#8a6550;padding:0;font-size:13px}.hint,.small{font-size:10px;color:var(--muted)}.menu{border:2px solid var(--green);border-radius:11px;padding:10px}.menuTitle{display:flex;justify-content:space-between;align-items:center}.menu h2{margin:0;font-size:18px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.counts input{padding:5px;font-size:12px}.previewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.col{background:#f7f3eb;border-radius:8px;padding:7px;min-height:180px}.col h3{margin:0 0 5px;font-size:12px;text-align:center}.section{border-top:1px solid var(--line);margin-top:7px;padding-top:6px}.sectionTitle{font-size:11px;font-weight:700;margin-bottom:3px}.line{font-size:11px;margin:2px 0}.empty{font-size:10px;color:var(--muted);font-style:italic}.saved{margin-top:8px}.savedRow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:11px}.savedRow button{padding:4px 7px;font-size:10px}.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{background:var(--bg);width:min(760px,100%);max-height:85vh;overflow:auto;border-radius:14px;padding:12px}.modalHead{display:flex;justify-content:space-between;align-items:center}.dbadd{display:grid;grid-template-columns:1fr auto;gap:5px;margin:8px 0}.dbitem{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:5px 0;font-size:11px}@media(max-width:850px){.top,.layout{grid-template-columns:1fr}.previewGrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🍽️ Menubouwer</h1><p>Bouw een compleet menu uit losse onderdelen.</p></header><main>
<div class="top"><div><label>Naam van het menu</label><input id="menuName" placeholder="Bijv. Kip kerrie – rijst – sperziebonen"></div><div><label>Totaal</label><input id="total" type="number" readonly value="35"></div><button id="saveBtn">💾 Opslaan</button><button class="secondary" id="newBtn">Nieuw</button><button class="secondary" id="dbBtn">🗂️ Database</button></div>
<div class="layout"><section class="card"><div class="builderHead"><h2>Menu samenstellen</h2><span class="hint">1. doelgroep → 2. maaltijd → 3. onderdeel</span></div>
<div class="target"><button data-target="normal" class="active">Normaal</button><button data-target="veg">Veggie</button><button data-target="lf">LF Veggie</button></div>
<div class="mealTabs"><button data-meal="Lunch" class="active">🥪 Lunch</button><button data-meal="Diner">🍽️ Diner</button><button data-meal="Dessert">🍨 Dessert</button></div>
<div id="catTabs" class="catTabs"></div><div class="searchbox"><div class="search"><input id="searchInput" placeholder="Typ om te zoeken…"><button id="clearBtn" class="clear">×</button></div><div id="choices" class="choices"></div><div id="chosen" class="chosen"></div></div>
</section><section class="card"><div class="menu"><div class="menuTitle"><h2 id="previewName">Nieuw menu</h2><span>👥 <b id="previewTotal">35</b></span></div><div class="counts"><div><label>Normaal</label><input id="normalCount" type="number" min="0" value="35"></div><div><label>Veggie</label><input id="vegCount" type="number" min="0" value="0"></div><div><label>LF Veggie</label><input id="lfCount" type="number" min="0" value="0"></div></div><div class="previewGrid" id="previewGrid"></div></div></section></div>
<section class="card saved"><h2 style="margin:0 0 5px;font-size:15px">💾 Opgeslagen menu's</h2><div id="saved"></div></section></main>
<div id="dbModal" class="modal"><div class="modalBox"><div class="modalHead"><h2 style="margin:0">🗂️ Database</h2><button class="secondary" id="closeDb">Sluiten</button></div><div class="hint">Onderdelen uit de bestelapp. Nieuwe onderdelen blijven lokaal bewaard.</div><select id="dbCategory"></select><div class="dbadd"><input id="dbNew" placeholder="Nieuw onderdeel"><button id="dbAddBtn">+ Toevoegen</button></div><div id="dbList"></div></div></div>
<script>'use strict';
const EXCEL_DB={"Dessert":["Advocaatmousse","Appelcompote","Appelmoes","Appeltaart","Bavarois","Brownie","Cake","Chocolade-ijs","Chocolademousse","Chocoladepudding","Chocoladevla","Dubbelvla","Fruitcocktail","Fruitsalade","Gebakken appel","Griekse yoghurt","Griesmeelpudding","Hangop","Hopjesvla","Karamelpudding","Kwark","Panna cotta","Pudding","Rijstepap","Roomijs","Sorbetijs","Stoofpeer","Tiramisu","Vanille-ijs","Vanillepudding","Vanillevla","Vers fruit","Vruchtencompote","Vruchtenkwark","Vruchtenmousse","Vruchtenyoghurt","Yoghurt"],"Groente":["Andijvie","Asperges","Aubergine","Bietjes","Bloemkool","Boerenkool","Broccoli","Champignons","Courgette","Doperwten","Knolselderij","Komkommer","Koolrabi","Paprika","Pastinaak","Pompoen","Prei","Rode kool","Savooiekool","Sperziebonen","Spinazie","Spitskool","Spruitjes","Tomaat","Ui","Venkel","Waspeen","Winterpeen","Witlof","Witte kool","Wortel","Zuurkool"],"Lactosevrij":["Lactosevrije boter","Lactosevrije kookroom","Lactosevrije kwark","Lactosevrije melk","Lactosevrije roomkaas","Lactosevrije slagroom","Lactosevrije yoghurt"],"Vegetarisch":["Ei","Falafel","Portobello","Seitan","Tempeh","Tofu","Vegetarisch gehakt","Vegetarische balletjes","Vegetarische burger","Vegetarische gehaktbal","Vegetarische kipstukjes","Vegetarische schnitzel","Vegetarische shoarma","Vegetarische worst"],"Vis":["Garnalen","Gerookte zalm","Haring","Kabeljauw","Kibbeling","Koolvis","Lekkerbek","Makreel","Pangasius","Schol","Tilapia","Tonijn","Tonijn in blik","Zalm"],"Vlees":["Beenham","Biefstuk","Gehaktbal","Half-om-half gehakt","Ham","Hamburger","Hamlap","Kalkoenfilet","Kipdrumstick","Kipfilet","Kipgehakt","Kippendij","Knakworst","Procureur","Riblap","Rookworst","Rosbief","Rundergehakt","Runderlap","Runderstoofvlees","Saucijs","Schnitzel","Slavink","Spek","Speklap","Sukadelap","Varkensfilet","Varkenshaas","Varkenslap","Verse worst"],"Zuivel / lactose":["Boter","Boursin","Crème fraîche","Geraspte kaas","Griekse yoghurt","Halfvolle melk","Kaas","Karnemelk","Kookroom","Kwark","Mascarpone","Melk","Mozzarella","Parmezaanse kaas","Pudding","Roomboter","Roomkaas","Slagroom","Vla","Volle melk","Yoghurt","Zure room"],"Lunch":["Krentenbol","Sauzijzenbroodje","Kroket","Kaassoufflé"]};
let DB=JSON.parse(JSON.stringify(EXCEL_DB));let state={normal:{},veg:{},lf:{}};let target='normal',meal='Lunch',category='Lunch';
const mealCats={Lunch:['Lunch'],Diner:['Vlees/vis/kip','Groente','Bijgerecht'],Dessert:['Dessert']};
const sources={'Vlees/vis/kip':['Vlees','Vis'],Groente:['Groente'],Bijgerecht:['Zuivel / lactose'],Dessert:['Dessert'],Lunch:['Lunch']};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function items(c){return(sources[c]||[c]).flatMap(x=>DB[x]||[]).sort((a,b)=>a.localeCompare(b,'nl'))}
function renderCategories(){document.querySelectorAll('[data-meal]').forEach(b=>b.classList.toggle('active',b.dataset.meal===meal));let wrap=$('catTabs');wrap.innerHTML='';(mealCats[meal]||[]).forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;renderAll()};wrap.appendChild(b)});renderSearch()}
function renderSearch(){let q=$('searchInput').value.trim().toLowerCase(),all=items(category),found=q?all.filter(x=>x.toLowerCase().includes(q)):[],chosen=state[target][category]||[];let out=$('choices');out.innerHTML=q?(found.length?found.map(x=>`<button class="${chosen.includes(x)?'selected':''}" data-x="${esc(x)}">${chosen.includes(x)?'✓ ':''}${esc(x)}</button>`).join(''):`<span class="small">Geen resultaat. <button class="secondary" id="addFound">＋ Toevoegen aan database</button></span>`):'<span class="small">Typ bijvoorbeeld <b>aard</b>, <b>kip</b> of <b>sper</b>.</span>';out.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>pick(b.dataset.x));let ch=$('chosen');ch.innerHTML=chosen.length?'<div class="chosenTitle">GEKOZEN</div>'+chosen.map(x=>`<span class="pill">${esc(x)} <button data-remove="${esc(x)}">×</button></span>`).join(''):'<span class="small">Nog niets gekozen.</span>';ch.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>pick(b.dataset.remove));let add=$('addFound');if(add)add.onclick=addFound}
function pick(x){state[target][category]=state[target][category]||[];let a=state[target][category];state[target][category]=a.includes(x)?a.filter(y=>y!==x):[...a,x];renderAll()}
function addFound(){let x=$('searchInput').value.trim();if(!x)return;let dest=category==='Vlees/vis/kip'?'Vlees':category==='Bijgerecht'?'Zuivel / lactose':category;DB[dest]=DB[dest]||[];if(!DB[dest].includes(x))DB[dest].push(x);localStorage.setItem('gastenhuis_db_excel',JSON.stringify(DB));state[target][category]=[...(state[target][category]||[]),x];$('searchInput').value='';renderAll()}
function renderPreview(){let cols=[['normal','Normaal'],['veg','Veggie'],['lf','LF Veggie']];let total=cols.reduce((s,[k])=>s+(Number($(k+'Count').value)||0),0);$('total').value=total;$('previewTotal').textContent=total;$('previewName').textContent=$('menuName').value.trim()||'Nieuw menu';$('previewGrid').innerHTML=cols.map(([k,n])=>`<div class="col"><h3>${n}</h3>${Object.entries(mealCats).map(([g,cs])=>`<div class="section"><div class="sectionTitle">${g}</div>${cs.flatMap(c=>state[k][c]||[]).map(x=>`<div class="line">${esc(x)}</div>`).join('')||'<div class="empty">Nog niets</div>'}</div>`).join('')}</div>`).join('')}
function renderAll(){renderCategories();renderPreview()}
function save(){let name=$('menuName').value.trim();if(!name)return alert('Geef het menu een naam.');let a=JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]');a.unshift({id:Date.now(),name,state:JSON.parse(JSON.stringify(state)),counts:{normal:+$('normalCount').value||0,veg:+$('vegCount').value||0,lf:+$('lfCount').value||0}});localStorage.setItem('gastenhuis_menus',JSON.stringify(a));renderSaved()}
function renderSaved(){let a=JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]');$('saved').innerHTML=a.length?a.map(m=>`<div class="savedRow"><b>${esc(m.name)}</b><span>${(m.counts?.normal||0)+(m.counts?.veg||0)+(m.counts?.lf||0)} personen <button onclick="loadMenu(${m.id})">Openen</button> <button class="secondary" onclick="removeMenu(${m.id})">Verwijderen</button></span></div>`).join(''):'<span class="small">Nog geen opgeslagen menu’s.</span>'}
function loadMenu(id){let m=JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]').find(x=>x.id===id);if(!m)return;state=m.state||state;$('menuName').value=m.name;$('normalCount').value=m.counts?.normal||0;$('vegCount').value=m.counts?.veg||0;$('lfCount').value=m.counts?.lf||0;renderAll()}
function removeMenu(id){localStorage.setItem('gastenhuis_menus',JSON.stringify(JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]').filter(x=>x.id!==id)));renderSaved()}
function newMenu(){state={normal:{},veg:{},lf:{}};$('menuName').value='';$('normalCount').value=35;$('vegCount').value=0;$('lfCount').value=0;$('searchInput').value='';renderAll()}
function renderDB(){let c=$('dbCategory');c.innerHTML=Object.keys(DB).sort().map(x=>`<option>${esc(x)}</option>`).join('');let k=c.value;$('dbList').innerHTML=(DB[k]||[]).sort((a,b)=>a.localeCompare(b,'nl')).map((x,i)=>`<div class="dbitem"><span>${esc(x)}</span><button class="secondary" onclick="delDB('${esc(k)}',${i})">Verwijderen</button></div>`).join('')}
function delDB(c,i){let a=(DB[c]||[]).slice().sort((a,b)=>a.localeCompare(b,'nl')),x=a[i];if(confirm('Dit onderdeel uit de database verwijderen?')){DB[c]=DB[c].filter(y=>y!==x);localStorage.setItem('gastenhuis_db_excel',JSON.stringify(DB));renderDB();renderAll()}}
document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{target=b.dataset.target;document.querySelectorAll('[data-target]').forEach(x=>x.classList.toggle('active',x===b));renderAll()});document.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{meal=b.dataset.meal;category=mealCats[meal][0];$('searchInput').value='';renderAll()});$('searchInput').oninput=renderSearch;$('clearBtn').onclick=()=>{$('searchInput').value='';renderSearch()};$('menuName').oninput=renderPreview;['normalCount','vegCount','lfCount'].forEach(id=>$(id).oninput=renderPreview);$('saveBtn').onclick=save;$('newBtn').onclick=newMenu;$('dbBtn').onclick=()=>{$('dbModal').classList.add('open');renderDB()};$('closeDb').onclick=()=>$('dbModal').classList.remove('open');$('dbCategory').onchange=renderDB;$('dbAddBtn').onclick=()=>{let x=$('dbNew').value.trim(),c=$('dbCategory').value;if(x&&!DB[c].includes(x))DB[c].push(x);$('dbNew').value='';localStorage.setItem('gastenhuis_db_excel',JSON.stringify(DB));renderDB();renderAll()};let savedDB=localStorage.getItem('gastenhuis_db_excel');if(savedDB)try{DB=JSON.parse(savedDB)}catch(e){}renderAll();renderSaved();
</script></body></html>
