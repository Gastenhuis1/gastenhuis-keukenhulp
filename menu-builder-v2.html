<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--yellow:#f6e8a8;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Calibri,Arial,sans-serif}header{padding:12px 18px;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:23px}header p{margin:2px 0;color:var(--muted);font-size:12px}main{max-width:1250px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1fr 90px auto auto auto;gap:7px;align-items:end}label{display:block;font-size:10px;font-weight:700;color:var(--muted)}input,button,select{font:inherit}input,select{width:100%;padding:7px;border:1px solid #d8d4cc;border-radius:7px;background:#fff;color:var(--ink)}button{border:0;border-radius:7px;padding:7px 10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.layout{display:grid;grid-template-columns:400px 1fr;gap:10px;margin-top:8px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.builderHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.builderHead h2{margin:0;font-size:16px}.target{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.target button{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:11px;padding:7px 4px}.target button.active{background:var(--green);color:#fff}.block{border:1px solid var(--line);border-radius:9px;margin:5px 0;overflow:hidden}.blockHead{padding:7px 9px;background:var(--sage);font-weight:700;cursor:pointer}.block.closed .body{display:none}.cat{padding:6px;border-top:1px solid var(--line)}.cat h3{margin:0 0 4px;font-size:11px}.search{display:flex;gap:4px}.search input{padding:6px;font-size:12px}.clear{background:#fff;color:var(--muted);border:1px solid var(--line);padding:4px 8px}.choices{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.choices button{background:#fff;color:var(--ink);border:1px solid #d8d4cc;padding:5px 7px;font-size:11px}.choices button.selected{background:var(--green);color:#fff}.chosen{margin-top:4px}.pill{display:inline-block;background:var(--yellow);border-radius:99px;padding:3px 6px;margin:1px;font-size:10px}.hint,.small{font-size:10px;color:var(--muted)}.menu{border:2px solid var(--green);border-radius:11px;padding:10px}.menuTitle{display:flex;justify-content:space-between;align-items:center}.menu h2{margin:0;font-size:18px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.counts input{padding:5px;font-size:12px}.previewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.col{background:#f7f3eb;border-radius:8px;padding:7px;min-height:100px}.col h3{margin:0 0 5px;font-size:12px;text-align:center}.section{border-top:1px solid var(--line);margin-top:7px;padding-top:6px}.sectionTitle{font-size:11px;font-weight:700;margin-bottom:3px}.line{font-size:11px;margin:2px 0}.empty{font-size:10px;color:var(--muted);font-style:italic}.saved{margin-top:8px}.savedRow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:11px}.savedRow button{padding:4px 7px;font-size:10px}.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{background:var(--bg);width:min(760px,100%);max-height:85vh;overflow:auto;border-radius:14px;padding:12px}.modalHead{display:flex;justify-content:space-between;align-items:center}.dbadd{display:grid;grid-template-columns:1fr auto;gap:5px;margin:8px 0}.dbitem{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:5px 0;font-size:11px}@media(max-width:850px){.top,.layout{grid-template-columns:1fr}.previewGrid{grid-template-columns:1fr}}</style></head><body><header><h1>🍽️ Menubouwer</h1><p>Bouw een compleet menu uit losse onderdelen.</p></header><main><div class="top"><div><label>Naam van het menu</label><input id="menuName" placeholder="Bijv. Kip kerrie – rijst – sperziebonen"></div><div><label>Totaal</label><input id="total" type="number" readonly value="35"></div><button id="saveBtn">💾 Opslaan</button><button class="secondary" id="newBtn">Nieuw</button><button class="secondary" id="dbBtn">🗂️ Database</button></div><div class="layout"><section class="card"><div class="builderHead"><h2>Menu samenstellen</h2><span class="hint">Kies eerst de kolom</span></div><div class="target"><button data-target="normal" class="active">Normaal</button><button data-target="veg">Veggie</button><button data-target="lf">LF Veggie</button></div><div id="builder"></div></section><section class="card"><div class="menu"><div class="menuTitle"><h2 id="previewName">Nieuw menu</h2><span>👥 <b id="previewTotal">35</b></span></div><div class="counts"><div><label>Normaal</label><input id="normalCount" type="number" min="0" value="35"></div><div><label>Veggie</label><input id="vegCount" type="number" min="0" value="0"></div><div><label>LF Veggie</label><input id="lfCount" type="number" min="0" value="0"></div></div><div class="previewGrid" id="previewGrid"></div></div></section></div><section class="card saved"><h2 style="margin:0 0 5px;font-size:15px">💾 Opgeslagen menu's</h2><div id="saved"></div></section></main><div id="dbModal" class="modal"><div class="modalBox"><div class="modalHead"><h2 style="margin:0">🗂️ Database</h2><button class="secondary" id="closeDb">Sluiten</button></div><div class="hint">Onderdelen uit de bestelapp. Nieuwe onderdelen blijven lokaal bewaard.</div><select id="dbCategory"></select><div class="dbadd"><input id="dbNew" placeholder="Nieuw onderdeel"><button id="dbAddBtn">+ Toevoegen</button></div><div id="dbList"></div></div></div><script>'use strict';const EXCEL_DB={"Dessert":["Advocaatmousse","Appelcompote","Appelmoes","Appeltaart","Bavarois","Brownie","Cake","Chocolade-ijs","Chocolademousse","Chocoladepudding","Chocoladevla","Dubbelvla","Fruitcocktail","Fruitsalade","Gebakken appel","Griekse yoghurt","Griesmeelpudding","Hangop","Hopjesvla","Karamelpudding","Kwark","Panna cotta","Pudding","Rijstepap","Roomijs","Sorbetijs","Stoofpeer","Tiramisu","Vanille-ijs","Vanillepudding","Vanillevla","Vers fruit","Vruchtencompote","Vruchtenkwark","Vruchtenmousse","Vruchtenyoghurt","Yoghurt"],"Groente":["Andijvie","Asperges","Aubergine","Bietjes","Bloemkool","Boerenkool","Broccoli","Champignons","Courgette","Doperwten","Knolselderij","Komkommer","Koolrabi","Paprika","Pastinaak","Pompoen","Prei","Rode kool","Savooiekool","Sperziebonen","Spinazie","Spitskool","Spruitjes","Tomaat","Ui","Venkel","Waspeen","Winterpeen","Witlof","Witte kool","Wortel","Zuurkool"],"Lactosevrij":["Lactosevrije boter","Lactosevrije kookroom","Lactosevrije kwark","Lactosevrije melk","Lactosevrije roomkaas","Lactosevrije slagroom","Lactosevrije yoghurt"],"Vegetarisch":["Ei","Falafel","Portobello","Seitan","Tempeh","Tofu","Vegetarisch gehakt","Vegetarische balletjes","Vegetarische burger","Vegetarische gehaktbal","Vegetarische kipstukjes","Vegetarische schnitzel","Vegetarische shoarma","Vegetarische worst"],"Vis":["Garnalen","Gerookte zalm","Haring","Kabeljauw","Kibbeling","Koolvis","Lekkerbek","Makreel","Pangasius","Schol","Tilapia","Tonijn","Tonijn in blik","Zalm"],"Vlees":["Beenham","Biefstuk","Gehaktbal","Half-om-half gehakt","Ham","Hamburger","Hamlap","Kalkoenfilet","Kipdrumstick","Kipfilet","Kipgehakt","Kippendij","Knakworst","Procureur","Riblap","Rookworst","Rosbief","Rundergehakt","Runderlap","Runderstoofvlees","Saucijs","Schnitzel","Slavink","Spek","Speklap","Sukadelap","Varkensfilet","Varkenshaas","Varkenslap","Verse worst"],"Zuivel / lactose":["Boter","Boursin","Crème fraîche","Geraspte kaas","Griekse yoghurt","Halfvolle melk","Kaas","Karnemelk","Kookroom","Kwark","Mascarpone","Melk","Mozzarella","Parmezaanse kaas","Pudding","Roomboter","Roomkaas","Slagroom","Vla","Volle melk","Yoghurt","Zure room"],"Lunch":["Krentenbol","Sauzijzenbroodje","Kroket","Kaassoufflé"]};let DB={...EXCEL_DB},state={normal:{},veg:{},lf:{}},target='normal',open='Lunch',filters={};const cats={Lunch:['Lunch'],Diner:['Vlees/vis/kip','Groente','Bijgerecht'],Dessert:['Dessert']};const source={'Vlees/vis/kip':['Vlees','Vis'],Groente:['Groente'],Bijgerecht:['Zuivel / lactose'],Dessert:['Dessert'],Lunch:['Lunch']};Object.keys(source).forEach(c=>filters[c]='');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function items(c){return(source[c]||[c]).flatMap(x=>DB[x]||[]).sort((a,b)=>a.localeCompare(b,'nl'))}function renderBuilder(){let b=document.getElementById('builder');b.innerHTML='';Object.entries(cats).forEach(([g,cs])=>{let w=document.createElement('div');w.className='block '+(open===g?'':'closed');let h=document.createElement('div');h.className='blockHead';h.textContent=(open===g?'▾ ':'▸ ')+g;h.onclick=()=>{open=g;renderBuilder()};w.appendChild(h);let body=document.createElement('div');body.className='body';cs.forEach(c=>{let q=(filters[c]||'').toLowerCase().trim(),all=items(c),found=q?all.filter(x=>x.toLowerCase().includes(q)):[],chosen=state[target][c]||[];let d=document.createElement('div');d.className='cat';let r=q?(found.length?found.map(x=>`<button class="${chosen.includes(x)?'selected':''}" data-c="${esc(c)}" data-x="${esc(x)}">${chosen.includes(x)?'✓ ':''}${esc(x)}</button>`).join(''):`<span class="small">Geen resultaat. <button class="secondary" data-add-c="${esc(c)}" data-add-x="${esc(filters[c])}">＋ Toevoegen</button>`):'<span class="small">Typ om te zoeken…</span>';d.innerHTML=`<h3>${esc(c)}</h3><div class="search"><input data-q="${esc(c)}" value="${esc(filters[c]||'')}" placeholder="Typ om te zoeken…"><button class="clear" data-cl="${esc(c)}">×</button></div><div class="choices">${r}</div><div class="chosen">${chosen.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`;body.appendChild(d)});w.appendChild(body);b.appendChild(w)});b.querySelectorAll('[data-q]').forEach(i=>i.oninput=e=>{filters[e.target.dataset.q]=e.target.value;renderBuilder();let n=document.querySelector(`[data-q="${CSS.escape(e.target.dataset.q)}"]`);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}});b.querySelectorAll('[data-cl]').forEach(i=>i.onclick=()=>{filters[i.dataset.cl]='';renderBuilder()});b.querySelectorAll('[data-c]').forEach(i=>i.onclick=()=>pick(i.dataset.c,i.dataset.x));b.querySelectorAll('[data-add-c]').forEach(i=>i.onclick=()=>addItem(i.dataset.addC,i.dataset.addX))}function pick(c,x){state[target][c]=state[target][c]||[];state[target][c]=state[target][c].includes(x)?state[target][c].filter(y=>y!==x):[...state[target][c],x];renderBuilder();renderPreview()}function addItem(c,x){x=String(x||'').trim();if(!x)return;let t=c==='Vlees/vis/kip'?'Vlees':c==='Bijgerecht'?'Zuivel / lactose':c;DB[t]=DB[t]||[];if(!DB[t].includes(x))DB[t].push(x);localStorage.setItem('gastenhuis_db_excel',JSON.stringify(DB));state[target][c]=[...(state[target][c]||[]),x];filters[c]='';renderBuilder();renderPreview()}function renderPreview(){let cols=[['normal','Normaal'],['veg','Veggie'],['lf','LF Veggie']];let total=cols.reduce((s,[k])=>s+(+document.getElementById(k+'Count').value||0),0);document.getElementById('total').value=total;document.getElementById('previewTotal').textContent=total;document.getElementById('previewName').textContent=document.getElementById('menuName').value.trim()||'Nieuw menu';document.getElementById('previewGrid').innerHTML=cols.map(([k,n])=>`<div class="col"><h3>${n}</h3>${Object.entries(cats).map(([g,cs])=>`<div class="section"><div class="sectionTitle">${g}</div>${cs.flatMap(c=>state[k][c]||[]).map(x=>`<div class="line">${esc(x)}</div>`).join('')||'<div class="empty">Nog niets</div>'}</div>`).join('')}</div>`).join('')}function save(){let name=document.getElementById('menuName').value.trim();if(!name)return alert('Geef het menu een naam.');let a=JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]');a.unshift({id:Date.now(),name,state:JSON.parse(JSON.stringify(state)),counts:{normal:+normalCount.value||0,veg:+vegCount.value||0,lf:+lfCount.value||0}});localStorage.setItem('gastenhuis_menus',JSON.stringify(a));renderSaved()}function renderSaved(){let a=JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]');saved.innerHTML=a.length?a.map(m=>`<div class="savedRow"><b>${esc(m.name)}</b><span>${(m.counts?.normal||0)+(m.counts?.veg||0)+(m.counts?.lf||0)} personen <button onclick="loadMenu(${m.id})">Openen</button> <button class="secondary" onclick="removeMenu(${m.id})">Verwijderen</button></span></div>`).join(''):'<span class="small">Nog geen opgeslagen menu’s.</span>'}function loadMenu(id){let m=JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]').find(x=>x.id===id);if(!m)return;state=m.state||state;menuName.value=m.name;normalCount.value=m.counts?.normal||0;vegCount.value=m.counts?.veg||0;lfCount.value=m.counts?.lf||0;renderBuilder();renderPreview()}function removeMenu(id){localStorage.setItem('gastenhuis_menus',JSON.stringify(JSON.parse(localStorage.getItem('gastenhuis_menus')||'[]').filter(x=>x.id!==id)));renderSaved()}function newMenu(){state={normal:{},veg:{},lf:{}};menuName.value='';normalCount.value=35;vegCount.value=0;lfCount.value=0;renderBuilder();renderPreview()}document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{target=b.dataset.target;document.querySelectorAll('[data-target]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderBuilder()});menuName.oninput=renderPreview;['normalCount','vegCount','lfCount'].forEach(id=>document.getElementById(id).oninput=renderPreview);saveBtn.onclick=save;newBtn.onclick=newMenu;dbBtn.onclick=()=>{dbModal.classList.add('open');renderDB()};closeDb.onclick=()=>dbModal.classList.remove('open');dbCategory.onchange=renderDB;dbAddBtn.onclick=()=>{let x=dbNew.value.trim(),c=dbCategory.value;if(x&&!DB[c].includes(x))DB[c].push(x);dbNew.value='';localStorage.setItem('gastenhuis_db_excel',JSON.stringify(DB));renderDB();renderBuilder()};function renderDB(){dbCategory.innerHTML=Object.keys(DB).sort().map(x=>`<option>${esc(x)}</option>`).join('');let c=dbCategory.value;dbList.innerHTML=(DB[c]||[]).map((x,i)=>`<div class="dbitem"><span>${esc(x)}</span><button class="secondary" onclick="delDB(${i})">Verwijderen</button></div>`).join('')}function delDB(i){let c=dbCategory.value;if(confirm('Dit onderdeel uit de database verwijderen?')){DB[c].splice(i,1);localStorage.setItem('gastenhuis_db_excel',JSON.stringify(DB));renderDB();renderBuilder()}}let savedDB=localStorage.getItem('gastenhuis_db_excel');if(savedDB)try{DB=JSON.parse(savedDB)}catch(e){}renderBuilder();renderPreview();renderSaved();</script></body></html>
