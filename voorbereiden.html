<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f8f72"><title>Voorbereiden · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:14px;background:linear-gradient(135deg,#dfe9dc,#f8e8d6);text-align:center}header img{width:130px;height:42px;object-fit:contain}main{max-width:1000px;margin:auto;padding:20px 16px}.back{display:inline-block;color:var(--green);font-weight:800;text-decoration:none;margin-bottom:10px}h1{margin:12px 0 4px}.sub{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;min-height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800}.card span{font-size:30px;margin-bottom:8px}.card small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:5px}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="start.html">← Terug naar keukenhulp</a><h1>👩‍🍳 Voorbereiden</h1><div class="sub">Rustig overzicht van wat er voorbereid moet worden.</div><div class="cards"><div class="card"><span>📅</span>Vandaag<small>Voorbereidingen voor vandaag</small></div><div class="card"><span>⏭️</span>Morgen<small>Wat alvast klaar kan</small></div><div class="card"><span>📋</span>Overzicht<small>Alles voor de komende dagen</small></div></div></main></body></html>
