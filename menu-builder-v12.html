<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer v12</title><style>body{margin:0;background:#fffaf3;color:#34433b;font:14px Calibri,Arial}header{padding:12px 18px;background:#dfe9dc}main{max-width:1450px;margin:auto;padding:10px}.builder{width:100%;height:760px;border:1px solid #e9e2d8;border-radius:12px}.planner{margin-top:12px;background:#fff;border:1px solid #e9e2d8;border-radius:12px;padding:12px}.week{margin-top:8px;border:1px solid #e9e2d8;border-radius:10px;overflow:hidden}.week summary{background:#dfe9dc;padding:9px;font-weight:bold;cursor:pointer}.day{display:grid;grid-template-columns:90px 1fr 70px 70px 70px 25px;gap:7px;align-items:center;padding:7px;border-bottom:1px solid #e9e2d8}.day input,.day select{width:100%;box-sizing:border-box;padding:6px;border:1px solid #d8d4cc;border-radius:7px}.lab{font-size:9px;text-align:center;color:#718078}.clear{border:0;background:none;color:#718078;font-size:18px}.hint{font-size:11px;color:#718078}</style></head><body><header><h1>🍽️ Gastenhuis Menubouwer v12</h1><p>Menu maken → opslaan → plannen.</p></header><main><iframe class="builder" src="menu-builder-v11.html" title="Menubouwer"></iframe><section class="planner"><h2>📅 4-wekenplanning</h2><div class="hint">Het menu komt uit dezelfde opgeslagen menu's als hierboven. Aantallen horen bij de dag.</div><div id="w"></div></section></main><script>const MK='gastenhuis_menus_v1',PK='gastenhuis_4wekenplanning_v3',D=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];let p={};try{p=JSON.parse(localStorage.getItem(PK)||'{}')}catch(e){}const E=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function M(){try{let a=JSON.parse(localStorage.getItem(MK)||'[]');return Array.isArray(a)?a.filter(x=>x&&x.name).sort((a,b)=>a.name.localeCompare(b.name,'nl')):[]}catch(e){return[]}}function S(){localStorage.setItem(PK,JSON.stringify(p))}function R(){let ms=M(),h='';for(let w=1;w<=4;w++){h+='<details class="week" '+(w==1?'open':'')+'><summary>Week '+w+'</summary>';D.forEach((d,i)=>{let id='w'+w+'d'+i,q=p[id]||{};h+='<div class="day"><b>'+d+'</b><select data-m="'+id+'"><option value="">— Kies menu —</option>'+ms.map(x=>'<option value="'+E(x.id)+'" '+(q.menuId===x.id?'selected':'')+'>'+E(x.name)+'</option>').join('')+'</select>'+[['normal','Normaal',35],['veg','Veggie',0],['lf','LF Veggie',0]].map(a=>'<div><div class="lab">'+a[1]+'</div><input type="number" min="0" value="'+(q[a[0]]??a[2])+'" data-k="'+a[0]+'" data-id="'+id+'"></div>').join('')+'<button class="clear" data-x="'+id+'">×</button></div>'});h+='</details>'}document.getElementById('w').innerHTML=h;document.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{let q=p[x.dataset.m]||{};q.menuId=x.value;p[x.dataset.m]=q;S()});document.querySelectorAll('[data-k]').forEach(x=>x.onchange=()=>{let q=p[x.dataset.id]||{};q[x.dataset.k]=Math.max(0,Number(x.value)||0);p[x.dataset.id]=q;S()});document.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{delete p[x.dataset.x];S();R()})}R();window.addEventListener('storage',R);</script></body></html>
