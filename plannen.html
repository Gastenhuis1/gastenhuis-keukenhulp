<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plannen · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1000px;margin:auto;padding:20px 16px}.back{color:var(--green);text-decoration:none;font-weight:700}h1{margin:15px 0 3px}.sub{color:var(--muted)}.weeks{display:grid;gap:10px;margin-top:20px}.week{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.wh{padding:15px;font-weight:800;font-size:18px;cursor:pointer;display:flex;justify-content:space-between}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 14px 14px}.week.closed .days{display:none}.day{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px;min-height:86px;cursor:pointer;text-align:left}.day.has{background:#f2f7ef;border-color:#bdd0b9}.dow{font-size:11px;font-weight:800;color:var(--muted)}.date{font-size:12px;color:var(--muted);margin:2px 0 7px}.mini{font-size:12px;line-height:1.35}.modal{display:none;position:fixed;inset:0;background:#26302966;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{background:var(--bg);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:17px}.top{display:flex;justify-content:space-between;align-items:center}.top h2{margin:0}.close{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px}.slot{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:11px}.slothead{display:flex;justify-content:space-between;align-items:center;gap:10px}.slot h3{margin:0;font-size:17px}.current{margin-top:8px;font-weight:800}.hint{font-size:12px;color:var(--muted);margin-top:4px}.choose{border:0;background:var(--green);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}.total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:#f3f7ef;border-radius:12px;padding:10px 12px;font-weight:800}.savecounts{border:0;background:var(--green);color:#fff;border-radius:9px;padding:7px 10px;font-weight:800}.search{width:100%;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:11px}.result{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin:6px 0}.result strong{display:block}.result small{color:var(--muted)}.backpick{border:0;background:none;color:var(--green);font-weight:800;padding:8px 0}.tag{display:inline-block;background:#f1f4ed;border-radius:99px;padding:3px 7px;margin:3px 3px 0 0;font-size:11px}@media(max-width:700px){.days{grid-template-columns:repeat(2,1fr)}.counts{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar overzicht</a><h1>📅 Plannen</h1><div class="sub">Klik op een dag en kies daar je menu, dessert en aantallen.</div><div id="weeks" class="weeks"></div></main><div id="modal" class="modal"><div class="sheet"><div class="top"><h2 id="title"></h2><button class="close" onclick="closeModal()">✕</button></div><div id="dayView"></div><div id="pickView" style="display:none"><button class="backpick" onclick="showDay()">← Terug naar dag</button><h3 id="pickTitle"></h3><input id="search" class="search" placeholder="Zoeken…" oninput="drawResults()"><div id="results"></div></div></div></div><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let menus=[],mv=[],desserts=[],dv=[],bakes=[],plans=[],bp=[],date='',type='',openWeek=0;const params=new URLSearchParams(location.search),requested=params.get('date');const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d};let focus=requested?new Date(requested+'T12:00:00'):new Date(),start=monday(focus);const iso=d=>{d=new Date(d);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};async function req(p,o={}){let r=await fetch(c.url+'/rest/v1/'+p,{...o,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function load(){let end=new Date(start);end.setDate(start.getDate()+28);[menus,mv,desserts,dv,bakes,plans,bp]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name&order=name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name&order=name'),req('dessert_logical_variants?select=*'),req('baking_logical_cards?gearchiveerd=eq.false&select=id,name,category&order=name'),req(`menu_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(end)}&select=*`),req(`daily_baking_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(end)}&select=*`)]);draw();if(requested){let diff=Math.floor((new Date(requested+'T12:00:00')-start)/86400000),w=Math.max(0,Math.min(3,Math.floor(diff/7)));openDay(requested,w)}}function dayPlan(ds){return plans.find(x=>x.plan_date===ds)}function baking(ds){return bp.filter(x=>x.plan_date===ds).map(x=>bakes.find(b=>b.id===x.baking_id)).filter(Boolean)}function draw(){let names=['MA','DI','WO','DO','VR','ZA','ZO'],h='';for(let w=0;w<4;w++){let cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),p=dayPlan(ds),m=menus.find(x=>x.id===p?.logical_menu_id),de=desserts.find(x=>x.id===p?.logical_dessert_id),bs=baking(ds),has=m||de||bs.length||p?.diners_total;cards+=`<button class="day ${has?'has':''}" onclick="openDay('${ds}',${w})"><div class="dow">${names[i]}</div><div class="date">${d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</div><div class="mini">${p?.diners_total?'👥 '+p.diners_total+' eters<br>':''}${m?'🍽️ '+m.name:''}${de?'<br>🍨 '+de.name:''}${bs.length?'<br>🍰 '+bs.map(x=>x.name).join(', '):''}${!has?'+ Plannen':''}</div></button>`}let a=new Date(start);a.setDate(start.getDate()+w*7);h+=`<section class="week ${w===openWeek?'':'closed'}"><div class="wh" onclick="toggle(${w})"><span>${w===openWeek?'▾':'▸'} Week ${weekNo(a)} · ${a.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</span></div><div class="days">${cards}</div></section>`}weeks.innerHTML=h}function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function toggle(w){openWeek=openWeek===w?-1:w;draw()}function openDay(ds,w){date=ds;openWeek=w;draw();title.textContent=new Date(ds+'T12:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});showDay();modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function showDay(){pickView.style.display='none';dayView.style.display='block';let p=dayPlan(date)||{},m=menus.find(x=>x.id===p.logical_menu_id),d=desserts.find(x=>x.id===p.logical_dessert_id),bs=baking(date);let normal=Math.max(0,(+p.diners_total||0)-(+p.diners_veggie||0)-(+p.diners_lactosevrij||0)-(+p.diners_veggie_lf||0));dayView.innerHTML=`<div class="slot"><h3>👥 Aantallen</h3><div class="counts"><div class="field"><label>Aantal eters</label><input id="ct" type="number" min="0" value="${p.diners_total||0}"></div><div class="field"><label>Veggie</label><input id="cv" type="number" min="0" value="${p.diners_veggie||0}"></div><div class="field"><label>Lactosevrij</label><input id="cl" type="number" min="0" value="${p.diners_lactosevrij||0}"></div><div class="field"><label>Veggie + lactosevrij</label><input id="cvl" type="number" min="0" value="${p.diners_veggie_lf||0}"></div><div class="total"><span>Normaal: ${normal}</span><button class="savecounts" onclick="saveCounts()">Opslaan</button></div></div></div>`+slot('🍽️ Menu',m?.name||'Nog niet gekozen','menu')+slot('🍨 Dessert',d?.name||'Nog niet gekozen','dessert')+slot('🍰 Bakken & snacks',bs.length?bs.map(x=>x.name).join(' · '):'Alleen toevoegen als het die dag uitkomt','baking')}async function saveCounts(){let p=dayPlan(date)||{house:0,start_date:iso(start),plan_date:date},vals=[ct,cv,cl,cvl].map(x=>Math.max(0,parseInt(x.value)||0));if(vals[1]+vals[2]+vals[3]>vals[0]){alert('Veggie, lactosevrij en veggie + lactosevrij kunnen samen niet hoger zijn dan het aantal eters.');return}p.diners_total=vals[0];p.diners_veggie=vals[1];p.diners_lactosevrij=vals[2];p.diners_veggie_lf=vals[3];p.updated_at=new Date().toISOString();await savePlan(p);await load();showDay()}async function savePlan(p){if(p.id)return req(`menu_plans?id=eq.${p.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});return req('menu_plans',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)})}function slot(label,value,t){return `<div class="slot"><div class="slothead"><h3>${label}</h3><button class="choose" onclick="pick('${t}')">${t==='baking'?'Toevoegen':'Kiezen / wijzigen'}</button></div><div class="current">${value}</div>${t==='baking'?'<div class="hint">Extra activiteit; mag leeg blijven.</div>':''}</div>`}function pick(t){type=t;dayView.style.display='none';pickView.style.display='block';pickTitle.textContent=t==='menu'?'Menu kiezen':t==='dessert'?'Dessert kiezen':'Bakken & snacks toevoegen';search.value='';drawResults();search.focus()}function normText(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/tomaten?/g,'tomat').replace(/tomaat/g,'tomat').replace(/\s+/g,' ').trim()}function hay(x){if(type==='menu')return normText([x.name,...mv.filter(v=>v.menu_id===x.id).flatMap(v=>[v.hoofdcomponent,v.zetmeel,v.groente,v.salade,v.saus,v.stamppot])].filter(Boolean).join(' '));if(type==='dessert')return normText([x.name,...dv.filter(v=>v.dessert_id===x.id).map(v=>v.uitvoering)].join(' '));return normText(x.name+' '+x.category)}function list(){return type==='menu'?menus:type==='dessert'?desserts:bakes}function drawResults(){let q=normText(search.value),a=list().filter(x=>hay(x).includes(q));results.innerHTML=a.map(x=>{let detail='';if(type==='menu'){let v=mv.find(v=>v.menu_id===x.id&&v.variant_type==='gewoon');detail=v?[v.hoofdcomponent,v.stamppot||v.zetmeel,v.groente,v.saus].filter(Boolean).map(z=>`<span class="tag">${z}</span>`).join(''):''}else if(type==='baking')detail=`<small>${x.category}</small>`;return `<button class="result" onclick="selectItem(${x.id})"><strong>${x.name}</strong>${detail}</button>`}).join('')||'<div class="hint">Niets gevonden</div>'}async function selectItem(id){if(type==='baking'){await req('daily_baking_plans',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({house:0,plan_date:date,baking_id:id})})}else{let p=dayPlan(date)||{house:0,start_date:iso(start),plan_date:date};if(type==='menu')p.logical_menu_id=id;else p.logical_dessert_id=id;p.updated_at=new Date().toISOString();await savePlan(p)}await load();showDay()}load().catch(console.error);</script></body></html>
