<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plannen · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--line:#e9e2d8;--sage:#edf4e9;--peach:#fff0e2}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1000px;margin:auto;padding:20px 16px 60px}.back{color:var(--green);text-decoration:none;font-weight:800}.weeks{display:grid;gap:10px;margin-top:18px}.week{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.wh{padding:15px;font-weight:800;font-size:18px;cursor:pointer}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 14px 14px}.week.closed .days{display:none}.day{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px;min-height:90px;cursor:pointer;text-align:left}.day.has{background:#f2f7ef;border-color:#bdd0b9}.dow{font-size:11px;font-weight:900;color:var(--muted)}.date{font-size:12px;color:var(--muted);margin:2px 0 7px}.mini{font-size:12px;line-height:1.35}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:20;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:17px}.top,.slothead{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h2,.slot h3{margin:0}.close,.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}.slot{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:11px}.current{margin-top:8px;font-weight:800}.hint{font-size:12px;color:var(--muted);margin-top:5px}.choose,.save{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.secondary{border:0;background:var(--sage);color:#506d53;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer;margin-top:9px}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}.total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:#f3f7ef;border-radius:12px;padding:10px 12px;font-weight:800}.search{width:100%;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:11px;font:inherit}.result{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:7px 0;cursor:pointer}.result:hover{background:#f4f8f1}.result strong{display:block;font-size:16px}.tag{display:inline-block;background:#f1f4ed;border-radius:99px;padding:3px 7px;margin:5px 3px 0 0;font-size:11px}.backpick{border:0;background:none;color:var(--green);font-weight:800;padding:8px 0;cursor:pointer}.variant{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.variant h4{margin:0 0 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menuName{margin-top:10px}.status{font-size:12px;color:var(--muted);margin-top:8px}.changed{display:inline-block;background:#fff0d8;border-radius:99px;padding:3px 8px;font-size:11px;color:#8b6849;margin-left:6px}@media(max-width:700px){.days{grid-template-columns:repeat(2,1fr)}.counts,.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.counts,.grid{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar overzicht</a><h1>📅 Plannen</h1><div style="color:var(--muted)">Kies per dag een menu, dessert en aantallen. Je kunt een menu ook alleen voor die dag aanpassen.</div><div id="weeks" class="weeks"></div></main><div id="modal" class="modal"><div class="sheet"><div class="top"><h2 id="title"></h2><button class="close" onclick="closeModal()">✕</button></div><div id="dayView"></div><div id="pickView" style="display:none"><button class="backpick" onclick="showDay()">← Terug naar dag</button><h3 id="pickTitle"></h3><input id="search" class="search" type="search" autocomplete="off" placeholder="Zoeken…" oninput="drawResults()"><div id="results"></div><div id="pickMsg" class="status"></div></div><div id="editView" style="display:none"><button class="backpick" onclick="showDay()">← Terug naar dag</button><h3>✏️ Menu voor deze dag aanpassen</h3><div class="hint">Dit verandert alleen deze datum. De standaard menukaart blijft hetzelfde.</div><div id="editForm"></div></div></div></div><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;const $=id=>document.getElementById(id);let menus=[],mv=[],desserts=[],dv=[],plans=[],overrides=[],date='',type='',openWeek=0,choosing=false;const params=new URLSearchParams(location.search),requested=params.get('date');function monday(d){d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d}let start=monday(requested?new Date(requested+'T12:00:00'):new Date());const iso=d=>{d=new Date(d);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};async function req(p,o={}){let r=await fetch(c.url+'/rest/v1/'+p,{...o,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function load(reopen=true){let end=new Date(start);end.setDate(start.getDate()+28);[menus,mv,desserts,dv,plans,overrides]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name&order=name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name&order=name'),req('dessert_logical_variants?select=*'),req(`menu_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(end)}&select=*`),req(`daily_menu_overrides?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(end)}&select=*`)]);draw();if(reopen&&requested&&!date){let diff=Math.floor((new Date(requested+'T12:00:00')-start)/86400000);openDay(requested,Math.max(0,Math.min(3,Math.floor(diff/7))))}}function p(ds){return plans.find(x=>x.plan_date===ds)||{}}function ovs(ds){return overrides.filter(x=>x.plan_date===ds)}function menuName(ds){let o=ovs(ds).find(x=>x.variant_type==='gewoon'),pp=p(ds),m=menus.find(x=>x.id===pp.logical_menu_id);return o?.menu_name||m?.name||''}function draw(){let names=['MA','DI','WO','DO','VR','ZA','ZO'],h='';for(let w=0;w<4;w++){let cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),pp=p(ds),mn=menuName(ds),de=desserts.find(x=>x.id===pp.logical_dessert_id),has=mn||de||pp.diners_total;cards+=`<button class="day ${has?'has':''}" onclick="openDay('${ds}',${w})"><div class="dow">${names[i]}</div><div class="date">${d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</div><div class="mini">${pp.diners_total?'👥 '+pp.diners_total+' eters<br>':''}${mn?'🍽️ '+mn:''}${de?'<br>🍨 '+de.name:''}${!has?'+ Plannen':''}</div></button>`}let a=new Date(start);a.setDate(start.getDate()+w*7);h+=`<section class="week ${w===openWeek?'':'closed'}"><div class="wh" onclick="toggle(${w})">${w===openWeek?'▾':'▸'} Week ${weekNo(a)} · ${a.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</div><div class="days">${cards}</div></section>`}$('weeks').innerHTML=h}function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function toggle(w){openWeek=openWeek===w?-1:w;draw()}function openDay(ds,w){date=ds;openWeek=w;draw();$('title').textContent=new Date(ds+'T12:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});showDay();$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function showDay(){$('pickView').style.display='none';$('editView').style.display='none';$('dayView').style.display='block';let pp=p(date),mn=menuName(date),de=desserts.find(x=>x.id===pp.logical_dessert_id),changed=ovs(date).length>0,normal=Math.max(0,(+pp.diners_total||0)-(+pp.diners_veggie||0)-(+pp.diners_lactosevrij||0)-(+pp.diners_veggie_lf||0));$('dayView').innerHTML=`<div class="slot"><h3>👥 Aantallen</h3><div class="counts"><div class="field"><label>Aantal eters</label><input id="ct" type="number" min="0" value="${pp.diners_total||0}"></div><div class="field"><label>Veggie</label><input id="cv" type="number" min="0" value="${pp.diners_veggie||0}"></div><div class="field"><label>Lactosevrij</label><input id="cl" type="number" min="0" value="${pp.diners_lactosevrij||0}"></div><div class="field"><label>Veggie + lactosevrij</label><input id="cvl" type="number" min="0" value="${pp.diners_veggie_lf||0}"></div><div class="total"><span>Normaal: ${normal}</span><button class="save" onclick="saveCounts()">Opslaan</button></div></div></div><div class="slot"><div class="slothead"><h3>🍽️ Menu</h3><button class="choose" onclick="pick('menu')">Kiezen / wijzigen</button></div><div class="current">${mn||'Nog niet gekozen'}${changed?'<span class="changed">aangepast voor deze dag</span>':''}</div><button class="secondary" onclick="editDayMenu()">✏️ ${mn?'Menu voor deze dag aanpassen':'Zelf samenstellen voor deze dag'}</button></div><div class="slot"><div class="slothead"><h3>🍨 Dessert</h3><button class="choose" onclick="pick('dessert')">Kiezen / wijzigen</button></div><div class="current">${de?.name||'Nog niet gekozen'}</div></div>`}async function ensurePlan(){let pp=p(date);if(pp.id)return pp;let body={house:0,start_date:iso(monday(new Date(date+'T12:00'))),plan_date:date,diners_total:0,diners_veggie:0,diners_lactosevrij:0,diners_veggie_lf:0};let r=await req('menu_plans',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});return Array.isArray(r)?r[0]:r}async function patchPlan(fields){let pp=await ensurePlan();await req(`menu_plans?id=eq.${pp.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({...fields,updated_at:new Date().toISOString()})});return pp.id}async function saveCounts(){let vals=['ct','cv','cl','cvl'].map(id=>Math.max(0,parseInt($(id).value)||0));if(vals[1]+vals[2]+vals[3]>vals[0])return alert('De afwijkende aantallen zijn samen hoger dan het aantal eters.');await patchPlan({diners_total:vals[0],diners_veggie:vals[1],diners_lactosevrij:vals[2],diners_veggie_lf:vals[3]});await load(false);showDay()}function pick(t){type=t;$('dayView').style.display='none';$('editView').style.display='none';$('pickView').style.display='block';$('pickTitle').textContent=t==='menu'?'Menu kiezen':'Dessert kiezen';$('search').value='';$('pickMsg').textContent='';drawResults();setTimeout(()=>$('search').focus(),50)}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/tomatensaus/g,'tomaat saus').replace(/tomatenpuree/g,'tomaat puree').replace(/tomatenblokjes/g,'tomaat blokjes').replace(/tomaten/g,'tomaat').replace(/[^a-z0-9]+/g,' ').trim()}function hayMenu(x){return norm([x.name,...mv.filter(v=>v.menu_id===x.id).flatMap(v=>[v.hoofdcomponent,v.zetmeel,v.groente,v.salade,v.saus,v.stamppot])].filter(Boolean).join(' '))}function drawResults(){let q=norm($('search').value),terms=q.split(' ').filter(Boolean),list=type==='menu'?menus:desserts,a=list.filter(x=>{let h=type==='menu'?hayMenu(x):norm([x.name,...dv.filter(v=>v.dessert_id===x.id).map(v=>v.uitvoering)].join(' '));return terms.every(t=>h.includes(t))});$('results').innerHTML=a.map(x=>{let detail='';if(type==='menu'){let v=mv.find(v=>v.menu_id===x.id&&v.variant_type==='gewoon');detail=v?[v.hoofdcomponent,v.stamppot||v.zetmeel,v.groente,v.saus].filter(Boolean).map(z=>`<span class="tag">${z}</span>`).join(''):''}return `<button type="button" class="result pick-result" data-id="${x.id}"><strong>${x.name}</strong>${detail}</button>`}).join('')||'<div class="hint">Niets gevonden</div>'}document.addEventListener('click',e=>{let b=e.target.closest('.pick-result');if(!b)return;e.preventDefault();chooseItem(Number(b.dataset.id),b)},true);async function chooseItem(id,btn){if(choosing)return;choosing=true;let chosen=type==='menu'?menus.find(x=>x.id===id):desserts.find(x=>x.id===id);$('pickMsg').textContent=(chosen?.name||'Keuze')+' wordt opgeslagen…';if(btn){btn.disabled=true;btn.style.opacity='.55'}try{if(type==='menu'){let planId=await patchPlan({logical_menu_id:id,menu_card_id:id});await req(`daily_menu_overrides?house=eq.0&plan_date=eq.${date}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});let check=await req(`menu_plans?id=eq.${planId}&select=logical_menu_id,menu_card_id`);if(!check?.[0]||Number(check[0].logical_menu_id)!==Number(id)){throw Error('Menu is niet opgeslagen')}}else await patchPlan({logical_dessert_id:id});await load(false);showDay()}catch(e){console.error(e);$('pickMsg').textContent='Opslaan is niet gelukt: '+(e.message||'onbekende fout');alert('Opslaan is niet gelukt.')}finally{choosing=false;if(btn){btn.disabled=false;btn.style.opacity='1'}}}function baseFor(vt){let pp=p(date),base=mv.find(v=>v.menu_id===pp.logical_menu_id&&v.variant_type===vt)||{},o=ovs(date).find(x=>x.variant_type===vt)||{};return{...base,...o}}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function editDayMenu(){$('dayView').style.display='none';$('pickView').style.display='none';$('editView').style.display='block';let names={gewoon:'Normaal',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie + lactosevrij'},mn=menuName(date)||menus.find(x=>x.id===p(date).logical_menu_id)?.name||'';$('editForm').innerHTML=`<div class="field menuName"><label>Naam van dit menu op deze dag</label><input id="customName" value="${esc(mn)}" placeholder="Bijv. Bolognese met rijst"></div>`+Object.keys(names).map(vt=>{let v=baseFor(vt);return `<div class="variant"><h4>${names[vt]}</h4><div class="grid">${['hoofdcomponent','zetmeel','groente','salade','saus','stamppot'].map(f=>`<div class="field"><label>${f[0].toUpperCase()+f.slice(1)}</label><input id="${vt}_${f}" value="${esc(v[f]||'')}"></div>`).join('')}</div></div>`}).join('')+`<button class="save" onclick="saveDayMenu()">Opslaan voor ${new Date(date+'T12:00').toLocaleDateString('nl-NL',{weekday:'long'})}</button><div id="editStatus" class="status"></div>`}async function saveDayMenu(){let menu_name=$('customName').value.trim()||'Menu '+date,types=['gewoon','lactosevrij','veggie','veggie_lf'],fields=['hoofdcomponent','zetmeel','groente','salade','saus','stamppot'];$('editStatus').textContent='Opslaan…';try{await ensurePlan();await req(`daily_menu_overrides?house=eq.0&plan_date=eq.${date}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});let rows=types.map(vt=>{let r={house:0,plan_date:date,variant_type:vt,menu_name};fields.forEach(f=>r[f]=$(vt+'_'+f).value.trim()||null);return r});await req('daily_menu_overrides',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(rows)});await load(false);showDay()}catch(e){console.error(e);$('editStatus').textContent='Opslaan is niet gelukt.';alert('Opslaan is niet gelukt.')}}load().catch(e=>{console.error(e);alert('Planning kon niet geladen worden.')});</script></body></html>
