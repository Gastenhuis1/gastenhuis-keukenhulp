<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer</title><style>body{margin:0;background:#fffaf3;color:#34433b;font:14px Calibri,Arial}header{padding:12px 18px;background:#dfe9dc}main{max-width:1350px;margin:auto;padding:10px}.builder{width:100%;height:760px;border:1px solid #e9e2d8;border-radius:12px}.planner{margin-top:12px;background:#fff;border:1px solid #e9e2d8;border-radius:12px;padding:12px}.week{margin-top:8px;border:1px solid #e9e2d8;border-radius:10px;overflow:hidden}.week summary{background:#dfe9dc;padding:9px;font-weight:700;cursor:pointer}.day{display:grid;grid-template-columns:90px 1fr 65px 65px 65px 25px;gap:6px;align-items:center;padding:6px;border-bottom:1px solid #e9e2d8}.day input,.day select{width:100%;box-sizing:border-box;padding:6px;border:1px solid #d8d4cc;border-radius:7px}.lab{font-size:9px;text-align:center;color:#718078}.clear{border:0;background:none;color:#718078}.hint{font-size:11px;color:#718078;margin-bottom:8px}.planner h2{margin:0 0 4px}@media(max-width:800px){.day{grid-template-columns:65px 1fr 55px 55px 55px 20px}.builder{height:900px}}</style><header><b>🍽️ Gastenhuis Menubouwer</b><div class="hint">Menu samenstellen bovenaan · aantallen per geplande dag onderaan</div></header><main><iframe class="builder" src="menu-builder-v11.html" title="Menubouwer"></iframe><section class="planner"><h2>📅 4-wekenplanning</h2><div class="hint">Kies een opgeslagen menu en vul daarna per dag de aantallen in.</div><div id="weeks"></div></section></main><script>const days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'],MENU_KEY='gastenhuis_menus_v1',PLAN_KEY='gastenhuis_4wekenplanning_v3';let plan=JSON.parse(localStorage.getItem(PLAN_KEY)||'{}');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function menus(){try{const a=JSON.parse(localStorage.getItem(MENU_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.name==='string'):[]}catch(e){return[]}}function render(){const ms=menus();let h='';for(let w=1;w<=4;w++){h+='<details class="week" '+(w===1?'open':'')+'><summary>Week '+w+'</summary>';days.forEach((d,i)=>{const id='w'+w+'d'+i,p=plan[id]||{};h+='<div class="day"><b>'+d+'</b><select data-m="'+id+'"><option value="">— Kies menu —</option>'+ms.map(m=>'<option value="'+esc(m.id)+'" '+(m.id===p.menuId?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select><div><div class="lab">Normaal</div><input type="number" min="0" value="'+(p.normal??35)+'" data-c="'+id+'" data-t="normal"></div><div><div class="lab">Veggie</div><input type="number" min="0" value="'+(p.veg??0)+'" data-c="'+id+'" data-t="veg"></div><div><div class="lab">LF Veggie</div><input type="number" min="0" value="'+(p.lf??0)+'" data-c="'+id+'" data-t="lf"></div><button class="clear" data-x="'+id+'">×</button></div>'});h+='</details>'}document.getElementById('weeks').innerHTML=h;document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{const p=plan[e.dataset.m]||{};p.menuId=e.value;plan[e.dataset.m]=p;save()});document.querySelectorAll('[data-c]').forEach(e=>e.onchange=()=>{const p=plan[e.dataset.c]||{};p[e.dataset.t]=Math.max(0,Number(e.value)||0);plan[e.dataset.c]=p;save()});document.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{delete plan[e.dataset.x];save();render()})}function save(){localStorage.setItem(PLAN_KEY,JSON.stringify(plan))}render();window.addEventListener('storage',e=>{if(e.key===MENU_KEY)render()});</script></html>
