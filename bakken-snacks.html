<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bakken & snacks · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8;--shadow:0 8px 24px #3c463c14}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:14px;background:linear-gradient(135deg,var(--sage),#f8e8d6);text-align:center}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 50px}.back{display:inline-block;color:var(--green);font-weight:800;text-decoration:none;margin-bottom:10px}h1{margin:12px 0 4px}.sub,.status{color:var(--muted)}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0 12px}.cat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 8px;text-align:center;font-weight:800;cursor:pointer}.cat.on{background:var(--sage);border-color:#b9cfb6}.cat span{display:block;font-size:25px;margin-bottom:5px}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.badge{display:inline-block;background:#f5eee4;border-radius:99px;padding:3px 8px;font-size:12px;font-weight:800}.title{font-size:20px;font-weight:800;margin:8px 0}.portions{font-size:13px;color:var(--muted);margin-bottom:7px}.variant{padding:8px 0;border-top:1px solid #f0ece6}.vhead{font-size:13px;font-weight:800}.execution{font-size:14px;margin-top:3px}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}@media(max-width:800px){.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar 4-wekenmenu</a><h1>🍰 Bakken & snacks</h1><div class="sub">Kies een categorie of zoek direct in alle recepten.</div><div class="cats"><div class="cat on" data-cat="" onclick="pick(this)"><span>🗂️</span>Alles</div><div class="cat" data-cat="Taart" onclick="pick(this)"><span>🎂</span>Taart</div><div class="cat" data-cat="Cake" onclick="pick(this)"><span>🍰</span>Cake</div><div class="cat" data-cat="Koekjes" onclick="pick(this)"><span>🍪</span>Koekjes</div><div class="cat" data-cat="Pizza" onclick="pick(this)"><span>🍕</span>Pizza</div><div class="cat" data-cat="Hartig" onclick="pick(this)"><span>🥧</span>Hartig</div><div class="cat" data-cat="Overig" onclick="pick(this)"><span>📦</span>Overig</div></div><input id="search" class="search" placeholder="Zoek recept…" oninput="draw()"><div id="status" class="status">Laden…</div><div id="grid" class="grid"></div></main><script>const U='https://cttotbzkcluauzzgnybh.supabase.co';let K='',cards=[],variants=[],category='';async function key(){let t=await fetch('index.html').then(r=>r.text());let m=t.match(/const\s+SUPABASE_(?:ANON_)?KEY\s*=\s*['\"]([^'\"]+)/i)||t.match(/const\s+SB_KEY\s*=\s*['\"]([^'\"]+)/i);K=m?.[1]||''}async function sb(p){let r=await fetch(U+'/rest/v1/'+p,{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(await r.text());return r.json()}const e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};function block(type,vs){let v=vs.find(x=>x.variant_type===type);return v?`<div class="variant"><div class="vhead">${labels[type]}</div><div class="execution">${e(v.uitvoering)}</div></div>`:''}function pick(el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));el.classList.add('on');category=el.dataset.cat;draw()}function draw(){let q=search.value.trim().toLowerCase();let a=cards.filter(c=>{let vs=variants.filter(v=>v.baking_id===c.id);let match=[c.name,c.category,...vs.map(v=>v.uitvoering)].join(' ').toLowerCase().includes(q);return (!category||c.category===category)&&match});grid.innerHTML=a.length?a.map(c=>{let vs=variants.filter(v=>v.baking_id===c.id);return `<article class="card"><span class="badge">${e(c.category)}</span><div class="title">${e(c.name)}</div><div class="portions">Basis: ${e(c.default_portions||'–')} porties/stuks</div>${['gewoon','lactosevrij','veggie','veggie_lf'].map(t=>block(t,vs)).join('')}</article>`}).join(''):'<div class="empty">Geen recepten gevonden.</div>'}async function load(){await key();try{cards=await sb('baking_logical_cards?gearchiveerd=eq.false&select=*&order=category.asc,name.asc');variants=await sb('baking_logical_variants?select=*');status.textContent=cards.length+' kaarten';draw()}catch(x){console.error(x);status.textContent='Recepten konden niet worden geladen.'}}load();</script></body></html>
