<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu's · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8;--shadow:0 8px 24px #3c463c14}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:9px 14px;background:linear-gradient(135deg,var(--sage),#f8e8d6);text-align:center}header img{width:120px;height:39px;object-fit:contain}main{max-width:1050px;margin:auto;padding:18px 16px 50px}.back{color:var(--green);font-weight:800;text-decoration:none}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:14px 0}.head h1{margin:0;font-size:28px}.sub,.status{color:var(--muted);font-size:14px}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#fff;font:inherit;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.title{font-size:20px;font-weight:800;margin-bottom:12px}.variant{border-top:1px solid #f0ece6;padding:10px 0}.variant:first-of-type{border-top:0}.vhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}.ok{background:var(--sage);border-radius:99px;padding:3px 8px}.missing{color:#a3aaa5;font-weight:600}.parts{font-size:14px;line-height:1.45;margin-top:5px}.parts span{display:block}.actions{display:flex;gap:7px;margin-top:10px}button{border:0;border-radius:12px;padding:9px 12px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:20;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px;padding:18px}.sheettop{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}input{width:100%;padding:11px;border:1px solid #d8d4cc;border-radius:11px;background:#fff;font:inherit}.variantTabs{display:flex;gap:7px;flex-wrap:wrap}.variantTabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}.variantTabs button.on{background:var(--sage);border-color:#b9cfb6}.save{width:100%;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.full{grid-column:1}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar 4-wekenmenu</a><div class="head"><div><h1>🍽️ Menu's</h1><div class="sub">Eén menu, met de varianten Gewoon · Lactosevrij · Veggie · Veggie lactosevrij</div></div><button onclick="newMenu()">+ Nieuw menu</button></div><input id="search" class="search" placeholder="Zoek op menu, gerecht, groente, saus…" oninput="draw()"><div id="status" class="status">Laden…</div><div id="grid" class="grid"></div></main><div id="modal" class="modal"><div class="sheet"><div class="sheettop"><h2 id="formTitle">Nieuw menu</h2><button class="secondary" onclick="closeForm()">✕</button></div><div class="form"><div class="full"><label>Naam van het menu</label><input id="fName" placeholder="Bijv. Kip kerrie"></div><div class="full"><label>Variant</label><div class="variantTabs"><button id="tabGewoon" onclick="switchVariant('gewoon')">Gewoon</button><button id="tabLactosevrij" onclick="switchVariant('lactosevrij')">Lactosevrij</button><button id="tabVeggie" onclick="switchVariant('veggie')">Veggie</button><button id="tabVeggieLf" onclick="switchVariant('veggie_lf')">Veggie lactosevrij</button></div></div><div><label>Hoofdgerecht</label><input id="fMain"></div><div><label>Aardappel / rijst / pasta</label><input id="fStarch"></div><div><label>Groente</label><input id="fVeg"></div><div><label>Salade</label><input id="fSalad"></div><div><label>Saus</label><input id="fSauce"></div><div><label>Stamppot</label><input id="fStamp"></div><div class="full"><button class="save" onclick="saveMenu()">💾 Menu opslaan</button></div></div></div></div><script>const U='https://cttotbzkcluauzzgnybh.supabase.co';let K='',menus=[],variants=[],editId=null,current='gewoon',draft={};async function key(){let t=await fetch('index.html').then(r=>r.text());let m=t.match(/const\s+SUPABASE_(?:ANON_)?KEY\s*=\s*['\"]([^'\"]+)/i)||t.match(/const\s+SB_KEY\s*=\s*['\"]([^'\"]+)/i);K=m?.[1]||''}async function sb(p,o={}){let r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let x=await r.text();return x?JSON.parse(x):null}const e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function part(v){return [v?.hoofdcomponent,v?.stamppot||v?.zetmeel,v?.groente,v?.salade,v?.saus].filter(Boolean)}function vblock(type,label,vs){let v=vs.find(x=>x.variant_type===type);return `<div class="variant"><div class="vhead"><span>${label}</span>${v?'<span class="ok">✓ ingevuld</span>':'<span class="missing">Nog niet ingevuld</span>'}</div>${v?`<div class="parts">${part(v).map(x=>`<span>${e(x)}</span>`).join('')}</div>`:''}</div>`}async function load(){await key();try{menus=await sb('menu_logical_cards?gearchiveerd=eq.false&select=*&order=name.asc')||[];variants=await sb('menu_logical_variants?select=*')||[];status.textContent=menus.length?menus.length+' menu’s':'De kaartenbak is nog leeg.';draw()}catch(x){status.textContent='Kaartenbak kon niet worden geladen.'}}function draw(){let q=search.value.trim().toLowerCase();let a=menus.filter(m=>{let vs=variants.filter(v=>v.menu_id===m.id);return [m.name,...vs.flatMap(part)].join(' ').toLowerCase().includes(q)});grid.innerHTML=a.length?a.map(m=>{let vs=variants.filter(v=>v.menu_id===m.id);return `<article class="card"><div class="title">${e(m.name)}</div>${vblock('gewoon','Gewoon',vs)}${vblock('lactosevrij','Lactosevrij',vs)}${vblock('veggie','Veggie',vs)}${vblock('veggie_lf','Veggie lactosevrij',vs)}<div class="actions"><button class="secondary" onclick="editMenu(${m.id})">Bewerken</button></div></article>`}).join(''):'<div class="empty">Geen menu’s gevonden.</div>'}function blank(){return {hoofdcomponent:'',zetmeel:'',groente:'',salade:'',saus:'',stamppot:''}}function capture(){draft[current]={hoofdcomponent:fMain.value,zetmeel:fStarch.value,groente:fVeg.value,salade:fSalad.value,saus:fSauce.value,stamppot:fStamp.value}}function show(){let v=draft[current]||blank();fMain.value=v.hoofdcomponent||'';fStarch.value=v.zetmeel||'';fVeg.value=v.groente||'';fSalad.value=v.salade||'';fSauce.value=v.saus||'';fStamp.value=v.stamppot||'';[tabGewoon,tabLactosevrij,tabVeggie,tabVeggieLf].forEach(b=>b.classList.remove('on'));({gewoon:tabGewoon,lactosevrij:tabLactosevrij,veggie:tabVeggie,veggie_lf:tabVeggieLf})[current].classList.add('on')}function switchVariant(v){capture();current=v;show()}function newMenu(){editId=null;current='gewoon';draft={};fName.value='';formTitle.textContent='Nieuw menu';show();modal.classList.add('open')}function editMenu(id){editId=id;let m=menus.find(x=>x.id===id);fName.value=m.name;draft={};variants.filter(v=>v.menu_id===id).forEach(v=>draft[v.variant_type]={...v});current='gewoon';formTitle.textContent='Menu bewerken';show();modal.classList.add('open')}function closeForm(){modal.classList.remove('open')}function clean(v){let o={};for(let k of ['hoofdcomponent','zetmeel','groente','salade','saus','stamppot'])o[k]=(v?.[k]||'').trim()||null;return o}async function saveMenu(){capture();let name=fName.value.trim();if(!name)return alert('Geef het menu een naam.');if(!part(clean(draft.gewoon)).length)return alert('Vul minimaal de gewone variant in.');try{let id=editId;if(id){await sb('menu_logical_cards?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name,updated_at:new Date().toISOString()})})}else{let r=await sb('menu_logical_cards',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name})});id=r[0].id}for(let type of ['gewoon','lactosevrij','veggie','veggie_lf']){let v=clean(draft[type]);if(!part(v).length)continue;await sb('menu_logical_variants?on_conflict=menu_id,variant_type',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({menu_id:id,variant_type:type,...v,updated_at:new Date().toISOString()})})}closeForm();await load()}catch(x){console.error(x);alert('Opslaan mislukt.')}}load();</script></body></html>
