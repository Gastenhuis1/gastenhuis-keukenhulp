<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f8f72"><title>Menu kaartenbak · Het Gastenhuis</title><style>
:root{--bg:#fffaf3;--card:#fff;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--peach:#f6d7bd;--line:#e9e2d8;--shadow:0 8px 24px rgba(60,70,60,.08)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--sage),#f8e8d6);border-bottom:1px solid #ffffffaa;padding:7px 14px;text-align:center}header img{width:118px;height:38px;object-fit:contain}main{max-width:1050px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.head h1{font-size:25px;margin:0}.small{font-size:13px;color:var(--muted)}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:10px 14px;background:var(--green);color:white;font-weight:700;cursor:pointer}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin:12px 0}.tools input,.tools select,.form input,.form select{width:100%;padding:10px;border:1px solid #d8d4cc;border-radius:11px;background:white;color:var(--ink)}.seasons{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.season{background:white;color:var(--ink);border:1px solid var(--line);padding:8px 11px}.season.on{background:var(--sage);border-color:#b9cfb6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.menuCard{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:270px}.cardTop{display:flex;justify-content:space-between;gap:8px}.title{font-size:19px;font-weight:800;text-transform:uppercase}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.badge{font-size:11px;font-weight:800;border-radius:999px;padding:4px 7px;background:var(--sage)}.badge.lv{background:#dcebf1}.parts{margin:7px 0 12px;line-height:1.5;flex:1}.parts div{border-bottom:1px solid #f0ece6;padding:2px 0}.parts div:last-child{border:0}.dessert{margin-top:7px;padding-top:7px!important;border-top:1px dashed #d8d4cc!important}.actions{display:flex;gap:7px}.actions button{flex:1;padding:8px 9px}.empty{text-align:center;color:var(--muted);padding:35px}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.sheet{background:var(--bg);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:17px;box-shadow:0 18px 50px #0003}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead h2{margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}.checks{display:flex;gap:12px;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:11px;padding:10px}.checks label{color:var(--ink);margin:0;font-weight:600}.checks input{width:auto}.status{font-size:13px;color:var(--muted);margin:6px 0 10px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}@media(max-width:560px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:1}.head{align-items:flex-start;flex-direction:column}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}}
</style></head><body><header><img src="gastenhuis-logo.png" alt="Het Gastenhuis"></header><main><div class="head"><div><h1>🗂️ Menu kaartenbak</h1><div class="small">Complete menu's centraal opgeslagen</div></div><button onclick="openForm()">+ Nieuw menu</button></div><div class="tools"><input id="search" placeholder="Zoek op gerecht, groente, saus…" oninput="draw()"><select id="type" onchange="draw()"><option value="">Alle menu's</option><option value="gewoon">Gewoon</option><option value="veggie">Veggie</option></select><select id="lv" onchange="draw()"><option value="">Alle</option><option value="1">Lactosevrij</option><option value="0">Niet lactosevrij</option></select></div><div class="seasons"><button class="season" data-s="lente" onclick="toggleSeason(this)">🌱 Lente</button><button class="season" data-s="zomer" onclick="toggleSeason(this)">☀️ Zomer</button><button class="season" data-s="herfst" onclick="toggleSeason(this)">🍂 Herfst</button><button class="season" data-s="winter" onclick="toggleSeason(this)">❄️ Winter</button></div><div id="status" class="status">Laden…</div><div id="cards" class="grid"></div></main><div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h2 id="formTitle">Nieuw menu</h2><button class="secondary" onclick="closeForm()">✕</button></div><div class="form"><div><label>Type</label><select id="fType"><option value="gewoon">Gewoon</option><option value="veggie">Veggie</option></select></div><div><label>Lactosevrij</label><select id="fLv"><option value="0">Nee</option><option value="1">Ja</option></select></div><div class="full"><label>Seizoen(en)</label><div class="checks"><label><input type="checkbox" value="lente" class="fSeason"> 🌱 Lente</label><label><input type="checkbox" value="zomer" class="fSeason"> ☀️ Zomer</label><label><input type="checkbox" value="herfst" class="fSeason"> 🍂 Herfst</label><label><input type="checkbox" value="winter" class="fSeason"> ❄️ Winter</label></div></div><div><label>Hoofdcomponent</label><input id="fMain" placeholder="Bijv. Schnitzel"></div><div><label>Aardappel / rijst / pasta</label><input id="fStarch" placeholder="Bijv. Krieltjes"></div><div><label>Groente</label><input id="fVeg" placeholder="Bijv. Ratatouille"></div><div><label>Salade</label><input id="fSalad"></div><div><label>Saus</label><input id="fSauce" placeholder="Bijv. Champignonsaus"></div><div><label>Stamppot</label><input id="fStamp"></div><div class="full"><label>Dessert</label><input id="fDessert" placeholder="Bijv. Vanillevla"></div><div class="full"><button onclick="saveCard()">💾 Opslaan</button></div></div></div></div><script>
const SUPABASE_URL='https://cttotbzkcluauzzgnybh.supabase.co';
let API_KEY='',cards=[],activeSeasons=new Set(),editId=null;
async function getKey(){try{let t=await fetch('index.html').then(r=>r.text());let m=t.match(/const\s+SUPABASE_(?:ANON_)?KEY\s*=\s*['\"]([^'\"]+)/i)||t.match(/const\s+SB_KEY\s*=\s*['\"]([^'\"]+)/i)||t.match(/['\"]apikey['\"]\s*:\s*['\"]([^'\"]+)/i);if(m)API_KEY=m[1]}catch(e){}if(!API_KEY){document.getElementById('status').textContent='Database-sleutel niet gevonden in huidige app.';return false}return true}
async function sb(path,opt={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{apikey:API_KEY,Authorization:'Bearer '+API_KEY,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function title(c){return [c.hoofdcomponent,c.stamppot||c.zetmeel,c.groente].filter(Boolean).join(' · ')||'Menu'}
function seasonIcons(a=[]){let x={lente:'🌱',zomer:'☀️',herfst:'🍂',winter:'❄️'};return a.map(s=>x[s]||'').join(' ')}
async function load(){if(!await getKey())return;try{cards=await sb('menu_cards?gearchiveerd=eq.false&select=*&order=hoofdcomponent.asc')||[];document.getElementById('status').textContent=cards.length?cards.length+' menu’s in de kaartenbak':'De kaartenbak is nog leeg.';draw()}catch(e){console.error(e);document.getElementById('status').textContent='Kaartenbak kon niet worden geladen.'}}
function toggleSeason(b){let s=b.dataset.s;if(activeSeasons.has(s))activeSeasons.delete(s);else activeSeasons.add(s);b.classList.toggle('on');draw()}
function draw(){let q=document.getElementById('search').value.trim().toLowerCase(),ty=document.getElementById('type').value,lv=document.getElementById('lv').value;let a=cards.filter(c=>{let hay=[c.hoofdcomponent,c.zetmeel,c.groente,c.salade,c.saus,c.stamppot,c.dessert].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!ty||c.menu_type===ty)&&(lv===''||c.lactosevrij===(lv==='1'))&&(!activeSeasons.size||[...activeSeasons].some(s=>(c.seizoenen||[]).includes(s)))});document.getElementById('cards').innerHTML=a.length?a.map(c=>`<article class="menuCard"><div class="cardTop"><div class="title">${esc(title(c))}</div><div>${seasonIcons(c.seizoenen)}</div></div><div class="badges"><span class="badge">${c.menu_type==='veggie'?'VEGGIE':'GEWOON'}</span>${c.lactosevrij?'<span class="badge lv">LV</span>':''}</div><div class="parts">${c.hoofdcomponent?`<div>${esc(c.hoofdcomponent)}</div>`:''}${c.stamppot?`<div>${esc(c.stamppot)}</div>`:c.zetmeel?`<div>${esc(c.zetmeel)}</div>`:''}${c.groente?`<div>${esc(c.groente)}</div>`:''}${c.salade?`<div>${esc(c.salade)}</div>`:''}${c.saus?`<div>${esc(c.saus)}</div>`:''}${c.dessert?`<div class="dessert">🍨 ${esc(c.dessert)}</div>`:''}</div><div class="actions"><button class="secondary" onclick="editCard(${c.id})">Bewerken</button><button class="secondary" onclick="archiveCard(${c.id})">Archief</button></div></article>`).join(''):'<div class="empty">Geen menu’s gevonden.</div>'}
function openForm(c=null){editId=c?.id||null;document.getElementById('formTitle').textContent=c?'Menu bewerken':'Nieuw menu';fType.value=c?.menu_type||'gewoon';fLv.value=c?.lactosevrij?'1':'0';fMain.value=c?.hoofdcomponent||'';fStarch.value=c?.zetmeel||'';fVeg.value=c?.groente||'';fSalad.value=c?.salade||'';fSauce.value=c?.saus||'';fStamp.value=c?.stamppot||'';fDessert.value=c?.dessert||'';document.querySelectorAll('.fSeason').forEach(x=>x.checked=(c?.seizoenen||[]).includes(x.value));modal.classList.add('open')}
function closeForm(){modal.classList.remove('open');editId=null}
function editCard(id){openForm(cards.find(c=>+c.id===+id))}
function norm(v){return v.trim()||null}
async function saveCard(){let p={menu_type:fType.value,lactosevrij:fLv.value==='1',seizoenen:[...document.querySelectorAll('.fSeason:checked')].map(x=>x.value),hoofdcomponent:norm(fMain.value),zetmeel:norm(fStarch.value),groente:norm(fVeg.value),salade:norm(fSalad.value),saus:norm(fSauce.value),stamppot:norm(fStamp.value),dessert:norm(fDessert.value),updated_at:new Date().toISOString()};if(!p.hoofdcomponent&&!p.stamppot)return alert('Vul minimaal een hoofdcomponent of stamppot in.');let sig=x=>[x.menu_type,!!x.lactosevrij,...['hoofdcomponent','zetmeel','groente','salade','saus','stamppot','dessert'].map(k=>(x[k]||'').trim().toLowerCase())].join('|');if(cards.some(c=>+c.id!==+editId&&sig(c)===sig(p)))return alert('Dit menu staat al in de kaartenbak.');try{if(editId)await sb('menu_cards?id=eq.'+editId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});else await sb('menu_cards',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});closeForm();await load()}catch(e){console.error(e);alert('Opslaan mislukt.') }}
async function archiveCard(id){if(!confirm('Dit menu uit de actieve kaartenbak halen? Het wordt niet verwijderd.'))return;try{await sb('menu_cards?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({gearchiveerd:true,updated_at:new Date().toISOString()})});await load()}catch(e){alert('Archiveren mislukt.')}}
load();
</script></body></html>
