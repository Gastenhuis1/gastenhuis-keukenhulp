<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu's · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#edf4e9;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:10px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:120px}main{max-width:1050px;margin:auto;padding:18px 16px}.back{color:var(--green);font-weight:800;text-decoration:none}.top{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-top:12px}.sub,.status{color:var(--muted)}.add{border:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#fff;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(60,70,60,.05)}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:20px;font-weight:800;margin-bottom:10px}.editbtn{border:0;background:var(--sage);color:#506d53;border-radius:9px;padding:6px 9px;font-weight:800;cursor:pointer}.variant{border-top:1px solid #f0ece6;padding:9px 0}.vhead{font-size:13px;font-weight:800}.parts{font-size:14px;line-height:1.45;margin-top:4px}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.sheet{width:min(820px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}.sheethead h2{margin:0}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.variants{display:grid;gap:12px;margin-top:14px}.variantbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.variantbox h3{margin:0 0 8px;font-size:16px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.save{margin-top:14px;border:0;background:var(--green);color:#fff;border-radius:11px;padding:10px 15px;font-weight:800;cursor:pointer}.msg{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar planning</a><div class="top"><div><h1>🍽️ Menu's</h1><div class="sub">Normaal · Lactosevrij · Veggie · Veggie lactosevrij</div></div><button class="add" onclick="newMenu()">＋ Nieuw menu</button></div><input id="search" class="search" placeholder="Zoek op menu, gerecht, groente, saus…"><div id="status" class="status">Laden…</div><div id="grid" class="grid"></div></main><div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="formTitle">Menu</h2><button class="close" onclick="closeForm()">✕</button></div><div class="field"><label>Naam van het menu</label><input id="menuName" placeholder="Bijv. Kip in tomatensaus"></div><div id="variantForms" class="variants"></div><button class="save" onclick="saveMenu()">💾 Opslaan</button><div id="msg" class="msg"></div></div></div><script src="supabase-config.js"></script><script>const cfg=window.GASTENHUIS_SUPABASE;let menus=[],vars=[],editingId=null;const types=['gewoon','lactosevrij','veggie','veggie_lf'];const labels={gewoon:'Normaal',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};const fields=[['hoofdcomponent','Hoofdcomponent'],['zetmeel','Aardappel / rijst / pasta'],['groente','Groente'],['salade','Salade'],['saus','Saus'],['stamppot','Stamppot']];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function req(path,opt={}){const r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}function parts(v){return[v.hoofdcomponent,v.stamppot||v.zetmeel,v.groente,v.salade,v.saus].filter(Boolean)}function draw(){const q=search.value.trim().toLowerCase();const list=menus.filter(m=>[m.name,...vars.filter(v=>v.menu_id===m.id).flatMap(parts)].join(' ').toLowerCase().includes(q));grid.innerHTML=list.length?list.map(m=>{const vs=vars.filter(v=>v.menu_id===m.id);return `<article class="card"><div class="cardtop"><div class="title">${esc(m.name)}</div><button class="editbtn" onclick="editMenu(${m.id})">✏️ Wijzig</button></div>${types.map(t=>{const v=vs.find(x=>x.variant_type===t);return `<div class="variant"><div class="vhead">${labels[t]}</div><div class="parts">${v&&parts(v).length?parts(v).map(esc).join('<br>'):'Nog niet ingevuld'}</div></div>`}).join('')}</article>`}).join(''):'<div class="empty">Geen menu’s gevonden.</div>'}function buildForms(existing={}){variantForms.innerHTML=types.map(t=>{const v=existing[t]||{};return `<section class="variantbox"><h3>${labels[t]}</h3><div class="fields">${fields.map(([k,l])=>`<div class="field"><label>${l}</label><input id="${t}_${k}" value="${esc(v[k]||'')}"></div>`).join('')}</div></section>`}).join('')}function newMenu(){editingId=null;formTitle.textContent='Nieuw menu';menuName.value='';msg.textContent='';buildForms();modal.classList.add('open')}function editMenu(id){editingId=id;const m=menus.find(x=>x.id===id);menuName.value=m?.name||'';formTitle.textContent='Menu wijzigen';msg.textContent='';const ex={};types.forEach(t=>ex[t]=vars.find(v=>v.menu_id===id&&v.variant_type===t)||{});buildForms(ex);modal.classList.add('open')}function closeForm(){modal.classList.remove('open')}async function saveMenu(){const name=menuName.value.trim();if(!name){msg.textContent='Vul eerst een menunaam in.';return}msg.textContent='Opslaan…';try{let id=editingId;if(id){await req(`menu_logical_cards?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name,updated_at:new Date().toISOString()})})}else{const r=await req('menu_logical_cards',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name})});id=r[0].id}for(const t of types){const body={menu_id:id,variant_type:t};fields.forEach(([k])=>body[k]=document.getElementById(`${t}_${k}`).value.trim()||null);const old=vars.find(v=>v.menu_id===id&&v.variant_type===t);if(old)await req(`menu_logical_variants?id=eq.${old.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await req('menu_logical_variants',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}await load();closeForm()}catch(e){console.error(e);msg.textContent='Opslaan is niet gelukt. Controleer of de naam al bestaat.'}}async function load(){menus=await req('menu_logical_cards?gearchiveerd=eq.false&select=id,name&order=name.asc');vars=await req('menu_logical_variants?select=*');status.textContent=menus.length+' menu’s';draw()}search.addEventListener('input',draw);modal.addEventListener('click',e=>{if(e.target===modal)closeForm()});load().catch(e=>{console.error(e);status.textContent='Databaseverbinding mislukt.';grid.innerHTML='<div class="empty">De kaartenbak kon niet worden geladen.</div>'});</script></body></html>
