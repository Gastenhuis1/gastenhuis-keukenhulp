<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu's · Het Gastenhuis</title><style>body{margin:0;font-family:Calibri,Arial,sans-serif;background:#fffaf3;color:#34433b}header{padding:10px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:120px}main{max-width:1050px;margin:auto;padding:18px 16px}.back{color:#6f8f72;font-weight:800;text-decoration:none}.sub,.status{color:#718078}.search{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #e9e2d8;border-radius:15px;background:#fff;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid #e9e2d8;border-radius:18px;padding:16px}.title{font-size:20px;font-weight:800;margin-bottom:10px}.variant{border-top:1px solid #f0ece6;padding:9px 0}.vhead{font-size:13px;font-weight:800}.parts{font-size:14px;line-height:1.45;margin-top:4px}.empty{grid-column:1/-1;text-align:center;padding:40px;color:#718078}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar 4-wekenmenu</a><h1>🍽️ Menu's</h1><div class="sub">Gewoon · Lactosevrij · Veggie · Veggie lactosevrij</div><input id="search" class="search" placeholder="Zoek op menu, gerecht, groente, saus…"><div id="status" class="status">Laden…</div><div id="grid" class="grid"></div></main><script src="supabase-config.js"></script><script>const cfg=window.GASTENHUIS_SUPABASE;let menus=[],vars=[];const labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};const esc=s=>String(s??'');async function get(path){const r=await fetch(cfg.url+'/rest/v1/'+path,{headers:{apikey:cfg.key}});if(!r.ok)throw Error(await r.text());return r.json()}function parts(v){return [v.hoofdcomponent,v.stamppot||v.zetmeel,v.groente,v.salade,v.saus].filter(Boolean)}function draw(){const q=search.value.trim().toLowerCase();const list=menus.filter(m=>[m.name,...vars.filter(v=>v.menu_id===m.id).flatMap(parts)].join(' ').toLowerCase().includes(q));grid.innerHTML=list.length?list.map(m=>{const vs=vars.filter(v=>v.menu_id===m.id);return '<article class="card"><div class="title">'+esc(m.name)+'</div>'+['gewoon','lactosevrij','veggie','veggie_lf'].map(t=>{const v=vs.find(x=>x.variant_type===t);return v?'<div class="variant"><div class="vhead">'+labels[t]+'</div><div class="parts">'+parts(v).map(esc).join('<br>')+'</div></div>':''}).join('')+'</article>'}).join(''):'<div class="empty">Geen menu’s gevonden.</div>'}search.addEventListener('input',draw);(async()=>{try{menus=await get('menu_logical_cards?gearchiveerd=eq.false&select=id,name&order=name.asc');vars=await get('menu_logical_variants?select=menu_id,variant_type,hoofdcomponent,zetmeel,groente,salade,saus,stamppot');status.textContent=menus.length+' menu’s';draw()}catch(e){status.textContent='Databaseverbinding mislukt.';grid.innerHTML='<div class="empty">De kaartenbak kon niet worden geladen.</div>'}})();</script></body></html>
