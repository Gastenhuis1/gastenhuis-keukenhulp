<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f8f72"><title>Menu overzicht · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--card:#fff;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8;--shadow:0 8px 24px rgba(60,70,60,.08)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--sage),#f8e8d6);padding:10px 16px;text-align:center}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 145px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}.progress{margin:22px 0;background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.progressTop{display:flex;justify-content:space-between;gap:10px;font-weight:700}.bar{height:9px;background:#edf0eb;border-radius:99px;margin-top:11px;overflow:hidden}.fill{height:100%;background:var(--green);width:0}.weeks{display:grid;gap:13px}.week{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.weekhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.weekhead strong{font-size:19px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:92px;border:1px solid var(--line);border-radius:13px;padding:9px;background:#fff;cursor:pointer}.day:hover{border-color:#b8cbb5}.day.empty{border-style:dashed;background:#fcfbf8}.dow{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.date{font-size:12px;color:var(--muted);margin:2px 0 8px}.meal{font-size:14px;font-weight:700;line-height:1.25}.empty .meal{color:#9a9f9b;font-weight:600}.cardDock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:50;width:min(1020px,calc(100% - 24px));padding:10px;background:rgba(255,250,243,.97);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(60,70,60,.18)}.navtitle{margin:0 0 9px;font-size:16px;padding-left:4px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:800;font-size:16px}.choice span{font-size:23px}.choice small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}.back{display:inline-block;color:var(--green);text-decoration:none;font-weight:700;margin-bottom:14px}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:100;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px;padding:16px}.sheetTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheetTop h2{margin:0;font-size:21px}button,input{font:inherit}.close{border:1px solid var(--line);background:white;border-radius:11px;padding:7px 10px}.search{width:100%;margin:14px 0 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.pick{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;padding:12px;margin:7px 0;color:var(--ink);font-weight:800}.pick small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.clear{width:100%;border:1px dashed #d7cec2;background:#fffaf6;border-radius:12px;padding:10px;margin-top:10px;color:var(--muted)}@media(max-width:720px){main{padding-bottom:95px}.days{grid-template-columns:repeat(2,1fr)}.cardDock{bottom:6px;padding:7px;width:calc(100% - 12px)}.navtitle{display:none}.choices{grid-template-columns:repeat(3,1fr);gap:6px}.choice{display:block;text-align:center;padding:9px 4px;font-size:12px}.choice span{display:block;font-size:21px;margin-bottom:2px}.choice small{display:none}}@media(max-width:420px){.days{grid-template-columns:1fr 1fr}.day{min-height:82px}}</style></head><body><header><img src="gastenhuis-logo.png" alt="Het Gastenhuis"></header><main><a class="back" href="start.html">← Terug naar keukenhulp</a><div class="top"><h1>Mijn 4-wekenmenu</h1><div class="sub">Klik op een dag om een menu te kiezen.</div></div><section class="progress"><div class="progressTop"><span id="progressText">0 van 28 dagen ingevuld</span><span id="openText">28 nog open</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><div id="weeks" class="weeks"></div><div class="cardDock"><h2 class="navtitle">Kaartenbakken</h2><div class="choices"><a class="choice" href="kaartenbak.html"><span>🍽️</span><div>Menu's<small>Gewoon, veggie en veggie LF</small></div></a><a class="choice" href="desserts.html"><span>🍨</span><div>Desserts<small>Los van het diner kiezen</small></div></a><a class="choice" href="bakken-snacks.html"><span>🍰</span><div>Bakken & snacks<small>Taart, cake, koekjes en meer</small></div></a></div></div></main><div id="modal" class="modal"><div class="sheet"><div class="sheetTop"><h2 id="pickTitle">Menu kiezen</h2><button class="close" onclick="closePick()">✕</button></div><input id="menuSearch" class="search" placeholder="Zoek menu…" oninput="drawChoices()"><div id="menuChoices"></div><button class="clear" onclick="clearDay()">Dag leegmaken</button></div></div><script>const U='https://cttotbzkcluauzzgnybh.supabase.co';let K='',plans=[],menus=[],chosenDate='';const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d};let start=monday(new Date());function iso(d){return d.toISOString().slice(0,10)}function fmt(d){return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}async function key(){let t=await fetch('index.html').then(r=>r.text());let m=t.match(/const\s+SUPABASE_(?:ANON_)?KEY\s*=\s*['\"]([^'\"]+)/i)||t.match(/const\s+SB_KEY\s*=\s*['\"]([^'\"]+)/i);K=m?.[1]||''}async function req(path,opt={}){let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());let x=await r.text();return x?JSON.parse(x):null}async function load(){await key();try{menus=await req('menu_logical_cards?gearchiveerd=eq.false&select=id,name&order=name.asc')||[];plans=await req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&select=*`)||[]}catch(e){console.error(e)}draw()}function draw(){let by={};plans.forEach(p=>by[p.plan_date]=p);let names=['ma','di','wo','do','vr','za','zo'],html='',filled=0;for(let w=0;w<4;w++){let count=0,cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),p=by[ds],m=menus.find(x=>x.id===p?.menu_card_id),has=!!m;if(has){filled++;count++}cards+=`<div class="day ${has?'':'empty'}" onclick="openPick('${ds}')"><div class="dow">${names[i]}</div><div class="date">${fmt(d)}</div><div class="meal">${has?'✓ '+m.name:'+ Nog kiezen'}</div></div>`}html+=`<section class="week"><div class="weekhead"><strong>Week ${w+1}</strong><span>${count}/7 ingevuld</span></div><div class="days">${cards}</div></section>`}weeks.innerHTML=html;progressText.textContent=`${filled} van 28 dagen ingevuld`;openText.textContent=`${28-filled} nog open`;fill.style.width=(filled/28*100)+'%'}function openPick(ds){chosenDate=ds;pickTitle.textContent='Menu kiezen · '+new Date(ds+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});menuSearch.value='';drawChoices();modal.classList.add('open')}function closePick(){modal.classList.remove('open')}function drawChoices(){let q=menuSearch.value.toLowerCase().trim(),a=menus.filter(m=>m.name.toLowerCase().includes(q));menuChoices.innerHTML=a.length?a.map(m=>`<button class="pick" onclick="chooseMenu(${m.id})">${m.name}<small>Kies dit menu voor deze dag</small></button>`).join(''):'<div style="padding:20px;text-align:center;color:#718078">Geen menu gevonden.</div>'}async function chooseMenu(id){let p={house:0,start_date:iso(start),plan_date:chosenDate,menu_card_id:id,updated_at:new Date().toISOString()};await req('menu_plans?on_conflict=house,start_date,plan_date',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(p)});closePick();await load()}async function clearDay(){await req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&plan_date=eq.${chosenDate}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});closePick();await load()}load();</script></body></html>
