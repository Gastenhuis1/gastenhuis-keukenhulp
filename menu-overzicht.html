<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f8f72"><title>Menu overzicht · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8;--shadow:0 8px 24px rgba(60,70,60,.08)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--sage),#f8e8d6);padding:10px 16px;text-align:center}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 145px}.back{display:inline-block;color:var(--green);text-decoration:none;font-weight:700;margin-bottom:14px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}.progress{margin:22px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.progressTop{display:flex;justify-content:space-between;gap:10px;font-weight:700}.bar{height:9px;background:#edf0eb;border-radius:99px;margin-top:11px;overflow:hidden}.fill{height:100%;background:var(--green);width:0}.weeks{display:grid;gap:12px}.week{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.weekhead{display:flex;justify-content:space-between;align-items:center;padding:16px;cursor:pointer}.weekhead:hover{background:#fcfbf8}.weekleft{display:flex;align-items:center;gap:10px}.chev{font-size:15px;color:var(--muted);width:14px}.weekhead strong{font-size:19px}.weekcount{color:var(--muted);font-weight:700}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 15px 15px}.week.closed .days{display:none}.day{min-height:104px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;cursor:pointer}.day:hover{border-color:#b8cbb5}.day.empty{border-style:dashed;background:#fcfbf8}.day.filled{background:#f2f7ef;border-color:#b9ceb5}.dow{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.date{font-size:12px;color:var(--muted);margin:2px 0 8px}.chosen{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--green);font-weight:800;margin-bottom:4px}.meal{font-size:15px;font-weight:800;line-height:1.25}.summary{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.3}.empty .meal{color:#9a9f9b;font-weight:600}.cardDock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:50;width:min(1020px,calc(100% - 24px));padding:10px;background:rgba(255,250,243,.97);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(60,70,60,.18)}.navtitle{margin:0 0 9px;font-size:16px;padding-left:4px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:800;font-size:16px}.choice span{font-size:23px}.choice small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:100;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(660px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px;padding:17px}.sheetTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheetTop h2{margin:0;font-size:21px}button,input{font:inherit}.close{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 10px}.search{width:100%;margin:14px 0 10px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.pick{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0;color:var(--ink);cursor:pointer}.pickname{font-size:17px;font-weight:800}.pickparts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.pill{background:#f3f5ef;border-radius:99px;padding:4px 8px;font-size:12px;color:#59675f}.detail{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-top:14px}.detail h3{margin:0 0 10px;font-size:23px}.variant{border-top:1px solid #f0ece6;padding:10px 0}.variant:first-of-type{border-top:0}.vhead{font-size:13px;font-weight:800;color:var(--green);margin-bottom:4px}.parts{font-size:14px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.change{border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px;font-weight:800}.clear{border:1px dashed #d7cec2;background:#fffaf6;border-radius:12px;padding:10px;color:var(--muted)}.hidden{display:none}@media(max-width:720px){main{padding-bottom:95px}.days{grid-template-columns:repeat(2,1fr)}.cardDock{bottom:6px;padding:7px;width:calc(100% - 12px)}.navtitle{display:none}.choices{grid-template-columns:repeat(3,1fr);gap:6px}.choice{display:block;text-align:center;padding:9px 4px;font-size:12px}.choice span{display:block;font-size:21px;margin-bottom:2px}.choice small{display:none}}@media(max-width:420px){.days{grid-template-columns:1fr 1fr}.day{min-height:92px}.actions{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png" alt="Het Gastenhuis"></header><main><a class="back" href="start.html">← Terug naar keukenhulp</a><div class="top"><h1>Mijn 4-wekenmenu</h1><div class="sub">Kies een week, daarna een dag. Zoek bijvoorbeeld op tomaat om passende menu's te vinden.</div></div><section class="progress"><div class="progressTop"><span id="progressText">0 van 28 dagen ingevuld</span><span id="openText">28 nog open</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><div id="weeks" class="weeks"></div><div class="cardDock"><h2 class="navtitle">Kaartenbakken</h2><div class="choices"><a class="choice" href="kaartenbak.html"><span>🍽️</span><div>Menu's<small>Alle menuvarianten</small></div></a><a class="choice" href="desserts.html"><span>🍨</span><div>Desserts<small>Los van het diner</small></div></a><a class="choice" href="bakken-snacks.html"><span>🍰</span><div>Bakken & snacks<small>Taart, cake en meer</small></div></a></div></div></main><div id="modal" class="modal"><div class="sheet"><div class="sheetTop"><h2 id="pickTitle">Menu</h2><button class="close" onclick="closePick()">✕</button></div><div id="detailView" class="hidden"><div id="chosenDetail" class="detail"></div><div class="actions"><button class="change" onclick="showChooser()">Ander menu kiezen</button><button class="clear" onclick="clearDay()">Dag leegmaken</button></div></div><div id="chooserView"><input id="menuSearch" class="search" placeholder="Zoek bijvoorbeeld tomaat, broccoli, rijst…" oninput="drawChoices()"><div id="menuChoices"></div></div></div></div><script src="supabase-config.js"></script><script>const cfg=window.GASTENHUIS_SUPABASE;let plans=[],menus=[],variants=[],chosenDate='',openWeek=0;const labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d};let start=monday(new Date());function iso(d){return d.toISOString().slice(0,10)}function fmt(d){return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}async function req(path,opt={}){let r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());let x=await r.text();return x?JSON.parse(x):null}async function load(){try{menus=await req('menu_logical_cards?gearchiveerd=eq.false&select=id,name&order=name.asc')||[];variants=await req('menu_logical_variants?select=menu_id,variant_type,hoofdcomponent,zetmeel,groente,salade,saus,stamppot')||[];plans=await req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&select=*`)||[]}catch(e){console.error(e)}draw()}function parts(v){return v?[v.hoofdcomponent,v.stamppot||v.zetmeel,v.groente,v.salade,v.saus].filter(Boolean):[]}function ordinary(m){return variants.find(v=>v.menu_id===m.id&&v.variant_type==='gewoon')}function draw(){let by={};plans.forEach(p=>by[p.plan_date]=p);let names=['ma','di','wo','do','vr','za','zo'],html='',filled=0;for(let w=0;w<4;w++){let count=0,cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),p=by[ds],m=menus.find(x=>x.id===p?.logical_menu_id),has=!!m,v=has?ordinary(m):null;if(has){filled++;count++}let sum=has?parts(v).slice(1,4).join(' · '):'';cards+=`<div class="day ${has?'filled':'empty'}" onclick="openDay('${ds}',${w})"><div class="dow">${names[i]}</div><div class="date">${fmt(d)}</div>${has?`<div class="chosen">gekozen</div><div class="meal">${m.name}</div>${sum?`<div class="summary">${sum}</div>`:''}`:'<div class="meal">+ Kies menu</div>'}</div>`}html+=`<section class="week ${w===openWeek?'':'closed'}"><div class="weekhead" onclick="toggleWeek(${w})"><div class="weekleft"><span class="chev">${w===openWeek?'▾':'▸'}</span><strong>Week ${w+1}</strong></div><span class="weekcount">${count}/7 ingevuld</span></div><div class="days">${cards}</div></section>`}weeks.innerHTML=html;progressText.textContent=`${filled} van 28 dagen ingevuld`;openText.textContent=`${28-filled} nog open`;fill.style.width=(filled/28*100)+'%'}function toggleWeek(w){openWeek=w===openWeek?-1:w;draw()}function planFor(ds){return plans.find(p=>p.plan_date===ds)}function menuForDay(ds){let p=planFor(ds);return menus.find(m=>m.id===p?.logical_menu_id)}function dateTitle(ds){return new Date(ds+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}function openDay(ds,w){chosenDate=ds;openWeek=w;let m=menuForDay(ds);pickTitle.textContent=dateTitle(ds);if(m)showDetail(m);else showChooser();modal.classList.add('open')}function closePick(){modal.classList.remove('open')}function showDetail(m){chooserView.classList.add('hidden');detailView.classList.remove('hidden');let vs=variants.filter(v=>v.menu_id===m.id);chosenDetail.innerHTML=`<h3>${m.name}</h3>`+['gewoon','lactosevrij','veggie','veggie_lf'].map(t=>{let v=vs.find(x=>x.variant_type===t);return v?`<div class="variant"><div class="vhead">${labels[t]}</div><div class="parts">${parts(v).join('<br>')}</div></div>`:''}).join('')}function showChooser(){detailView.classList.add('hidden');chooserView.classList.remove('hidden');pickTitle.textContent='Menu kiezen · '+dateTitle(chosenDate);menuSearch.value='';drawChoices();setTimeout(()=>menuSearch.focus(),80)}function searchable(m){let v=variants.filter(x=>x.menu_id===m.id);return [m.name,...v.flatMap(x=>[x.hoofdcomponent,x.zetmeel,x.groente,x.salade,x.saus,x.stamppot])].filter(Boolean).join(' ').toLowerCase()}function drawChoices(){let q=menuSearch.value.toLowerCase().trim(),a=menus.filter(m=>searchable(m).includes(q));menuChoices.innerHTML=a.length?a.map(m=>{let v=ordinary(m),ps=parts(v);return `<button class="pick" onclick="chooseMenu(${m.id})"><div class="pickname">${m.name}</div>${ps.length?`<div class="pickparts">${ps.map(x=>`<span class="pill">${x}</span>`).join('')}</div>`:''}</button>`}).join(''):'<div style="padding:20px;text-align:center;color:#718078">Geen menu gevonden.</div>'}async function chooseMenu(id){let p={house:0,start_date:iso(start),plan_date:chosenDate,logical_menu_id:id,updated_at:new Date().toISOString()};await req('menu_plans?on_conflict=house,start_date,plan_date',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(p)});closePick();await load()}async function clearDay(){await req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&plan_date=eq.${chosenDate}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});closePick();await load()}load();</script></body></html>
