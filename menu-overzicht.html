<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn planning · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#edf4e9;--peach:#fff0e2;--line:#e9e2d8}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{text-align:center;padding:12px;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 50px}.back,.edit{color:var(--green);text-decoration:none;font-weight:800;font-size:13px}h1{margin:16px 0 3px}.sub{color:var(--muted);margin-bottom:20px}.weeks{display:grid;gap:22px}.weektitle{display:flex;gap:10px;align-items:center;margin:0 0 10px 3px}.weektitle h2{font-size:17px;margin:0}.weektitle span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.day{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 7px 22px #464b4112}.day.complete{border-color:#cbdcc7}.day.open{grid-column:1/-1}.dayhead{width:100%;border:0;background:#fff;padding:15px 17px;display:flex;align-items:center;gap:13px;text-align:left;color:var(--ink);cursor:pointer}.complete .dayhead{background:linear-gradient(90deg,#fbfdf9,#f4f9f1)}.calendar{width:47px;height:47px;flex:0 0 47px;border-radius:14px;background:var(--peach);display:flex;flex-direction:column;align-items:center;justify-content:center}.complete .calendar{background:var(--sage)}.calendar b{font-size:18px}.calendar small,.dayname,.label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:900}.daymain{min-width:0;flex:1}.preview{font-size:15px;font-weight:800}.missing,.none{font-size:12px;color:#a18e7c}.headcounts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.hc{display:inline-flex;align-items:baseline;gap:3px;border-radius:9px;background:#f7f5ef;padding:4px 7px;font-size:10px;color:var(--muted);white-space:nowrap}.hc b{font-size:14px;color:var(--ink)}.hc.total{background:var(--sage);color:#56705a}.hc.total b{color:#425d46}.status{margin-left:auto}.check{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--green);color:white;align-items:center;justify-content:center;font-weight:900}.body{display:none;border-top:1px solid #f0ece6;padding:16px}.open .body{display:block}.countbar{background:#f7f5ef;border-radius:14px;padding:11px 12px;margin-bottom:12px}.countline,.pills{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.countline{justify-content:space-between}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}.quick{border:0;background:none;color:var(--green);font-weight:800;cursor:pointer}.countedit{display:none;margin-top:10px;border-top:1px solid #e8e2d9;padding-top:10px}.countedit.open{display:block}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:3px}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;font:inherit}.save{margin-top:8px;border:0;border-radius:10px;background:var(--green);color:white;padding:8px 13px;font-weight:800;cursor:pointer}.warn{font-size:12px;color:#a25d4d;margin-top:6px}.content{display:grid;grid-template-columns:1.3fr .7fr;gap:11px}.item{border:1px solid #eee9e1;border-radius:16px;padding:15px}.menu{background:#f7faf5}.dessert{background:#fff8f1}.baking{grid-column:1/-1;background:#faf8f3}.name{font-size:19px;font-weight:800;margin:4px 0 10px}.tabs,.extras{display:flex;flex-wrap:wrap;gap:6px}.tab{border:1px solid #dce5d8;background:#fff;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.tab.active{background:var(--green);color:#fff}.variantbox{margin-top:10px;background:#fff;border-radius:12px;padding:11px;font-size:13px}.edit{display:inline-block;margin-top:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.day.open{grid-column:auto}.content{grid-template-columns:1fr}.baking{grid-column:auto}.fields{grid-template-columns:repeat(2,1fr)}.dayhead{align-items:flex-start}.status{padding-top:8px}.hc{padding:3px 6px}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="start.html">← Keukenhulp</a><h1>🗂️ Mijn planning</h1><div class="sub">Aantallen zie je direct. Klik op een dag voor menu, dessert en details.</div><div id="weeks" class="weeks"></div></main><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let menus=[],mv=[],desserts=[],bakes=[],plans=[],bp=[],opened='',active={},editCount='';const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d},start=monday(new Date()),iso=d=>d.toISOString().slice(0,10);async function req(p,opt={}){let r=await fetch(c.url+'/rest/v1/'+p,{...opt,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}async function load(){[menus,mv,desserts,bakes,plans,bp]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name'),req('baking_logical_cards?gearchiveerd=eq.false&select=id,name'),req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&select=*`),req(`daily_baking_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(new Date(start.getTime()+28*86400000))}&select=*`)]);draw()}function p(ds){return plans.find(x=>x.plan_date===ds)||{}}function m(ds){let x=p(ds);return menus.find(y=>y.id===x.logical_menu_id)}function de(ds){let x=p(ds);return desserts.find(y=>y.id===x.logical_dessert_id)}function bs(ds){return bp.filter(x=>x.plan_date===ds).map(x=>bakes.find(y=>y.id===x.baking_id)).filter(Boolean)}function parts(v){return[v?.hoofdcomponent,v?.stamppot||v?.zetmeel,v?.groente,v?.salade,v?.saus].filter(Boolean)}function nums(pp){let total=+pp.diners_total||0,veg=+pp.diners_veggie||0,lf=+pp.diners_lactosevrij||0,vlf=+pp.diners_veggie_lf||0;return{total,veg,lf,vlf,normal:Math.max(0,total-veg-lf-vlf)}}function headCounts(pp){let n=nums(pp);if(!n.total)return'';return `<div class="headcounts"><span class="hc total">👥 <b>${n.total}</b> eters</span><span class="hc"><b>${n.normal}</b> gewoon</span>${n.veg?`<span class="hc">🌱 <b>${n.veg}</b> veggie</span>`:''}${n.lf?`<span class="hc"><b>${n.lf}</b> LF</span>`:''}${n.vlf?`<span class="hc">🌱+LF <b>${n.vlf}</b></span>`:''}</div>`}function variant(ds,vs){let t=active[ds]||'gewoon',v=vs.find(x=>x.variant_type===t),labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};return `<div class="tabs">${Object.keys(labels).map(k=>`<button class="tab ${k===t?'active':''}" onclick="event.stopPropagation();setVariant('${ds}','${k}')">${labels[k]}</button>`).join('')}</div><div class="variantbox">${v?parts(v).join(' · '):'Nog niet ingevuld'}</div>`}function countBox(ds,pp){let n=nums(pp);return `<div class="countbar"><div class="countline"><strong>👥 ${n.total||'–'} eters</strong><button class="quick" onclick="editCounts('${ds}')">✏️ Wijzig aantallen</button></div><div class="pills"><span class="pill">Gewoon ${n.normal}</span>${n.veg?`<span class="pill">Veggie ${n.veg}</span>`:''}${n.lf?`<span class="pill">Lactosevrij ${n.lf}</span>`:''}${n.vlf?`<span class="pill">Veggie + LF ${n.vlf}</span>`:''}</div><div class="countedit ${editCount===ds?'open':''}"><div class="fields"><div class="field"><label>Aantal eters</label><input id="t-${ds}" type="number" min="0" value="${n.total}"></div><div class="field"><label>Veggie</label><input id="v-${ds}" type="number" min="0" value="${n.veg}"></div><div class="field"><label>Lactosevrij</label><input id="l-${ds}" type="number" min="0" value="${n.lf}"></div><div class="field"><label>Veggie + LF</label><input id="vl-${ds}" type="number" min="0" value="${n.vlf}"></div></div><div id="w-${ds}" class="warn"></div><button class="save" onclick="saveCounts('${ds}')">Opslaan</button></div></div>`}function draw(){let h='',days=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];for(let w=0;w<4;w++){let cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),pp=p(ds),mm=m(ds),dd=de(ds),bb=bs(ds),complete=!!mm&&!!dd,open=opened===ds,miss=!mm&&!dd?'Menu en dessert nog kiezen':!mm?'Menu nog kiezen':!dd?'Dessert nog kiezen':'',vs=mm?mv.filter(v=>v.menu_id===mm.id):[];cards+=`<article class="day ${complete?'complete':''} ${open?'open':''}"><button class="dayhead" onclick="toggle('${ds}')"><span class="calendar"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nl-NL',{month:'short'}).replace('.','')}</small></span><span class="daymain"><span class="dayname">${days[i]}</span><div class="preview">${mm?mm.name:'Nog geen menu'}</div>${miss?`<div class="missing">${miss}</div>`:''}${headCounts(pp)}</span><span class="status">${complete?'<span class="check">✓</span>':''} ${open?'▴':'▾'}</span></button><div class="body">${countBox(ds,pp)}<div class="content"><div class="item menu"><div class="label">🍽️ Menu</div>${mm?`<div class="name">${mm.name}</div>${variant(ds,vs)}`:'<div class="none">Nog niet gepland</div>'}</div><div class="item dessert"><div class="label">🍨 Dessert</div>${dd?`<div class="name">${dd.name}</div>`:'<div class="none">Nog niet gepland</div>'}</div>${bb.length?`<div class="item baking"><div class="label">🍰 Bakken & snacks</div><div class="extras">${bb.map(x=>`<span class="pill">${x.name}</span>`).join('')}</div></div>`:''}</div><a class="edit" href="plannen.html">Planning wijzigen →</a></div></article>`}let a=new Date(start);a.setDate(start.getDate()+w*7);let z=new Date(a);z.setDate(a.getDate()+6);h+=`<section><div class="weektitle"><h2>Week ${w+1}</h2><span>${a.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} – ${z.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</span></div><div class="cards">${cards}</div></section>`}weeks.innerHTML=h}function toggle(ds){opened=opened===ds?'':ds;editCount='';draw()}function setVariant(ds,t){active[ds]=t;draw()}function editCounts(ds){editCount=editCount===ds?'':ds;draw()}async function saveCounts(ds){let total=+document.getElementById('t-'+ds).value||0,veg=+document.getElementById('v-'+ds).value||0,lf=+document.getElementById('l-'+ds).value||0,vlf=+document.getElementById('vl-'+ds).value||0;if(veg+lf+vlf>total){document.getElementById('w-'+ds).textContent='De afwijkende aantallen kunnen samen niet hoger zijn dan het totaal.';return}let pp=p(ds),body={diners_total:total,diners_veggie:veg,diners_lactosevrij:lf,diners_veggie_lf:vlf,updated_at:new Date().toISOString()};try{if(pp.id)await req(`menu_plans?id=eq.${pp.id}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});else await req('menu_plans',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({...body,house:0,start_date:iso(start),plan_date:ds})});editCount='';await load()}catch(e){console.error(e);alert('Aantallen konden niet worden opgeslagen.')}}load().catch(e=>{console.error(e);weeks.innerHTML='<div>Planning kon niet worden geladen.</div>'});</script></body></html>
