<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Totaaloverzicht · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--line:#e9e2d8;--shadow:0 8px 24px rgba(60,70,60,.07)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 45px}.back{color:var(--green);text-decoration:none;font-weight:700}h1{margin:16px 0 3px;font-size:29px}.sub{color:var(--muted)}.progress{margin:20px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 17px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:15px}.progress strong{font-size:16px}.progress span{color:var(--muted);font-size:13px}.planlink{background:var(--green);color:#fff;text-decoration:none;border-radius:11px;padding:9px 13px;font-weight:800;white-space:nowrap}.weeks{display:grid;gap:12px}.week{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden}.weekhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer}.weektitle{display:flex;align-items:center;gap:10px}.weektitle strong{font-size:19px}.arrow{color:var(--muted)}.weekcount{font-size:13px;color:var(--muted);font-weight:700}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;padding:0 15px 15px}.week.closed .days{display:none}.day{min-height:130px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;text-align:left;color:var(--ink);cursor:pointer}.day.has{background:#f7faf5;border-color:#cbd9c7}.day:hover{border-color:#aebfac}.dow{font-size:11px;font-weight:900;color:var(--green);letter-spacing:.05em}.date{font-size:12px;color:var(--muted);margin:2px 0 9px}.line{font-size:12px;line-height:1.35;margin-top:5px}.line b{font-weight:800}.empty{font-size:12px;color:#aaa;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#26302966;z-index:100;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:23px;padding:18px}.sheettop{display:flex;justify-content:space-between;align-items:center}.sheettop h2{margin:0;font-size:23px}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px}.detailcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.detailcard h3{margin:0 0 9px;font-size:18px}.name{font-size:18px;font-weight:800}.variant{border-top:1px solid #f0ece6;padding:9px 0}.variant:first-of-type{margin-top:8px}.vlabel{font-size:11px;text-transform:uppercase;font-weight:900;color:var(--green);margin-bottom:3px}.parts{font-size:13px;line-height:1.45;color:#526159}.extras{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#f2f5ee;border-radius:99px;padding:6px 9px;font-size:12px}.edit{display:block;margin-top:15px;text-align:center;background:var(--green);color:#fff;text-decoration:none;border-radius:12px;padding:11px;font-weight:800}@media(max-width:760px){.days{grid-template-columns:repeat(2,1fr)}.day{min-height:105px}}@media(max-width:420px){.progress{align-items:flex-start;flex-direction:column}.days{grid-template-columns:1fr}.day{min-height:auto}}</style></head><body><header><img src="gastenhuis-logo.png" alt="Het Gastenhuis"></header><main><a class="back" href="start.html">← Keukenhulp</a><h1>📋 Totaaloverzicht</h1><div class="sub">Alles wat je voor de komende vier weken hebt gepland.</div><div class="progress"><div><strong id="progress">Planning laden…</strong><br><span>Menu, dessert en extra bakmomenten samen op één plek.</span></div><a class="planlink" href="plannen.html">Planning aanpassen</a></div><div id="weeks" class="weeks"></div></main><div id="modal" class="modal"><div class="sheet"><div class="sheettop"><h2 id="title"></h2><button class="close" onclick="modal.classList.remove('open')">✕</button></div><div id="details"></div><a class="edit" href="plannen.html">Deze planning aanpassen</a></div></div><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let menus=[],mv=[],desserts=[],dv=[],bakes=[],plans=[],bp=[],openWeek=0;const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d},start=monday(new Date()),iso=d=>d.toISOString().slice(0,10);async function req(p){let r=await fetch(c.url+'/rest/v1/'+p,{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){[menus,mv,desserts,dv,bakes,plans,bp]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name'),req('dessert_logical_variants?select=*'),req('baking_logical_cards?gearchiveerd=eq.false&select=id,name,category'),req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&select=*`),req(`daily_baking_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(new Date(start.getTime()+28*86400000))}&select=*`)]);draw()}function pd(ds){return plans.find(x=>x.plan_date===ds)}function bs(ds){return bp.filter(x=>x.plan_date===ds).map(x=>bakes.find(b=>b.id===x.baking_id)).filter(Boolean)}function menu(ds){let p=pd(ds);return menus.find(x=>x.id===p?.logical_menu_id)}function dessert(ds){let p=pd(ds);return desserts.find(x=>x.id===p?.logical_dessert_id)}function draw(){let names=['MA','DI','WO','DO','VR','ZA','ZO'],html='',filled=0;for(let w=0;w<4;w++){let cards='',cnt=0;for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),m=menu(ds),de=dessert(ds),b=bs(ds),has=m||de||b.length;if(has){filled++;cnt++}cards+=`<button class="day ${has?'has':''}" onclick="openDay('${ds}',${w})"><div class="dow">${names[i]}</div><div class="date">${d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</div>${m?`<div class="line">🍽️ <b>${m.name}</b></div>`:''}${de?`<div class="line">🍨 ${de.name}</div>`:''}${b.length?`<div class="line">🍰 ${b.map(x=>x.name).join(' · ')}</div>`:''}${!has?'<div class="empty">Nog niets gepland</div>':''}</button>`}html+=`<section class="week ${w===openWeek?'':'closed'}"><div class="weekhead" onclick="toggle(${w})"><div class="weektitle"><span class="arrow">${w===openWeek?'▾':'▸'}</span><strong>Week ${w+1}</strong></div><span class="weekcount">${cnt}/7 dagen gepland</span></div><div class="days">${cards}</div></section>`}weeks.innerHTML=html;progress.textContent=`${filled} van 28 dagen hebben een planning`}function toggle(w){openWeek=openWeek===w?-1:w;draw()}function parts(v){return [v?.hoofdcomponent,v?.stamppot||v?.zetmeel,v?.groente,v?.salade,v?.saus].filter(Boolean)}function openDay(ds,w){openWeek=w;let d=new Date(ds+'T12:00'),m=menu(ds),de=dessert(ds),b=bs(ds);title.textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});let h='';if(m){let vs=mv.filter(v=>v.menu_id===m.id),labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};h+=`<div class="detailcard"><h3>🍽️ Menu</h3><div class="name">${m.name}</div>`+['gewoon','lactosevrij','veggie','veggie_lf'].map(t=>{let v=vs.find(x=>x.variant_type===t);return v?`<div class="variant"><div class="vlabel">${labels[t]}</div><div class="parts">${parts(v).join(' · ')}</div></div>`:''}).join('')+'</div>'}if(de){let vs=dv.filter(v=>v.dessert_id===de.id);h+=`<div class="detailcard"><h3>🍨 Dessert</h3><div class="name">${de.name}</div>${vs.map(v=>`<div class="variant"><div class="vlabel">${v.variant_type||''}</div><div class="parts">${v.uitvoering||''}</div></div>`).join('')}</div>`}if(b.length)h+=`<div class="detailcard"><h3>🍰 Bakken & snacks</h3><div class="extras">${b.map(x=>`<span class="tag">${x.name}</span>`).join('')}</div></div>`;if(!h)h='<div class="detailcard"><div class="empty">Voor deze dag is nog niets gepland.</div></div>';details.innerHTML=h;modal.classList.add('open')}load().catch(e=>{console.error(e);progress.textContent='Planning kon niet worden geladen.'});</script></body></html>
