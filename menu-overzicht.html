<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Totaaloverzicht · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#edf4e9;--peach:#fff0e2;--line:#e9e2d8;--shadow:0 7px 22px rgba(70,75,65,.07)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 50px}.back{color:var(--green);text-decoration:none;font-weight:700;font-size:13px}h1{margin:16px 0 3px;font-size:29px}.sub{color:var(--muted);margin-bottom:23px}.weeks{display:grid;gap:22px}.weektitle{display:flex;align-items:center;gap:10px;margin:0 0 10px 3px}.weektitle h2{font-size:17px;margin:0}.weektitle span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.day{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden;transition:.18s}.day.complete{border-color:#cbdcc7}.day.open{grid-column:1/-1}.dayhead{width:100%;border:0;background:#fff;color:var(--ink);padding:15px 17px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer}.complete .dayhead{background:linear-gradient(90deg,#fbfdf9,#f4f9f1)}.calendar{width:47px;height:47px;flex:0 0 47px;border-radius:14px;background:var(--peach);display:flex;flex-direction:column;align-items:center;justify-content:center}.complete .calendar{background:var(--sage)}.calendar b{font-size:18px;line-height:18px}.calendar small{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}.dayname{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:900}.preview{font-size:15px;font-weight:800;margin-top:2px}.missing{font-size:12px;color:#a18e7c;margin-top:3px}.status{margin-left:auto;display:flex;align-items:center;gap:9px}.check{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}.chev{font-size:15px;color:#98a098}.body{display:none;border-top:1px solid #f0ece6;padding:15px 17px 17px;background:#fff}.open .body{display:block}.inside{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-radius:15px;padding:13px;background:#fcfbf8;border:1px solid #f0ebe4}.item.menu{background:#f6faf3}.item.dessert{background:#fff8f1}.item.baking{grid-column:1/-1;background:#faf8f3}.label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900;margin-bottom:5px}.name{font-size:17px;font-weight:800}.none{font-size:13px;color:#a49f98}.extras{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.tag{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}.variants{margin-top:10px;border-top:1px solid #e7eee4;padding-top:7px}.variant{font-size:12px;line-height:1.4;margin-top:5px}.variant b{color:var(--green);margin-right:5px}.edit{display:inline-block;margin-top:12px;color:var(--green);font-size:12px;font-weight:800;text-decoration:none}.legend{display:flex;align-items:center;gap:7px;margin:-12px 0 20px;font-size:12px;color:var(--muted)}.legend .check{width:20px;height:20px;font-size:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.day.open{grid-column:auto}.inside{grid-template-columns:1fr}.item.baking{grid-column:auto}.dayhead{padding:13px}.calendar{width:44px;height:44px;flex-basis:44px}}</style></head><body><header><img src="gastenhuis-logo.png" alt="Het Gastenhuis"></header><main><a class="back" href="start.html">← Keukenhulp</a><h1>🗂️ Mijn planning</h1><div class="sub">Vier weken als kaartenbak. Klik op een dag om te zien wat erachter zit.</div><div class="legend"><span class="check">✓</span> Menu én dessert zijn gepland</div><div id="weeks" class="weeks"></div></main><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let menus=[],mv=[],desserts=[],bakes=[],plans=[],bp=[],opened='';const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d},start=monday(new Date()),iso=d=>d.toISOString().slice(0,10);async function req(p){let r=await fetch(c.url+'/rest/v1/'+p,{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){[menus,mv,desserts,bakes,plans,bp]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name'),req('baking_logical_cards?gearchiveerd=eq.false&select=id,name'),req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&select=*`),req(`daily_baking_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(new Date(start.getTime()+28*86400000))}&select=*`)]);draw()}function p(ds){return plans.find(x=>x.plan_date===ds)}function m(ds){let x=p(ds);return menus.find(y=>y.id===x?.logical_menu_id)}function de(ds){let x=p(ds);return desserts.find(y=>y.id===x?.logical_dessert_id)}function bs(ds){return bp.filter(x=>x.plan_date===ds).map(x=>bakes.find(y=>y.id===x.baking_id)).filter(Boolean)}function parts(v){return [v?.hoofdcomponent,v?.stamppot||v?.zetmeel,v?.groente,v?.salade,v?.saus].filter(Boolean)}function draw(){let h='',days=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];for(let w=0;w<4;w++){let cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),mm=m(ds),dd=de(ds),bb=bs(ds),complete=!!mm&&!!dd,open=opened===ds,miss=!mm&&!dd?'Menu en dessert nog kiezen':!mm?'Menu nog kiezen':!dd?'Dessert nog kiezen':'';let ordinary=mm?mv.find(v=>v.menu_id===mm.id&&v.variant_type==='gewoon'):null;let vs=mm?mv.filter(v=>v.menu_id===mm.id):[];cards+=`<article class="day ${complete?'complete':''} ${open?'open':''}"><button class="dayhead" onclick="toggle('${ds}')"><span class="calendar"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nl-NL',{month:'short'}).replace('.','')}</small></span><span><span class="dayname">${days[i]}</span><div class="preview">${mm?mm.name:'Nog geen menu'}</div>${miss?`<div class="missing">${miss}</div>`:''}</span><span class="status">${complete?'<span class="check">✓</span>':''}<span class="chev">${open?'▴':'▾'}</span></span></button><div class="body"><div class="inside"><div class="item menu"><div class="label">🍽️ Menu</div>${mm?`<div class="name">${mm.name}</div>${ordinary?`<div class="variant">${parts(ordinary).join(' · ')}</div>`:''}<div class="variants">${['gewoon','lactosevrij','veggie','veggie_lf'].map(t=>{let v=vs.find(x=>x.variant_type===t),lab={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'}[t];return v?`<div class="variant"><b>${lab}</b>${parts(v).join(' · ')}</div>`:''}).join('')}</div>`:'<div class="none">Nog niet gepland</div>'}</div><div class="item dessert"><div class="label">🍨 Dessert</div>${dd?`<div class="name">${dd.name}</div>`:'<div class="none">Nog niet gepland</div>'}</div>${bb.length?`<div class="item baking"><div class="label">🍰 Bakken & snacks</div><div class="extras">${bb.map(x=>`<span class="tag">${x.name}</span>`).join('')}</div></div>`:''}</div><a class="edit" href="plannen.html">Planning wijzigen →</a></div></article>`}h+=`<section><div class="weektitle"><h2>Week ${w+1}</h2><span>${(()=>{let a=new Date(start);a.setDate(start.getDate()+w*7);let z=new Date(a);z.setDate(a.getDate()+6);return a.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})+' – '+z.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})})()}</span></div><div class="cards">${cards}</div></section>`}weeks.innerHTML=h}function toggle(ds){opened=opened===ds?'':ds;draw()}load().catch(e=>{console.error(e);weeks.innerHTML='<div style="padding:20px;background:white;border-radius:16px">Planning kon niet worden geladen.</div>'});</script></body></html>
