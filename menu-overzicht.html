<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn planning · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#edf4e9;--peach:#fff0e2;--line:#e9e2d8;--shadow:0 8px 26px rgba(60,70,60,.07)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{text-align:center;padding:11px;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:125px;height:40px;object-fit:contain}main{max-width:980px;margin:auto;padding:20px 18px 60px}.back,.edit{color:var(--green);text-decoration:none;font-weight:800;font-size:13px}.top{margin:16px 0 20px}.top h1{font-size:30px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.weekbox{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.weeknav{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:18px}.navbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer}.weekcenter{text-align:center}.weekcenter h2{margin:0;font-size:23px}.range{font-size:12px;color:var(--muted);margin-top:3px}.navextras{display:flex;justify-content:center;gap:8px;margin-top:9px}.todaybtn{border:0;background:var(--sage);color:#506d53;border-radius:10px;padding:7px 11px;font-weight:800;cursor:pointer}.datepick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font:inherit;color:var(--ink);width:142px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.day{background:#fffdf9;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 5px 16px rgba(60,70,60,.045)}.day.complete{border-color:#cadbc6}.day.todaycard{border:2px solid #d6a97d}.day.open{grid-column:1/-1;border:2px solid #9eb79b}.dayhead{width:100%;border:0;background:transparent;padding:17px;display:flex;align-items:flex-start;gap:14px;text-align:left;color:var(--ink);cursor:pointer}.complete .dayhead{background:linear-gradient(100deg,#fbfdf9,#f4f9f1)}.open .dayhead{background:linear-gradient(110deg,#dfead9,#eef4e9);padding:20px}.date{width:55px;height:60px;flex:0 0 55px;border-radius:16px;background:var(--peach);display:flex;flex-direction:column;align-items:center;justify-content:center}.complete .date{background:var(--sage)}.date b{font-size:24px}.date small{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:900}.daymain{min-width:0;flex:1}.dayname{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:900}.todaybadge{display:inline-block;background:#d6a97d;color:#fff;border-radius:99px;padding:3px 7px;font-size:9px;font-weight:900;margin-left:7px}.preview{font-size:20px;font-weight:800;margin:4px 0}.dessertline{font-size:12px;color:#8b7463}.headcounts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.hc,.pill{font-size:11px;background:#fff;border:1px solid #eee7dd;border-radius:99px;padding:4px 7px}.no-counts,.none{font-size:11px;color:#a18e7c;margin-top:8px}.status{margin-left:auto}.check{display:inline-flex;width:27px;height:27px;border-radius:50%;background:var(--green);color:white;align-items:center;justify-content:center;font-weight:900}.body{display:none;border-top:1px solid #d9e3d5;padding:18px;background:#f7faf5}.open .body{display:block}.countbar,.item{background:#fff;border:1px solid #dfe8dc;border-radius:14px;padding:12px;margin-bottom:12px}.countline,.itemtop,.pills{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.countline,.itemtop{justify-content:space-between}.quick{border:0;background:none;color:var(--green);font-weight:800;cursor:pointer}.choose{border:0;background:#e9f1e5;color:#506d53;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.dessert .choose{background:#fff0e2;color:#9b6843}.countedit{display:none;margin-top:10px}.countedit.open{display:block}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.save{margin-top:8px;border:0;border-radius:10px;background:var(--green);color:white;padding:8px 13px;font-weight:800;cursor:pointer}.content{display:grid;gap:12px}.menu{border-top:5px solid #9eb79b}.dessert{border-top:5px solid #e5b98f}.label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:900}.name{font-size:20px;font-weight:800;margin:5px 0 11px}.variants{display:grid;gap:7px}.variantrow{display:grid;grid-template-columns:150px 1fr;gap:12px;background:#f9fbf8;border-radius:12px;padding:10px}.variantrow.zero{display:none}.variantwho{font-size:12px;font-weight:900;color:var(--green)}.variantfood{font-size:13px}.edit{display:inline-block;margin-top:12px}.picker{display:none;position:fixed;inset:0;background:#26302966;z-index:10;align-items:center;justify-content:center;padding:16px}.picker.open{display:flex}.pickbox{width:min(650px,100%);max-height:85vh;overflow:auto;background:var(--bg);border-radius:22px;padding:18px}.picktop{display:flex;justify-content:space-between}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:14px 0}.result{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:7px 0;cursor:pointer}@media(max-width:680px){.cards{grid-template-columns:1fr}.day.open{grid-column:auto}.fields{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="start.html">← Keukenhulp</a><div class="top"><h1>🗂️ Mijn planning</h1><div class="sub">Je menuweek in één oogopslag.</div></div><section class="weekbox"><div class="weeknav"><button class="navbtn" onclick="move(-7)">‹ Vorige</button><div class="weekcenter"><h2 id="weekTitle"></h2><div id="range" class="range"></div><div class="navextras"><button class="todaybtn" onclick="goToday()">Vandaag</button><input id="jumpDate" class="datepick" type="date" onchange="jump(this.value)"></div></div><button class="navbtn" onclick="move(7)">Volgende ›</button></div><div id="cards" class="cards"></div></section></main><div id="picker" class="picker"><div class="pickbox"><div class="picktop"><h2>🍨 Dessert kiezen</h2><button class="close" onclick="closePicker()">✕</button></div><input id="dessertSearch" class="search" placeholder="Zoek dessert…" oninput="drawDesserts()"><div id="dessertResults"></div></div></div><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let menus=[],mv=[],desserts=[],dv=[],plans=[],opened='',editCount='',pickDate='',focusDate=new Date(),start=monday(focusDate);function monday(d){d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d}const iso=d=>{d=new Date(d);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};async function req(p,o={}){let r=await fetch(c.url+'/rest/v1/'+p,{...o,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function load(){let end=new Date(start);end.setDate(start.getDate()+7);[menus,mv,desserts,dv,plans]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name&order=name'),req('dessert_logical_variants?select=*'),req(`menu_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(end)}&select=*`)]);draw()}function p(ds){return plans.find(x=>x.plan_date===ds)||{}}function m(ds){let x=p(ds);return menus.find(y=>y.id===x.logical_menu_id)}function de(ds){let x=p(ds);return desserts.find(y=>y.id===x.logical_dessert_id)}function nums(pp){let total=+pp.diners_total||0,veg=+pp.diners_veggie||0,lf=+pp.diners_lactosevrij||0,vlf=+pp.diners_veggie_lf||0;return{total,veg,lf,vlf,normal:Math.max(0,total-veg-lf-vlf)}}function headCounts(pp){let n=nums(pp);if(!n.total)return'<div class="no-counts">👥 Aantallen nog invullen</div>';return`<div class="headcounts"><span class="hc">${n.normal} Normaal</span>${n.veg?`<span class="hc">🌱 ${n.veg} Veggie</span>`:''}${n.lf?`<span class="hc">${n.lf} LF</span>`:''}${n.vlf?`<span class="hc">🌱+LF ${n.vlf}</span>`:''}</div>`}function parts(v){return[v?.hoofdcomponent,v?.stamppot||v?.zetmeel,v?.groente,v?.salade,v?.saus].filter(Boolean)}function rowsFor(pp,variants,id,key,field){let n=nums(pp),rows=[['gewoon','Normaal',n.normal],['lactosevrij','Lactosevrij',n.lf],['veggie','Veggie',n.veg],['veggie_lf','Veggie + LF',n.vlf]];return`<div class="variants">${rows.map(([t,l,count])=>{let v=variants.find(x=>x[key]===id&&x.variant_type===t),food=v?(field==='menu'?(parts(v).join(' · ')||'Nog niet ingevuld'):(v.uitvoering||'Nog niet ingevuld')):'Nog niet ingevuld';return`<div class="variantrow ${count?'':'zero'}"><div class="variantwho">${count} × ${l}</div><div class="variantfood">${food}</div></div>`}).join('')}</div>`}function countBox(ds,pp){let n=nums(pp);return`<div class="countbar"><div class="countline"><strong>👥 Aantallen</strong><button class="quick" onclick="editCounts('${ds}')">✏️ Wijzig aantallen</button></div><div class="pills"><span class="pill">Normaal ${n.normal}</span>${n.veg?`<span class="pill">Veggie ${n.veg}</span>`:''}${n.lf?`<span class="pill">LF ${n.lf}</span>`:''}${n.vlf?`<span class="pill">Veggie + LF ${n.vlf}</span>`:''}</div><div class="countedit ${editCount===ds?'open':''}"><div class="fields"><div class="field"><label>Aantal eters</label><input id="t-${ds}" type="number" value="${n.total}"></div><div class="field"><label>Veggie</label><input id="v-${ds}" type="number" value="${n.veg}"></div><div class="field"><label>Lactosevrij</label><input id="l-${ds}" type="number" value="${n.lf}"></div><div class="field"><label>Veggie + LF</label><input id="vl-${ds}" type="number" value="${n.vlf}"></div></div><button class="save" onclick="saveCounts('${ds}')">Opslaan</button></div></div>`}function draw(){let h='',days=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'],today=iso(new Date());for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),pp=p(ds),mm=m(ds),dd=de(ds),complete=!!mm&&!!dd,open=opened===ds,mvs=mm?mv.filter(v=>v.menu_id===mm.id):[];h+=`<article class="day ${complete?'complete':''} ${open?'open':''} ${ds===today?'todaycard':''}"><button class="dayhead" onclick="toggle('${ds}')"><span class="date"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nl-NL',{month:'short'}).replace('.','')}</small></span><span class="daymain"><span class="dayname">${days[i]}${ds===today?'<span class="todaybadge">VANDAAG</span>':''}</span><div class="preview">${mm?mm.name:'Nog geen menu'}</div><div class="dessertline">🍨 ${dd?dd.name:'Dessert nog kiezen'}</div>${headCounts(pp)}</span><span class="status">${complete?'<span class="check">✓</span>':''} ${open?'▴':'▾'}</span></button><div class="body">${countBox(ds,pp)}<div class="content"><div class="item menu"><div class="itemtop"><div class="label">🍽️ Menu</div><a class="choose" style="text-decoration:none" href="plannen.html?date=${ds}">${mm?'Wijzig menu':'＋ Menu kiezen'}</a></div>${mm?`<div class="name">${mm.name}</div>${rowsFor(pp,mvs,mm.id,'menu_id','menu')}`:'<div class="none">Nog niet gepland</div>'}</div><div class="item dessert"><div class="itemtop"><div class="label">🍨 Dessert</div><button class="choose" onclick="openDessertPicker('${ds}')">${dd?'Wijzig dessert':'＋ Dessert kiezen'}</button></div>${dd?`<div class="name">${dd.name}</div>${rowsFor(pp,dv,dd.id,'dessert_id','dessert')}`:'<div class="none">Nog niet gepland</div>'}</div></div><a class="edit" href="plannen.html?date=${ds}">Planning wijzigen →</a></div></article>`}document.getElementById('cards').innerHTML=h;let z=new Date(start);z.setDate(start.getDate()+6);document.getElementById('weekTitle').textContent='Week '+weekNo(start);document.getElementById('range').textContent=start.toLocaleDateString('nl-NL',{day:'numeric',month:'long'})+' – '+z.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});document.getElementById('jumpDate').value=iso(focusDate)}function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function move(n){focusDate=new Date(focusDate);focusDate.setDate(focusDate.getDate()+n);start=monday(focusDate);opened='';load()}function goToday(){focusDate=new Date();start=monday(focusDate);opened='';load()}function jump(v){if(!v)return;focusDate=new Date(v+'T12:00');start=monday(focusDate);opened='';load()}function toggle(ds){opened=opened===ds?'':ds;editCount='';draw()}function editCounts(ds){editCount=editCount===ds?'':ds;draw()}async function saveCounts(ds){let total=+document.getElementById('t-'+ds).value||0,veg=+document.getElementById('v-'+ds).value||0,lf=+document.getElementById('l-'+ds).value||0,vlf=+document.getElementById('vl-'+ds).value||0;if(veg+lf+vlf>total)return alert('De afwijkende aantallen zijn samen hoger dan het totaal.');let pp=p(ds),body={diners_total:total,diners_veggie:veg,diners_lactosevrij:lf,diners_veggie_lf:vlf,updated_at:new Date().toISOString()};if(pp.id)await req(`menu_plans?id=eq.${pp.id}`,{method:'PATCH',body:JSON.stringify(body)});else await req('menu_plans',{method:'POST',body:JSON.stringify({...body,house:0,start_date:iso(start),plan_date:ds})});editCount='';await load()}function openDessertPicker(ds){pickDate=ds;document.getElementById('dessertSearch').value='';drawDesserts();document.getElementById('picker').classList.add('open')}function closePicker(){document.getElementById('picker').classList.remove('open')}function drawDesserts(){let q=document.getElementById('dessertSearch').value.toLowerCase();let a=desserts.filter(x=>(x.name+' '+dv.filter(v=>v.dessert_id===x.id).map(v=>v.uitvoering||'').join(' ')).toLowerCase().includes(q));document.getElementById('dessertResults').innerHTML=a.map(x=>`<button class="result" onclick="chooseDessert(${x.id})"><strong>${x.name}</strong></button>`).join('')}async function chooseDessert(id){let pp=p(pickDate),body={logical_dessert_id:id,updated_at:new Date().toISOString()};if(pp.id)await req(`menu_plans?id=eq.${pp.id}`,{method:'PATCH',body:JSON.stringify(body)});else await req('menu_plans',{method:'POST',body:JSON.stringify({...body,house:0,start_date:iso(start),plan_date:pickDate})});opened=pickDate;closePicker();await load()}load();</script></body></html>
