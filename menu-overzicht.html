<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn planning · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#edf4e9;--peach:#fff0e2;--line:#e9e2d8;--shadow:0 7px 22px rgba(70,75,65,.07)}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:12px;text-align:center;background:linear-gradient(135deg,#dfe9dc,#f8e8d6)}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 50px}.back{color:var(--green);text-decoration:none;font-weight:700;font-size:13px}h1{margin:16px 0 3px;font-size:29px}.sub{color:var(--muted);margin-bottom:23px}.weeks{display:grid;gap:22px}.weektitle{display:flex;gap:10px;align-items:center;margin:0 0 10px 3px}.weektitle h2{font-size:17px;margin:0}.weektitle span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.day{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden}.day.complete{border-color:#cbdcc7}.day.open{grid-column:1/-1}.dayhead{width:100%;border:0;background:#fff;color:var(--ink);padding:15px 17px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer}.complete .dayhead{background:linear-gradient(90deg,#fbfdf9,#f4f9f1)}.calendar{width:47px;height:47px;flex:0 0 47px;border-radius:14px;background:var(--peach);display:flex;flex-direction:column;align-items:center;justify-content:center}.complete .calendar{background:var(--sage)}.calendar b{font-size:18px;line-height:18px}.calendar small{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}.dayname{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:900}.preview{font-size:15px;font-weight:800;margin-top:2px}.missing{font-size:12px;color:#a18e7c;margin-top:3px}.status{margin-left:auto;display:flex;align-items:center;gap:9px}.check{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.chev{color:#98a098}.body{display:none;border-top:1px solid #f0ece6;padding:16px;background:#fff}.open .body{display:block}.countbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#f7f5ef;border-radius:14px;padding:10px 12px;margin-bottom:12px}.countbar strong{margin-right:4px}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}.content{display:grid;grid-template-columns:1.3fr .7fr;gap:11px}.item{border-radius:16px;padding:15px;border:1px solid #eee9e1}.menu{background:#f7faf5}.dessert{background:#fff8f1}.baking{grid-column:1/-1;background:#faf8f3}.label{font-size:11px;text-transform:uppercase;font-weight:900;color:var(--muted);letter-spacing:.05em}.name{font-size:19px;font-weight:800;margin:4px 0 10px}.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab{border:1px solid #dce5d8;background:#fff;color:var(--ink);border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.variantbox{margin-top:10px;background:#fff;border-radius:12px;padding:11px;font-size:13px;line-height:1.5}.none{font-size:13px;color:#a49f98;margin-top:6px}.extras{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.edit{display:inline-block;margin-top:12px;color:var(--green);font-size:12px;font-weight:800;text-decoration:none}.legend{display:flex;align-items:center;gap:7px;margin:-12px 0 20px;font-size:12px;color:var(--muted)}.legend .check{width:20px;height:20px;font-size:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.day.open{grid-column:auto}.content{grid-template-columns:1fr}.baking{grid-column:auto}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="start.html">← Keukenhulp</a><h1>🗂️ Mijn planning</h1><div class="sub">Klik op een dag om te zien wat er gepland staat.</div><div class="legend"><span class="check">✓</span> Menu én dessert zijn gepland</div><div id="weeks" class="weeks"></div></main><script src="supabase-config.js"></script><script>const c=window.GASTENHUIS_SUPABASE;let menus=[],mv=[],desserts=[],bakes=[],plans=[],bp=[],opened='',active={};const monday=d=>{d=new Date(d);let n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(12,0,0,0);return d},start=monday(new Date()),iso=d=>d.toISOString().slice(0,10);async function req(p){let r=await fetch(c.url+'/rest/v1/'+p,{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){[menus,mv,desserts,bakes,plans,bp]=await Promise.all([req('menu_logical_cards?gearchiveerd=eq.false&select=id,name'),req('menu_logical_variants?select=*'),req('dessert_logical_cards?gearchiveerd=eq.false&select=id,name'),req('baking_logical_cards?gearchiveerd=eq.false&select=id,name'),req(`menu_plans?house=eq.0&start_date=eq.${iso(start)}&select=*`),req(`daily_baking_plans?house=eq.0&plan_date=gte.${iso(start)}&plan_date=lt.${iso(new Date(start.getTime()+28*86400000))}&select=*`)]);draw()}function p(ds){return plans.find(x=>x.plan_date===ds)||{}}function m(ds){let x=p(ds);return menus.find(y=>y.id===x.logical_menu_id)}function de(ds){let x=p(ds);return desserts.find(y=>y.id===x.logical_dessert_id)}function bs(ds){return bp.filter(x=>x.plan_date===ds).map(x=>bakes.find(y=>y.id===x.baking_id)).filter(Boolean)}function parts(v){return [v?.hoofdcomponent,v?.stamppot||v?.zetmeel,v?.groente,v?.salade,v?.saus].filter(Boolean)}function variant(ds,id,vs){let t=active[ds]||'gewoon',v=vs.find(x=>x.variant_type===t),labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};return `<div class="tabs">${['gewoon','lactosevrij','veggie','veggie_lf'].map(k=>`<button class="tab ${k===t?'active':''}" onclick="event.stopPropagation();setVariant('${ds}','${k}')">${labels[k]}</button>`).join('')}</div><div class="variantbox">${v?parts(v).join(' · '):'Nog niet ingevuld'}</div>`}function draw(){let h='',days=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];for(let w=0;w<4;w++){let cards='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+w*7+i);let ds=iso(d),pp=p(ds),mm=m(ds),dd=de(ds),bb=bs(ds),complete=!!mm&&!!dd,open=opened===ds,miss=!mm&&!dd?'Menu en dessert nog kiezen':!mm?'Menu nog kiezen':!dd?'Dessert nog kiezen':'';let vs=mm?mv.filter(v=>v.menu_id===mm.id):[],total=+pp.diners_total||0,veg=+pp.diners_veggie||0,lf=+pp.diners_lactosevrij||0,vlf=+pp.diners_veggie_lf||0,normal=Math.max(0,total-veg-lf-vlf);cards+=`<article class="day ${complete?'complete':''} ${open?'open':''}"><button class="dayhead" onclick="toggle('${ds}')"><span class="calendar"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nl-NL',{month:'short'}).replace('.','')}</small></span><span><span class="dayname">${days[i]}</span><div class="preview">${mm?mm.name:'Nog geen menu'}</div>${miss?`<div class="missing">${miss}</div>`:''}</span><span class="status">${complete?'<span class="check">✓</span>':''}<span class="chev">${open?'▴':'▾'}</span></span></button><div class="body">${total?`<div class="countbar"><strong>👥 ${total} eters</strong><span class="pill">Gewoon ${normal}</span>${veg?`<span class="pill">Veggie ${veg}</span>`:''}${lf?`<span class="pill">Lactosevrij ${lf}</span>`:''}${vlf?`<span class="pill">Veggie + lactosevrij ${vlf}</span>`:''}</div>`:''}<div class="content"><div class="item menu"><div class="label">🍽️ Menu</div>${mm?`<div class="name">${mm.name}</div>${variant(ds,mm.id,vs)}`:'<div class="none">Nog niet gepland</div>'}</div><div class="item dessert"><div class="label">🍨 Dessert</div>${dd?`<div class="name">${dd.name}</div>`:'<div class="none">Nog niet gepland</div>'}</div>${bb.length?`<div class="item baking"><div class="label">🍰 Bakken & snacks</div><div class="extras">${bb.map(x=>`<span class="pill">${x.name}</span>`).join('')}</div></div>`:''}</div><a class="edit" href="plannen.html">Planning wijzigen →</a></div></article>`}let a=new Date(start);a.setDate(start.getDate()+w*7);let z=new Date(a);z.setDate(a.getDate()+6);h+=`<section><div class="weektitle"><h2>Week ${w+1}</h2><span>${a.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} – ${z.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</span></div><div class="cards">${cards}</div></section>`}weeks.innerHTML=h}function toggle(ds){opened=opened===ds?'':ds;draw()}function setVariant(ds,t){active[ds]=t;draw()}load().catch(e=>{console.error(e);weeks.innerHTML='<div>Planning kon niet worden geladen.</div>'});</script></body></html>
