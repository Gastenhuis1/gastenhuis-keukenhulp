<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastenhuis – Menubouwer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#fffaf3}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="menu-builder-v5.html" title="Gastenhuis Menubouwer"></iframe><script>(function(){const f=document.getElementById('app');function sync(){try{const d=f.contentDocument;const cat=d.querySelector('#catTabs button.active');const sel=d.querySelector('#dbCategory');if(!cat||!sel)return;let c=cat.textContent.trim();if(c==='Vlees/vis/kip')c='Vlees';const opt=[...sel.options].find(o=>o.value===c||o.textContent.trim()===c);if(opt){sel.value=opt.value;sel.dispatchEvent(new Event('change',{bubbles:true}));}}catch(e){}}f.addEventListener('load',function(){const d=f.contentDocument;if(!d)return;d.addEventListener('click',function(e){const b=e.target.closest('#catTabs button');if(b)setTimeout(sync,0);const db=e.target.closest('#dbBtn');if(db)setTimeout(sync,0);},true);new MutationObserver(sync).observe(d.body,{childList:true,subtree:true});setTimeout(sync,200);});})();</script></body></html>
