<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desserts · Het Gastenhuis</title><style>:root{--bg:#fffaf3;--ink:#34433b;--muted:#718078;--green:#6f8f72;--sage:#dfe9dc;--line:#e9e2d8;--shadow:0 8px 24px #3c463c14}*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:14px 16px;background:linear-gradient(135deg,var(--sage),#f8e8d6);text-align:center}header img{width:130px;height:42px;object-fit:contain}main{max-width:1050px;margin:auto;padding:20px 16px 50px}.back{display:inline-block;color:var(--green);font-weight:800;text-decoration:none;margin-bottom:10px}h1{margin:12px 0 4px}.sub,.status{color:var(--muted)}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;margin:20px 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.title{font-size:20px;font-weight:800;margin-bottom:10px}.variant{padding:9px 0;border-top:1px solid #f0ece6}.variant:first-of-type{border-top:0}.vhead{font-size:13px;font-weight:800}.execution{font-size:14px;margin-top:4px}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="gastenhuis-logo.png"></header><main><a class="back" href="menu-overzicht.html">← Terug naar 4-wekenmenu</a><h1>🍨 Desserts</h1><div class="sub">Gewoon · Lactosevrij · Veggie · Veggie lactosevrij</div><input id="search" class="search" placeholder="Zoek dessert…" oninput="draw()"><div id="status" class="status">Laden…</div><div id="grid" class="grid"></div></main><script>const U='https://cttotbzkcluauzzgnybh.supabase.co';let K='',cards=[],variants=[];async function key(){let t=await fetch('index.html').then(r=>r.text());let m=t.match(/const\s+SUPABASE_(?:ANON_)?KEY\s*=\s*['\"]([^'\"]+)/i)||t.match(/const\s+SB_KEY\s*=\s*['\"]([^'\"]+)/i);K=m?.[1]||''}async function sb(p){let r=await fetch(U+'/rest/v1/'+p,{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(await r.text());return r.json()}const e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const labels={gewoon:'Gewoon',lactosevrij:'Lactosevrij',veggie:'Veggie',veggie_lf:'Veggie lactosevrij'};function block(type,vs){let v=vs.find(x=>x.variant_type===type);return v?`<div class="variant"><div class="vhead">${labels[type]}</div><div class="execution">${e(v.uitvoering)}</div></div>`:''}function draw(){let q=search.value.trim().toLowerCase();let a=cards.filter(c=>{let vs=variants.filter(v=>v.dessert_id===c.id);return [c.name,...vs.map(v=>v.uitvoering)].join(' ').toLowerCase().includes(q)});grid.innerHTML=a.length?a.map(c=>{let vs=variants.filter(v=>v.dessert_id===c.id);return `<article class="card"><div class="title">${e(c.name)}</div>${['gewoon','lactosevrij','veggie','veggie_lf'].map(t=>block(t,vs)).join('')}</article>`}).join(''):'<div class="empty">Geen desserts gevonden.</div>'}async function load(){await key();try{cards=await sb('dessert_logical_cards?gearchiveerd=eq.false&select=*&order=name.asc');variants=await sb('dessert_logical_variants?select=*');status.textContent=cards.length+' dessertkaarten';draw()}catch(x){console.error(x);status.textContent='Desserts konden niet worden geladen.'}}load();</script></body></html>
